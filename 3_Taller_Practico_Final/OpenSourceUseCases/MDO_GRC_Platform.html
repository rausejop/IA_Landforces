<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MDO Secure-CIS GRC Platform — NATO Multi-Domain Use-Case and IER Manager</title>
<style>
:root{
  /* SHAPE / ACO brand constants — NATO Blue PMS 286 + NATO Gold */
  --nato-blue:#004990;--nato-blue-dark:#003366;--nato-blue-deep:#002147;--nato-blue-light:#6ea3da;
  --nato-gold:#c9a23a;--nato-gold-light:#e6c569;
  --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--info:#3b82f6;
  --font-sans:'Open Sans','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,monospace;
  /* default = dark console */
  --bg:#0a0e14;--bg-2:#0f1623;--bg-3:#182338;--bg-4:#1f2c44;--line:#1f2c44;--line-2:#2a3a57;
  --fg:#e6edf3;--fg-dim:#8b96a8;--fg-mute:#5a6678;
  --shadow:0 24px 70px rgba(0,0,0,.6);
}
/* SHAPE light theme — white surfaces, NATO-blue accents, navy ink (shape.nato.int look) */
html[data-theme="light"]{
  --bg:#eef2f7;--bg-2:#ffffff;--bg-3:#e8eef5;--bg-4:#dbe4ee;--line:#d3dce6;--line-2:#bfccdb;
  --fg:#13233b;--fg-dim:#46586f;--fg-mute:#7b8a9e;
  --nato-gold:#8a6a12;--nato-gold-light:#6f5410;   /* darker bronze for text contrast on light */
  --nato-blue-light:#0a5bb0;
  --shadow:0 18px 50px rgba(8,28,56,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--nato-blue-light);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px}::-webkit-scrollbar-track{background:var(--bg)}

.cls-banner{background:#16a34a;color:#fff;text-align:center;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;padding:3px;flex:0 0 auto}
.cls-banner select{background:transparent;border:0;color:#fff;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer}
.cls-banner select option{color:#000}

/* top bar */
header.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(90deg,var(--nato-blue-deep),var(--nato-blue));color:#fff;border-bottom:2px solid var(--nato-gold)}
header.top a{color:#fff}
.emblem{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#0a559a,#003F87 60%,#001b4d);border:2px solid var(--nato-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emblem svg{width:26px;height:26px}
.brand .eyebrow{color:var(--nato-gold);font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase}
.brand h1{font-size:1.0rem;font-weight:700;line-height:1.15}
.top .spacer{flex:1}
.navhist{display:flex;gap:3px}
/* global search */
.gsearch-wrap{position:relative;flex:0 1 280px;min-width:150px}
.gsearch{width:100%;background:rgba(255,255,255,.95);border:1px solid var(--nato-gold);border-radius:7px;padding:7px 11px;font-size:0.84rem;color:#13233b}
.gsearch::placeholder{color:#5a6678}
.gsearch:focus{outline:none;box-shadow:0 0 0 2px rgba(201,162,58,.5)}
.gsearch-results{position:absolute;top:calc(100% + 6px);left:0;width:min(520px,86vw);max-height:60vh;overflow:auto;background:var(--bg-2);border:1px solid var(--nato-blue);border-radius:9px;box-shadow:var(--shadow);z-index:50;display:none}
.gsearch-results.show{display:block}
.gsearch-results .gsr-grp{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);padding:7px 12px 3px;position:sticky;top:0;background:var(--bg-2)}
.gsearch-results a{display:flex;gap:8px;align-items:baseline;padding:6px 12px;color:var(--fg);cursor:pointer;font-size:0.84rem;border-top:1px solid var(--line)}
.gsearch-results a:hover{background:var(--bg-3)}
.gsearch-results a .gsr-id{font-family:var(--font-mono);font-size:0.7rem;color:var(--nato-blue-light);white-space:nowrap}
.gsearch-results a .gsr-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsearch-results .gsr-empty{padding:12px;color:var(--fg-mute);font-size:0.82rem}
.aco-logo{height:38px;width:auto;flex-shrink:0;background:#fff;border-radius:6px;padding:2px 4px;border:1px solid var(--nato-gold)}
.navhist .btn{padding:4px 8px;font-size:0.72rem}
.top .tools{display:flex;gap:6px;align-items:center}
.dom-switch{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dom-pill{font-family:var(--font-mono);font-size:0.66rem;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg-dim);cursor:pointer;transition:all .12s}
.dom-pill:hover{border-color:var(--nato-blue-light);color:var(--fg)}
.dom-pill.active{background:var(--nato-blue);border-color:var(--nato-gold);color:#fff}

.btn{font-family:var(--font-mono);font-size:0.66rem;font-weight:600;letter-spacing:0.03em;padding:6px 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--nato-blue-light);background:var(--bg-3)}
.btn.gold{border-color:var(--nato-gold);color:var(--nato-gold-light)}
.btn.gold:hover{background:rgba(203,161,53,0.12)}
.btn.primary{background:var(--nato-blue);border-color:var(--nato-blue);color:#fff}
.btn.primary:hover{background:var(--nato-blue-dark)}
.btn.danger{border-color:#7f1d1d;color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,0.12)}
.btn.sm{font-size:0.6rem;padding:3px 7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* layout */
.shell{flex:1;display:flex;min-height:0}
aside.side{flex:0 0 248px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.side .grp{margin-bottom:12px}
.side .grp-h{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold);padding:5px 9px;display:flex;align-items:center;gap:6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--fg-dim);font-size:0.83rem;cursor:pointer}
.nav a:hover{background:var(--bg-3);color:var(--fg);text-decoration:none}
.nav a.active{background:var(--nato-blue);color:#fff}
.nav a .ct{margin-left:auto;font-family:var(--font-mono);font-size:0.6rem;color:var(--fg-mute);background:var(--bg-4);border-radius:10px;padding:0 7px}
.nav a.active .ct{color:#cfe0ff;background:rgba(255,255,255,0.14)}

main.content{flex:1;overflow-y:auto;padding:18px 22px 60px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.page-h .eyebrow{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold)}
.page-h h2{font-size:1.3rem;line-height:1.1}
.page-h .sub{color:var(--fg-dim);font-size:0.84rem;margin-top:2px}
.page-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.crumbs{font-family:var(--font-mono);font-size:0.66rem;color:var(--fg-mute);margin-bottom:8px}
.crumbs a{color:var(--nato-blue-light);cursor:pointer}

/* search */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 11px;color:var(--fg);font-size:0.85rem}
.search:focus{outline:none;border-color:var(--nato-blue-light)}
.filtsel{background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-size:0.8rem}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:var(--bg-2)}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead th{position:sticky;top:0;background:var(--bg-3);text-align:left;padding:8px 11px;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg-3)}
tbody tr:last-child td{border-bottom:0}
td .rowacts{display:flex;gap:4px;white-space:nowrap}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg-mute)}
.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* chips */
.chip{display:inline-block;font-family:var(--font-mono);font-size:0.6rem;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:0.04em;border:1px solid var(--line-2);color:var(--fg-dim);white-space:nowrap}
.chip.link{cursor:pointer}.chip.link:hover{filter:brightness(1.25);text-decoration:none}
.cls{padding:1px 7px;border-radius:5px;font-weight:700;font-size:0.6rem;letter-spacing:0.06em;font-family:var(--font-mono)}

/* risk meter */
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--bg-4);display:inline-block}
.meter i.on{background:var(--warn)}
.meter i.on.hi{background:var(--bad)}
.meter i.on.lo{background:var(--ok)}

/* dashboard cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--line);border-left:3px solid var(--nato-blue);border-radius:9px;padding:13px 15px}
.card .k{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-mute)}
.card .v{font-size:1.7rem;font-weight:700;margin:2px 0}
.card .d{font-size:0.76rem;color:var(--fg-dim)}
.card.gold{border-left-color:var(--nato-gold)}
.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.panel h3{font-size:0.72rem;font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:10px}
.bar{height:9px;border-radius:5px;background:var(--bg-4);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.74rem;color:var(--fg-dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* detail */
.detail{display:grid;grid-template-columns:1fr;gap:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.field{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.field .fk{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:3px}
.field .fv{font-size:0.86rem;white-space:pre-wrap;word-break:break-word}
.field .fv ul{margin:0;padding-left:18px}
.grouphd{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-blue-light);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,0.74);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:28px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--nato-blue);border-radius:12px;width:min(820px,100%);box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);border-radius:12px 12px 0 0}
.modal-h h3{font-size:1rem}.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg-2);border-radius:0 0 12px 12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld.wide{grid-column:1/-1}
.fld label{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-dim)}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font-size:0.84rem;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--nato-blue-light)}
.fld textarea{min-height:62px;resize:vertical;font-family:inherit}
.fld .hint{font-size:0.68rem;color:var(--fg-mute)}
.modal-sec{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{font-family:var(--font-mono);font-size:0.74rem;padding:9px 16px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--ok);color:#bbf7d0}.toast.err{border-color:var(--bad);color:#fecaca}.toast.info{border-color:var(--nato-blue-light)}

.empty{text-align:center;color:var(--fg-mute);padding:40px;font-size:0.9rem}
.kbd{font-family:var(--font-mono);font-size:0.66rem;background:var(--bg-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
.note{font-size:0.78rem;color:var(--fg-dim);border-left:3px solid var(--nato-gold);background:rgba(203,161,53,0.06);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.rich{font-size:0.9rem;line-height:1.6}
.rich p{margin:0 0 8px}.rich ul,.rich ol{margin:0 0 8px 0;padding-left:20px}.rich li{margin:2px 0}
.rich h3,.rich h4{color:var(--nato-gold);font-size:0.86rem;margin:10px 0 5px}
.rich a{border-bottom:1px dotted}.rich strong,.rich b{color:var(--fg)}
.rich code{font-family:var(--font-mono);background:var(--bg-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:0.82rem}
.rich table{margin:6px 0}.rich th,.rich td{border:1px solid var(--line);padding:4px 8px}
.tabrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:7px 13px;font-size:0.8rem;color:var(--fg-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--nato-gold)}
@media(max-width:880px){aside.side{position:fixed;z-index:40;height:100%;left:-260px;transition:left .2s}aside.side.open{left:0}.modal-b{grid-template-columns:1fr}}

/* ----- C3 Taxonomy hierarchical accordion (native <details>) ----- */
.tax-tree{font-size:0.86rem}
.tax-node{border-left:1px solid var(--line);margin:2px 0 2px 4px;padding-left:8px}
.tax-node>summary{cursor:pointer;padding:5px 6px;border-radius:6px;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tax-node>summary:hover{background:var(--bg-3)}
.tax-node>summary::-webkit-details-marker{display:none}
.tax-node>summary::before{content:'▸';color:var(--nato-gold);display:inline-block;width:0.9em;transition:transform .12s;flex:0 0 auto}
.tax-node[open]>summary::before{transform:rotate(90deg)}
.tax-body{padding:1px 0 2px 12px}
.tax-leaves{margin:3px 0 6px 16px;color:var(--fg-dim)}
.tax-leaves li{margin:1px 0}
.tax-svcs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 7px 16px}

/* ----- cited-acronym auto-links (hover = meaning + source; click = Acronyms table) ----- */
abbr.acr{cursor:pointer;border-bottom:1px dotted var(--nato-gold-light);text-decoration:none;color:inherit}
abbr.acr:hover{color:var(--nato-gold-light);background:rgba(203,161,53,0.10)}

/* ----- Technical-Report document (full linear flow + print/PDF) ----- */
.doc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.doc-cls,.doc-cls-bottom{display:none}
.rpt-sec{margin-bottom:18px}
#printdoc .rpt-sec{border:1px solid var(--line);border-radius:9px;padding:16px 18px;background:var(--bg-2)}
.rpt-h{font-size:1.15rem;color:var(--fg);border-bottom:2px solid var(--nato-gold);padding-bottom:6px;margin-bottom:12px}
.rpt-h3{color:var(--nato-gold);margin:14px 0 8px;font-size:0.92rem;font-family:var(--font-mono)}
.toc{padding-left:22px;line-height:1.95}
@media print{
  /* paged-media trick: running header (reference) + footer with "Page X of Y".
     Honoured by engines with @page margin-box support; the fixed bars below are
     the fallback that always render the reference and classification in Chrome. */
  @page{ size:A4; margin:18mm 14mm 18mm }   /* running header/footer margin-boxes injected at runtime (App.syncPrintHeader) with the live reference + classification */
  html,body{height:auto;overflow:visible;background:#fff;color:#000;display:block;font-size:10.5pt}
  .cls-banner,header.top,aside.side,#toast,.overlay,.doc-actions,.page-h .acts,.crumbs,.btn,.navhist{display:none !important}
  .shell{display:block;min-height:0}
  main.content{overflow:visible;padding:0;display:block}
  #printdoc .rpt-sec{break-before:page;page-break-before:always;border:0;background:#fff;padding:0 0 6pt}
  #printdoc .rpt-sec.cover{break-before:auto;page-break-before:auto}
  tr,.card,.tax-node{break-inside:avoid;page-break-inside:avoid}   /* keep rows/cards whole; let big tables flow across pages */
  thead{display:table-header-group}                                /* repeat column headers on each page a table spans */
  .rpt-h,.rpt-h3,h2,h3,.panel>h3{break-after:avoid;page-break-after:avoid}   /* no orphaned headings */
  .doc-cls,.doc-cls-bottom{display:flex !important;position:fixed;left:8mm;right:8mm;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:7.5pt;letter-spacing:0.5px;color:#003F87;gap:8px}
  .doc-cls .dc,.doc-cls-bottom .dc{flex:1;text-align:center;letter-spacing:1.5px;font-weight:700}
  .doc-cls .dl,.doc-cls-bottom .dl{font-weight:700;white-space:nowrap}
  .doc-cls .dr,.doc-cls-bottom .dr{white-space:nowrap}
  .doc-cls{top:7mm} .doc-cls-bottom{bottom:7mm}
  .panel,.tbl-wrap,.card{background:#fff !important;border-color:#bbb;box-shadow:none;margin-bottom:8pt}
  .rpt-h{color:#003F87;border-bottom-color:#cba135} .rpt-h3,.card .v,.field .fk,.panel h3{color:#003F87 !important}
  table{font-size:8.5pt;width:100%} thead th{background:#003F87 !important;color:#fff !important}
  tbody td,thead th{border:1px solid #bbb}
  a{color:#000 !important;text-decoration:none}
  .chip,.cls{border:1px solid #999;color:#222 !important;background:#fff !important}
  abbr.acr,.reflink{border-bottom:none !important;background:none !important;color:inherit !important}
  b,strong,.rich b,.rich strong{color:#003F87 !important}
  .rich,.rich p,.rich li,.field .fv,td,p{color:#111 !important}
  .doc-cls,.doc-cls-bottom{display:none !important}   /* redundant with @page margin-boxes; avoid content overlap */
  .muted,.fg-dim{color:#555 !important}
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
}
</style>
<script>/* set theme + language before first paint to avoid a flash */
(function(){try{
  document.documentElement.setAttribute('data-theme', localStorage.getItem('mdo.theme')||'light');
  document.documentElement.setAttribute('lang', localStorage.getItem('mdo.lang')||'en');
}catch(e){}})();</script>
</head>
<body>

Use Case ID — UC-X-nnn (X = domain letter)","mapsTo":"id","authority":"C3 Taxonomy / NAF v4","definition":"Ranges UC-X-001…UC-X-nnn, related one-by-one to the corresponding Serials / Requirements / Capability Elements (CapElem). X is the operational domain (M·L·A)."},{"key":"DESC","name":"Description","mapsTo":"sub","authority":"Natural language","definition":"Plain-language statement of the Use Case, e.g. \"Ship in the Arctic (C2D2E) under EW/IW threat must send classified (up to Secret) formal messages to a mission-partner shore HQ\"."},{"key":"TC01","name":"Frequencies","mapsTo":"equipment","authority":"MC 0195/13 · C3 Taxonomy","definition":"Source/Sink transmission services and Footprint. Extracted from MC 0195/13 REQs Table v70 and aligned with the C3 Taxonomy Communications branch: the bearer is a Transmission Service (CO-… — CIS Security CO-1051, SMC CO-1057, Wired CO-1071, Wireless LOS Static CO-1083 / Mobile CO-1080, Wireless BLOS Static CO-1077 / Mobile CO-1074, Optical CO-1086), managed via EMCON. Footprint is one of Shore · Shore LOS · HF · LOS · BLOS · SATCOM · TACSAT."},{"key":"TC02","name":"Temporal Window","mapsTo":"timeWindow","authority":"COPD · ADatP-3 / APP-11","definition":"Operational link duration and Required Time of Arrival (RTA) for data packets. Continuous / always-on links (Continuous; Continuous near-real-time; Continuous RTA; Continuous event-driven on bearer loss), Event-driven / tactical links (Event-driven on contact; Real-time seconds on engagement; Tasking-cycle / event cues) and Mission-/operation-driven windows (Mission-driven live during sortie; Operation-driven; Reporting cycle). Requires further standardisation against FMN OCP appendices and ADatP-3 / APP-11 MTF \"Timeliness\" and \"Link Duration\" entries."},{"key":"TC03","name":"Environment — Track Identity","mapsTo":"env","authority":"AIDPP-01 · STANAG 4162 Ed 3 · STANAG 4676 · STANAG 4193","definition":"C2D2E (C2 in Denied and Degraded Environments — also termed DDIL: Denied, Disrupted, Intermittent and Limited) / High-Assurance / EPM environment associated with IFF identification. Standard identities per AIDPP-01 Ed A (STANAG 4162 Ed 3, IDCP / STD-00797) and STANAG 4676 IFFCodeField (STANAG 4193): Unknown, Assumed Friend, Friend, Neutral, Suspect, Hostile — plus the exercise Identity-Amplification literals Faker, Joker, Kilo, Traveler, Zombie. Candidate in PFL-00512 and PFL-00170."},{"key":"TC04","name":"Zones and CoIs","mapsTo":"zones","authority":"C3 Taxonomy","definition":"Designated NATO geographical zones or specific Communities of Interest (CoI), drawn from the C3 Domain and Functional services (CI-…): Domain services (Joint CI-1061, Air CI-1005, Maritime CI-1067, Land CI-1062, Space CI-1112, Cyberspace CI-1029) and Functional services (ISR CI-1055, EW CI-1041, Environmental CI-1045, Logistics CI-1063, Medical CI-1070, CIMIC CI-1020, ETEE CI-1047, CIS CI-1021)."},{"key":"TC05","name":"Collaboration with NNN / IO","mapsTo":"releasability","authority":"FMN","definition":"Coordination with Non-NATO Nations (NNN) and International Organisations (IO); adheres to the applicable FMN (Federated Mission Networking) Spiral. E.g. non-combatant vessel types are role-specific and may carry an armed / combat capability intended primarily for self-defence."},{"key":"TC06","name":"IER","mapsTo":"ier","authority":"MC 0195/13 REQ CapElems v70","definition":"Information Exchange Requirements; describe the desired performance in terms of Capability Elements (CapElem) with status R (Required) / P (Planned) / F (Projected). Extracted from MC 0195/13 REQ CapElems Table v70 (Capability · References for Standards and Profiles · Specifications · Remarks) and aligned with the C3 Taxonomy (e.g. RA.201 Formal Messaging, RS.352 NATO Type B symmetric encryption, RC.443 Wireless BLOS Mobile Transmission)."},{"key":"TC07","name":"Availability","mapsTo":"avail","authority":"AJP-6 · SLA","definition":"Required uptime / accessibility level for the communications Service Level Agreement (SLA): Level 1 (99.98 %), Level 2 (99.8 %), Level 3 (99 %), Level 4 (98 %) — each defining monthly unplanned / planned downtime, degraded-service tolerance and max restore / recovery time / recovery point."},{"key":"TC08","name":"Classification","mapsTo":"cls","authority":"NATO security policy","definition":"Data sensitivity: NATO Unclassified (NU), NATO Restricted (NR), NATO Secret (NS) or Mission Secret (MS) — exchanged through Red (classified) or Black (unclassified) interfaces."},{"key":"TC09","name":"Risk (LPI/LPD)","mapsTo":"lpi","authority":"JP-3.6 · AJP-3.1 · ATP-3.6 / ATP-1","definition":"Low Probability of Intercept / Detection per JP-3.6 (Electronic Warfare) and AJP-3.1 ESM threats; sets the scene for ATP-3.6.2 (Land), ATP-3.6.3 (Air) and ATP-1 (Maritime) EW. Applicable only to transmission services relying on an SNR (Signal-to-Noise Ratio) indicator. STANAG 5665 / 4691 (tactical data links and MANET) define power control and directional tracking to limit the signal footprint; STANAG 7007 covers CSAR / survival beacons using LPI/LPD waveforms."},{"key":"TC10","name":"Environmental Conditions","mapsTo":"climate","authority":"AECTP-230 · STANAG 4866 · ACP-176 Ch.14","definition":"AECTP-230 / STANAG 4866 (May 2009) climatic categories: A1–A3 (hot dry), B1–B3 (wet), C0–C4 (cold) and M1–M3 (maritime), each with a temperature / humidity envelope. Temperature, humidity, air / hydrostatic pressure, icing, dust / sand and wetting define whether an environment is operational or a risk. ACP-176 Ch.14 (MC2CaT draft, ATP-32 reference) will add red/yellow/green environmental colour codes and solar / EM prediction."},{"key":"TC11","name":"Attack Surface","mapsTo":"attackSurface","authority":"MC 0195/13 · NATO AC/322","definition":"Protective measures for Physical Security and EMSEC (Emission Security / TEMPEST), extracted from MC 0195/13 REQs Table v70 and aligned with the C3 Taxonomy: EPM (Electromagnetic Protective Measures / ECCM — EPE) or N ail":"99 %","unplanned":"7 h","planned":"12 h","degraded":"Some","restore":"4 h","recovery":"24 h","recPoint":"48 h","note":"Monthly unplanned / planned downtime; max restore time; recovery time; recovery point."},{"code":"L4","name":"Level 4","avail":"98 %","unplanned":"14 h","planned":"36 h","degraded":"Allowed","restore":"12 h","recovery":"28 h","recPoint":"1 week","note":"Monthly unplanned / planned downtime; max restore time; recovery time; recovery point."}],"temporalWindows":[{"code":"TW-CONT","name":"Continuous","group":"Continuous","description":"The communications link must be maintained 24/7."},{"code":"TW-CONT-NRT","name":"Continuous; near-real-time","group":"Continuous / Always-On","description":"Constant connection under a few minutes (e.g., standard air/maritime track updates)."},{"code":"TW-CONT-RTA","name":"Continuous; RTA","group":"Continuous / Always-On","description":"The link is always active, but packets must arrive within a strict window of X minutes to prevent dropping or expiration."},{"code":"TW-CONT-BL","name":"Continuous; event-driven on bearer loss","group":"Continuous / Always-On","description":"The primary state is continuous, but if the primary bearer fails an automatic switch or specific backup behaviour triggers instantly."},{"code":"TW-EV-CONTACT","name":"Event-driven on contact","group":"Event-driven / Tactical","description":"No active link is maintained until a sensor makes a contact/detection, which automatically spins up the comms window."},{"code":"TW-RT-ENG","name":"Real-time; seconds on engagement","group":"Event-driven / Tactical","description":"High-priority window triggered exclusively during a weapon engagement sequence (e.g., target illumination or missile guidance)."},{"code":"TW-TASK","name":"Tasking cycle; event cues","group":"Event-driven / Tactical","description":"Aligned with standard military cycling timelines (like the Air Tasking Order / ATO Cycle) or triggered by JISR cues."},{"code":"TW-MISSION","name":"Miss essages over a nominal 24-hour tactical cycle."},{"key":"AMS","name":"Average Message Size","unit":"KB / bytes","value":"5 kB","definition":"Statistical mean size of single tactical information objects / message packets, used to compute structural bandwidth allocation and cryptographic overhead in tactical pipes."},{"key":"TPPS","name":"Tracks Processed (area of interest)","unit":"tracks / session","value":"N/A (non-track service)","definition":"Maximum threshold of distinct active tactical track objects (Air, Surface, Subsurface, Land) a system or cryptographic boundary can continuously ingest, track-manage and synchronise within a single tactical data link session."},{"key":"MPQ","name":"Messages Processed in a Queue","unit":"msg","value":"Min 1000","definition":"Maximum depth of the tactical data router / buffer for transit-pending messages during congestion or temporary link disruption, without dropping packets or violating message precedence."},{"key":"ADC","name":"Average Duty Cycle","unit":"%","value":"Per waveform / EMCON posture","definition":"Ratio of time a tactical transmitter is actively emitting RF, or a cryptographic engine is actively processing payloads, relative to total operational time over a temporal window — to prevent thermal or power depletion."},{"key":"CS","name":"Concurrent Sessions","unit":"sessions","value":"4 concurrent sessions","definition":"Maximum number of simultaneous, active, logically-isolated peer-to-peer / client-server channels or cryptographic tunnels (IPsec / HAIPE) sustained by a gateway without violating end-to-end performance parameters."},{"key":"ENERGY","name":"Energy Consumption","unit":"kWh / W","value":"≤ 1.2 kWh (emergency / backup power)","definition":"Total electrical power drawn by a tactical node, cryptographic gateway or system over an operational timeframe, used to calculate battery life, thermal dissipation and sustained mission endurance in austere / grid-deprived environments. MCR (Energy Consumption and Contingency): the dedicated tactical cryptographic architecture shall guarantee seamless continuity of encryption functions and absolute preservation of operational cryptographic keys / states during primary power system transitions, failures or degradations. Under emergency auxiliary-battery or backup-power configurations the total accumulated energy consumption shall not exceed 1.2 kWh. The core hardware shall strictly comply with tri-domain military interface regulations: Maritime — transient tolerances and critical-load continuity under STANAG 1008 / MIL-STD-1399 (equipment critical to combat capability shall remain operational through power interruptions and supply-system transfer spikes); Land — low-voltage cranking limits and Silent-Watch battery-only operational profiles under STANAG 4074 / MIL-STD-1275 (equipment must tolerate low-voltage cranking limits without losing mission-critical data or cryptographic status); Aerospace — emergency power allocation and bus-transfer characteristics under STANAG 3456 / MIL-STD-704 (utilization equipment shall maintain required performance during bus transfers, ensuring no loss of critical mission data or state)."}],"figuresOfMerit":[{"code":"FOM-C2","family":"C2","goals":"Direct, coordinate and control; authorise subordinates; enable dynamic synchronisation","objectives":"Fast and accurate decision-making processes; accurate and trustful operational pictures","actionVectors":"Formal Messaging; Instant Messaging; Maritime Situational Awareness; White Shipping; RMP","measures":"Coherence; Simplicity; Efficiency; Accuracy; Diversity; Compilation; Sharing","source":"MC 0195/13"},{"code":"FOM-COLLAB","family":"Collaboration","goals":"Unified communication and collaboration; integrated and consistent experience; flexible and efficient information sharing","objectives":"Reliable, accurate and secure real-time and non-real-time collaboration tools; integrated and seamless information environment","actionVectors":"Informal Messag ture (NCS) · DDA / New Force Model"},{"code":"SHAPE","name":"Supreme Headquarters Allied Powers Europe (ACO)","level":"Strategic (military)","location":"Mons (Casteau), Belgium","commander":"SACEUR — Supreme Allied Commander Europe","role":"Military-strategic command of all NATO operations; defines the strategic objective and allocates resources globally; does not run the day-to-day campaign on the ground.","capacity":"Under the DDA model: direct up to 2 Major Joint Operations (MJO) simultaneously and sustain multiple Small Joint Operations (SJO) indefinitely","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"ACT","name":"Allied Command Transformation (ACT)","level":"Strategic (functional)","location":"Norfolk, Virginia, USA","commander":"SACT — Supreme Allied Commander Transformation","role":"Warfare development, capability development, training and education; ACT is not an operational command.","capacity":"Force and capability development (no operational command)","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"JFC-BS","name":"Joint Force Command Brunssum","level":"Operational","location":"Brunssum, Netherlands","commander":"Commander JFC Brunssum","role":"Operational-level command — translates SHAPE strategic goals into a campaign design, synchronising land, air and maritime; northern / eastern flank of Europe.","capacity":"Certified to lead 1 MJO active (or up to 2–3 SJOs)","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"JFC-NP","name":"Joint Force Command Naples","level":"Operational","location":"Naples, Italy","commander":"Commander JFC Naples","role":"Operational-level command; southern flank, Mediterranean and Africa.","capacity":"Certified to lead 1 MJO active (or up to 2–3 SJOs)","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"JFC-NF","name":"Joint Force Command Norfolk","level":"Operational","location":"Norfolk, Virginia, USA","commander":"Commander JFC Norfolk","role":"Operational-level command; protection of the trans-Atlantic sea lines of communication.","capacity":"Certified to lead 1 MJO active (or up to 2–3 SJOs)","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"LANDCOM","name":"Allied Land Command (LANDCOM)","level":"Tactical (component)","location":"Izmir, Türkiye","commander":"COM LANDCOM","role":"Land Component Command — force provider and land-warfare advisor; commands assigned land operations.","capacity":"Supports all active JFC operations simultaneously","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"AIRCOM","name":"Allied Air Command (AIRCOM)","level":"Tactical (component)","location":"Ramstein, Germany","commander":"COM AIRCOM","role":"Air Component Command — airspace control and air C2 across the JFCs.","capacity":"Supports all active JFC operations simultaneously","source":"NATO Command Structure (NCS) · DDA / New Force Model"},{"code":"MARCOM","name":"Allied Maritime Command (MARCOM)","level":"Tactical (component)","location":"Northwood, United Kingdom","commander":"COM MARCOM","role":"Maritime Component Command — maritime C2 and force provider.","capacity":"Supports all active JFC operations simultaneously","source":"NATO Command Structure (NCS) · DDA / New Force Model"}],"ajp5":[{"code":"AJP5-ART","term":"Operational art","kind":"Operations design","change":"","note":"The cognitive approach by commanders and staffs — supported by skill, knowledge, experience and judgement — to develop strategies, campaigns and operations and to organise and employ forces.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-EWMR","term":"Ends, ways, means and risks","kind":"Operations design","change":"","note":"The core logic of operations design: linking the desired end state (ends) to courses of action (ways) and resources (means), balanced against risk.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-OE","term":"Understanding the operating environment","kind":"Operations design","change":"","note":"Continuous appreciation of the physical, virtual and cognitive dimensions of the operating environment that frames the design.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-ENDSTATE","term":"End state","kind":"Operations design","change":"","note":"The set of required conditions that defines achievement of the objectives and the successful conclusion of an operation.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-TRANS","term":"Transition and termination","kind":"Operations design","change":"","note":"Planning the hand-over of responsibilities and the conditions for ending or transitioning the operation.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-COG","term":"Centre of gravity (COG)","kind":"Operations design","change":"","note":"The primary source of power that provides an actor its moral or physical strength, freedom of action or will to act.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-APPROACH","term":"Direct versus indirect approach","kind":"Operations design","change":"","note":"The choice between acting directly against a centre of gravity or indirectly via its critical vulnerabilities.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-OBJ","term":"Objectives","kind":"Operations design","change":"","note":"Clearly defined and attainable goals towards which every operation is directed.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-DC","term":"Decisive conditions","kind":"Operations design","change":"","note":"A combination of circumstances, effects or key events that must be achieved to enable an objective and the end state.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-EFFECTS","term":"Effects and actions","kind":"Operations design","change":"","note":"The changes in the state of an actor or environment (effects) produced by actions; the basis of an effects-oriented approach (MCM-0041-2010).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-LOO","term":"Lines of operation","kind":"Operations design","change":"","note":"Lines linking decisive conditions in time, space and purpose along the path towards the end state.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-CULM","term":"Culmination","kind":"Operations design","change":"","note":"The point at which a force can no longer continue its operation at full effectiveness.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-PAUSE","term":"Operational pause","kind":"Operations design","change":"","note":"A temporary, deliberate halt to preserve, build or regenerate combat power or to seize the initiative.","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-MDO","term":"Multi-domain operations (MDO)","kind":"Edition B change","change":"Y","note":"Introduces the Alliance conceptual approach to multi-domain operations (MCM-0004-2023). As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-HUMSEC","term":"Human security","kind":"Edition B change","change":"Y","note":"Introduces the concept of human security as a cross-cutting topic (with protection of civilians, gender perspective). As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-RISK","term":"Integrated risk management","kind":"Edition B change","change":"Y","note":"Develops risk management further — integrating and specifying the steps of the risk-management process in each planning stage, with linkage to AJP-3 (ISO 31000:2018). As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-ALIGN","term":"Alignment with NATO 2022 Strategic Concept / NWCC / DDA","kind":"Edition B change","change":"Y","note":"Aligns with the NATO 2022 Strategic Concept, the NATO Warfighting Capstone Concept (NWCC) and the Concept for the Deterrence and Defence of the Euro-Atlantic Area (DDA). As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-HARM","term":"Harmonisation (MC 0133 / NRSM / AJP-01(F))","kind":"Edition B change","change":"Y","note":"Harmonises with the MC 0133 series, the NATO Response System Manual (NRSM 2024) and AJP-01(F) Allied Joint Doctrine. As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-ANXDF","term":"Annex — doctrinal frameworks and planning","kind":"Edition B change","change":"Y","note":"New annex on doctrinal frameworks and planning. As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"},{"code":"AJP5-ANXFUT","term":"Annex — future planning considerations","kind":"Edition B change","change":"Y","note":"New annex on future planning considerations. As stated as new AJP-5 Doctrine (AJP-5 Ed B, June 2026).","source":"AJP-5 Ed B Ver 1 (June 2026)"}],"status":[{"code":"R","name":"Required","color":"#22c55e"},{"code":"P","name":"Planned","color":"#eab308"},{"code":"F","name":"Projected","color":"#3b82f6"}],"reviewStatuses":[{"code":"DRAFT","name":"Draft","rank":1,"text":"#8b96a8","note":"Authored from the source report; not yet SME-reviewed."},{"code":"REVIEW","name":"In review","rank":2,"text":"#eab308","note":"Under subject-matter-expert review."},{"code":"APPROVED","name":"Approved","rank":3,"text":"#22c55e","note":"Endorsed by the approving authority."},{"code":"SUPERSEDED","name":"Superseded","rank":4,"text":"#5a6678","note":"Replaced by a newer Use Case."}],"missionTypes":[{"code":"CD","name":"Collective Defence","source":"MC 0593/2","note":"Article-5 collective defence operations."},{"code":"ARF-DDA","name":"ARF (DDA FoP)","source":"MC 0593/2","note":"Allied Reaction Force — Deterrence and Defence of the Euro-Atlantic Area, Family of Plans."},{"code":"ARF-CRO","name":"ARF (NA5CRO)","source":"MC 0593/2","note":"Allied Reaction Force — Non-Article-5 Crisis Response Operations."}],"fmnObjectives":[{"code d · MC 0655/0695 Air)","kind":"MC","url":"","note":""},{"code":"MC 0640","title":"Land Tactical IER directive","kind":"MC","url":"","note":""},{"code":"MC 0195","title":"Maritime IER directive","kind":"MC","url":"","note":""},{"code":"MC 0655","title":"Air IER directive","kind":"MC","url":"","note":""},{"code":"MC 0695","title":"Air Tactical IER / VeVA MN","kind":"MC","url":"","note":""},{"code":"COPD","title":"Comprehensive Operations Planning Directive v3","kind":"Other","url":"","note":""},{"code":"AECTP-230","title":"Climatic Conditions (Allied Environmental Conditions and Test Publication)","kind":"Other","url":"","note":""},{"code":"STANAG 4866","title":"Climatic categories codification (May 2009)","kind":"STANAG","url":"","note":""},{"code":"AJP-3.1","title":"Allied Joint Doctrine for Electronic Warfare","kind":"AJP","url":"","note":""},{"code":"JP-3.6","title":"Electronic Warfare (LPI/LPD requirements)","kind":"Other","url":"","note":""},{"code":"AC/322","title":"NATO C3 Board directives (security / EMSEC)","kind":"Other","url":"","note":""},{"code":"C3 Taxonomy B7","title":"NATO C3 Taxonomy Baseline 7 — AC/322-WP(2025)0097-REV2-AS1, approved by the Digital Policy Committee (DPC) 13 May 2026 after ACaT consideration; developed and maintained by ACT and NCIA taxonomists; 1689 artefacts; CC BY-NC 4.0; Tidepedia Baseline 100186","kind":"Other","url":"https://tide.act.nato.int/mediawiki/tipeia","note":""},{"code":"STANAG 1008","title":"Characteristics of Shipboard Electrical Power Systems in Warships of the NATO Navies (Maritime power — MCR Energy Consumption)","kind":"STANAG","url":"","note":""},{"code":"MIL-STD-1399","title":"Interface Standard for Shipboard Systems — electric power (Maritime power)","kind":"Other","url":"","note":""},{"code":"STANAG 4074","title":"Vehicle Electrical Power (Land — Silent Watch / low-voltage cranking)","kind":"STANAG","url":"","note":""},{"code":"MIL-STD-1275","title":"Characteristics of 28 V DC Electrical Systems in Military Vehicles (Land power)","kind":"Other","url":"","note":""},{"code":"STANAG 3456","title":"Aircraft Electrical Power Characteristics (Aerospace — bus transfer / emergency power)","kind":"STANAG","url":"","note":""},{"code":"MIL-STD-704","title":"Aircraft Electric Power Characteristics (Aerospace power)","kind":"Other","url":"","note":""},{"code":"STANAG 2526","title":"Allied Joint Doctrine for the Planning of Operations (records national agreement to use AJP-5)","kind":"STANAG","url":"","note":""},{"code":"MCM-0004-2023","title":"Alliance Concept for Multi-Domain Operations (MDO) — referenced by AJP-5 Ed B","kind":"MC","url":"","note":""},{"code":"MCM-0200-2020","title":"NATO Warfighting Capstone Concept (NWCC) — referenced by AJP-5 Ed B","kind":"MC","url":"","note":""},{"code":"MCM-0067-2020","title":"Concept for the Deterrence and Defence of the Euro-Atlantic Area (DDA)","kind":"MC","url":"","note":""},{"code":"MC 0133","title":"NATO’s Operations Planning (MC 0133 series) — AJP-5 Ed B harmonised","kind":"MC","url":"","note":""},{"code":"AJP-01","title":"Allied Joint Doctrine — AJP-01(F); AJP-5 Ed B harmonised","kind":"AJP","url":"","note":""},{"code":"NATO 2022 Strategic Concept","title":"NATO 2022 Strategic Concept — AJP-5 Ed B aligned","kind":"Other","url":"","note":""},{"code":"NATO Human Security Approach","title":"NATO Human Security Approach and Guiding Principles (14 Oct 2022) — AJP-5 Ed B human security","kind":"Other","url":"","note":""}],"riskNarr":[{"level":0,"label":"Negligible","text":"No tactical concealment required; routine garrison-style RF posture."},{"level":1,"label":"Low","text":"Light EW posture; periodic frequency hopping suffices."},{"level":2,"label":"Moderate","text":"Moderate LPI required; spread-spectrum and DSCP shaping recommended."},{"level":3,"label":"High","text":"Strong LPI required; FFH-EPM, low-duty-cycle bursts, directional antennas."},{"level":4,"label":"Critical","text":"LPI+LPD mission-critical; ESSOR HDR FFH, minimal emission profile, brevity-only voice."},{"level":5,"label":"Dominant-EW","text":"Adversary EW dominant; assume detection; rely on encryption-in-depth and scheduled brevity bursts."}],"reportSections":[{"id":"RPT-1","order":10,"section":"Introduction","title":"1 · Introduction","body":"<p>This Technical Report presents a Governance, Risk and Compliance (GRC) view of NATO tactical Communication and Information System (CIS) <b>Information-Exchange Use Cases</b> across the <b>Maritime</b>, <b>Land</b> and <b>Air</b> domains, prepared for review by <b>Allied Command Operations (ACO)</b> and <b>Allied Command Transformation (ACT)</b>.</p><p>Each Use Case follows the canonical <b>UC-X-nnn</b> naming (X = domain letter) and is characterised by the eleven <b>Technical Constraints (TC01–TC11)</b>, with the AJP-6 six-dimension Information Exchange Requirement (IER) carried at TC06. Resilience for operating in Denied, Degraded, Intermittent and Limited (DDIL) environments with AI-enabled communications — the former C2D2E theme — is now carried transversally inside each domain.</p>"},{"id":"RPT-2","order":20,"section":"Background","title":"2 · Background","body":"<p>NATO Federated Mission Networking (FMN) and the C3 Taxonomy (Baseline 7.0) frame interoperable C2 across domains. The Military Committee directives — <b>MC 0195/13 (Maritime)</b>, <b>MC 0640 (Land)</b> and <b>MC 0655 / 0695 (Air)</b> — specify the domain IER tables that this report consolidates.</p><p>Operational planning is anchored in <b>AJP-5, Allied Joint Doctrine for the Planning of Operations — Edition B Version 1 (June 2026)</b>. <i>As stated as new AJP-5 Doctrine</i>, Edition B introduces the Alliance conceptual approach to <b>multi-domain operations</b> and the concept of <b>human security</b>, integrates risk management into each planning stage (linkage to AJP-3), and aligns with the NATO 2022 Strategic Concept, the NATO Warfighting Capstone Concept and the Concept for the Deterrence and Defence of the Euro-Atlantic Area (DDA). Its operations-design concepts (end state, centre of gravity, decisive conditions, lines of operation, effects and actions) underpin the commander-intent and goal framing of every Use Case (see the AJP-5 catalogue).</p><p>The deliverable is a single self-contained, air-gapped HTML application: every entity (Use Case, IER, Capability Element, vendor, echelon, reference) is editable through schema-driven CRUD, every figure on the dashboard is computed live, and the entire configuration round-trips as one JSON / JSON-LD file.</p>"},{"id":"RPT-3","order":30,"section":"Framework","title":"2.1 · IER — Information Exchange Requirements","body":"<p>An <b>Information Exchange Requirement (IER)</b> describes the desired performance of a Use Case in terms of <b>Capability Elements (CapElem)</b>, coded <b>R</b> (Required) / <b>P</b> (Planned) / <b>F</b> (Projected) in accordance with the NATO C3 Taxonomy and the MC 0195/13 REQ CapElems table. Each IER carries the AJP-6 dimensions (who · what · when · protection · precedence · volume) and resolves to the eleven Technical Caveats <b>TC01–TC11</b>. The authoritative per-requirement table is the editable MC 0195/13 REQ (IER) table.</p>"},{"id":"RPT-CODING","order":32,"section":"Framework","title":"2.2 · Use Case Coding","body":"<p>Use Cases are named <b>UC-X-nnn</b> where X is the operational domain (M · L · A) and nnn the slot number. Capability Elements are coded <b>A.B.NNN</b>: <b>A</b> = status (R Required / P Planned / F Projected), <b>B</b> = C3-Taxonomy category (I CoI-App / A Core-App / S Security / C Communications / N Network / M Service-Management), <b>NNN</b> = incremental number. The coding table below is editable.</p>"},{"id":"RPT-SLOT","order":35,"section":"Framework","title":"3.1 · Use-Case slot symmetry (UC-X-NN)","body":"<p>The three domains share a common <b>17-slot service framework</b> — the Maritime set (UC-M-001…017) is the standard, extrapolated to Land and Air — so that <b>UC-X-NN denotes the same information-exchange service in every domain</b> (e.g. UC-L-007, UC-M-007 and UC-A-007 are all the Tactical Data Link Messaging Use Case). The slots span the four C2-data exchanges (own-domain, Joint and the two other tactical domains), Formal Messaging, Tactical Voice, Tactical Data Link, ISR, Combat Identification, Targeting, Logistics, Informal Messaging (e-mail), Instant Messaging (chat), Web Services, Telephony, Video Conferencing and Interfaces to Self-contained Platforms. Each domain instantiates the slot with its own echelons, systems and bearers, and the C2D2E (DDIL + AI) posture is woven inline across every slot. This symmetry makes the report balanced and lets a reader compare the same service across Land, Maritime and Air at a glance. The slot map below is the authoritative pattern.</p>"},{"id":"RPT-NCS","order":62,"section":"Annexes","title":"Annex — NATO Command and Force Structure","body":"<p>NATO command and control is organised in three levels — <b>Strategic</b>, <b>Operational</b> and <b>Tactical</b>.</p><p><b>Strategic.</b> The <b>North Atlantic Council (NAC)</b> issues political direction; the military-strategic command is <b>SHAPE / Allied Command Operations (ACO)</b> under <b>SACEUR</b>, which defines the strategic objective and allocates resources but does not run the day-to-day campaign on the ground. Under the Concept for the <b>Deterrence and Defence of the Euro-Atlantic Area (DDA)</b> and the New Force Model, the structure is dimensioned to direct up to <b>two Major Joint Operations (MJO)</b> simultaneously while sustaining multiple <b>Small Joint Operations (SJO)</b>.</p><p><b>Operational — the campaign.</b> Three permanent <b>Joint Force Commands (JFC)</b> — <b>Brunssum</b> (northern/eastern flank), <b>Naples</b> (southern flank, Mediterranean, Africa) and <b>Norfolk</b> (trans-Atlantic lines of communication) — translate the strategic goals into an interactive campaign design synchronising land, air and maritime; each JFC is certified to lead <b>one MJO</b> (or up to two–three SJOs).</p><p><b>Tactical — the components.</b> The single-service Component Commands — <b>LANDCOM</b> (Izmir), <b>AIRCOM</b> (Ramstein) and <b>MARCOM</b> (Northwood) — provide and command their force, supporting all active JFC operations simultaneously. An <b>MJO</b> is a large-scale, high-intensity collective-defence deployment (Article 5); an <b>SJO</b> is a smaller crisis-management operation (e.g. KFOR in Kosovo). In the worst case NATO’s fixed structure is designed to sustain a ceiling of two simultaneous major collective-defence campaigns across its three operational JFCs, reinforced by deployable national headquarters made available by member nations.</p>"},{"id":"RPT-4","order":40,"section":"Executive Summary","title":"4 · Executive Summary of Use Cases","body":"<p>The figures below are computed live from the editable dataset: Use-Case counts by domain, classification mix, LPI/LPD risk distribution and governance review status. The cross-domain table lists every Use Case with its normalised Technical-Constraint facets and can be filtered and exported to Word or JSON.</p>"},{"id":"RPT-5","order":60,"section":"Annexes","title":"6 · Annexes and Reference Tables","body":"<p>The annexes hold the supporting material: the Standards and References register (STANAG / AAP / AJP / ATDLP / PFL), the NAF v4 / ADatP-47 overrides retained as a reference table, the per-domain vendor and NAF-architecture mapping, Capability Elements, echelons, scenarios, Tactical Data Links, the Acronyms and Abbreviations annex, and the global GRC catalogs (classifications, precedence, track identity, climatic categories, mission types and FMN objectives).</p>"},{"id":"RPT-BLUF","order":38,"section":"Executive Summary","title":"Bottom Line Up Front (BLUF)","body":"<p><b>Bottom line.</b> This report consolidates NATO tactical CIS Information-Exchange Use Cases for the <b>Maritime</b>, <b>Land</b> and <b>Air</b> domains (51 Use Cases — a symmetric 17-service framework per domain) on a single AJP-6 IER framework, with resilience for Denied/Degraded/Intermittent/Limited environments and AI-enabled communications (C2D2E) woven across every service, and aligned to the NATO C3 Taxonomy Baseline 7.</p><p><b>Key risks.</b> (1) PFL and C3 (CI-…) service identifiers have been validated against the NISP Baseline 16 Catalogue (5 SEP 2024) and confirmed real; the CapElem R.x.NNN identifiers are not NISP B16 identifiers and remain illustrative; (2) C2D2E (DDIL + AI) requirements anticipate FMN Spiral 6 and need endorsement; (3) most Use Cases remain in DRAFT review status; (4) Annex-C serial coverage is partial in the available source.</p><p><b>Decision asks for ACO / ACT.</b> Endorse the tri-domain scope and the Use-Case Framework (TC01–TC11); task subject-matter-expert review of the DRAFT Use Cases; direct validation of CapElem / PFL identifiers against the gated NISP / MC catalogue.</p>"},{"id":"RPT-METH","order":25,"section":"Methodology","title":"Methodology, Assumptions and Limitations","body":"<p><b>Methodology.</b> Use Cases were extracted from the source Military-Committee directive reports (MC 0195/13, MC 0640, MC 0655 / 0695), normalised to the canonical UC-X-nnn framework and the eleven Technical Constraints (TC01–TC11), and consolidated into one schema-driven dataset with full traceability to the AJP-6 six-dimension IER.</p><p><b>Assumptions.</b> Federated Mission Networking (FMN) Spiral 5/6 context applies; the C3 Taxonomy Baseline 7 (AC/322-WP(2025)0097-REV2-AS1) is authoritative for service classification; Brigade-and-below / tactical echelons are in scope, with upstream echelons shown only as reach-back.</p><p><b>Validation.</b> PFL and C3 service (CI-…) identifiers were <b>validated against the NISP Baseline 16 Catalogue (5 SEP 2024, 352 pp)</b>: PFL-00403, the CI-1062 Land profile inventory and every CI-… code used are confirmed present (see the Findings register, REC-001). <b>Limitations.</b> The CapElem R.x.NNN identifiers and KPIs are <b>illustrative</b> — NISP B16 carries no CapElem construct (it is a C3 Taxonomy artefact), so they are marked illustrative on every record (FIND-003); Annex-C serial coverage is partial (the available Draft MC 0640 copy terminates mid-table); the dataset awaits subject-matter-expert review and formal approval.</p>"}],"c3Taxonomy":[{"code":"BP-1000","name":"C3 Business Process","parent":"","artefacts":408,"branches":["Govern (BP-1486)","Generate (BP-1481)","Operate (BP-1779)","Enable (BP-1327)"],"note":""},{"code":"BR-1000","name":"C3 Business Roles","parent":"","artefacts":297,"branches":["Functional Military Roles (BR-1057)","Coordinating Military Roles (BR-1154)","Structural Military Roles","Civilian Roles","Organizational Roles"],"note":"To include the FMN Spiral 6 Specification."},{"code":"C3-CAP","name":"C3 Capabilities","parent":"","artefacts":33,"branches":["Consultation capabilities","Command and Control capabilities","Communication and Information System capabilities","Information Management capabilities","Battlespace Management capabilities"],"note":"Inspired by the capability hierarchy framework in the NATO Defence Planning Process (NDPP)."},{"code":"C3-COI","name":"C3 Community of Interest Services","parent":"","artefacts":130,"branches":["COI-Specific Services","COI-Enabling Services"],"note":""},{"code":"C3-CORE","name":"C3 Core Services","parent":"","artefacts":150,"branches":["Business Support Services","Platform Services","Infrastructure Services"],"note":""},{"code":"C3-COMMS","name":"C3 Communications Services","parent":"","artefacts":91,"branches":["Communication Access Services","Transport Services","Transmission Services"],"note":""},{"code":"C3-INFO","name":"C3 Information Products","parent":"","artefacts":205,"branches":["Governance Information Products","Domain-Specific Information Products","Operation Enabling Information Products","Operation Support Information Products","Situational Awareness Informati const GLOBAL_COLLECTIONS = ['docControl','revisions','recommendations','acronyms','reportSections','tcFramework','ucSlots','c3Taxonomy','classifications','precedence','trackIdentity','threatEnv','commsServices','footprints','c3Services','climatic','availability','temporalWindows','mcr','figuresOfMerit','maritimeFitting','capElemCoding','natoOperations','ncs','ajp5','c3DataModel','status','reviewStatuses','missionTypes','fmnObjectives','references','riskNarr'];

   ========================================================================== */
const LS_KEY = 'mdo.grc.platform.v26';  /* v26 (2026-06-23): global search + ACO logo (inlined base64); +ncs (NATO Command/Force Structure) catalog + RPT-NCS narrative as Annex F. v25: report IA restructured — 1 Introduction (BLUF/Purpose/Background) · 2 Framework (IER/Coding/Caveats/MCR/Slot) · 3-5 Use Cases by domain · Annexes · Glossary · Bibliography · Abbreviations; new editable RPT-IER/RPT-CODING sections; MC 0593/2 title. v24: PSC tables — Source/Sink and CapElems skip submarine REQ rows; TC10 one climate per line; TC labels without " · "; TC11 EPM/IA on separate lines. v23: TC table full lines from editable catalogs — updated AJP-5 reference, +ajp5 catalog (operations design + Edition-B changes tagged "as stated as new AJP-5 Doctrine"), +MDO/NWCC/DDA references, Background narrative anchored on AJP-5 Ed B */
let DB = null;
let UI = { domain:null, route:{view:'dashboard'} };

const App = {
  /* ---- persistence ---- */
  persistOK:true,
  load(){
    // probe storage (some browsers disable localStorage on the file:// origin)
    try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); this.persistOK=true; }
    catch(e){ this.persistOK=false; }
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    const seed=JSON.parse($('#seed-db').textContent);
    DB = (saved && saved.schema===seed.schema) ? saved : seed;
    if(!DB.meta) DB.meta={};
    if(DB.meta.classification==null) DB.meta.classification = (DB.global.classifications[0]||{}).code||'NU';
    this.migrateIds();
    UI.domain = UI.domain || Object.keys(DB.domains)[0];
    if(this.syncJsonLd) this.syncJsonLd();
    if(this.syncPrintHeader) this.syncPrintHeader();
    if(!this.persistOK) setTimeout(()=>toast('This browser blocks storage on file:// — edits stay in memory; use Export to save. (Tip: open via a local server to persist.)','info'),400);
  },
  defaultTC05(cls){ return cls==='MS'?'FMN Mission-Network partners (NNN / IO) · FMN Spiral 5':(cls==='NS'?'NATO; selected partners via CDS · FMN Spiral 5':'NATO + Mission Partners · FMN Spiral 5'); },
  defaultClimate(code){ const base=['A1','A2','A3','B1','B2','B3','C0','C1','C2','C3','C4']; return code==='M'?base.concat(['M1','M2','M3']):base; },
  COI_BY_DOMAIN:{J:'CI-1061',A:'CI-1005',M:'CI-1067',L:'CI-1062',S:'CI-1112',C:'CI-1029',T:'CI-1021',X:'CI-1061'},
  TRACK_MAP:{hostile:'HO',unknown:'UNK',friend:'FR',friendly:'FR','assumed friend':'AF',neutral:'N',permissive:'FR',contested:'UNK',denied:'HO',unk:'UNK',af:'AF',fr:'FR',n:'N',ho:'HO'},
  toTrackId(v){ if(!v)return ''; const codes=['UNK','AF','FR','N','HO']; if(codes.includes(v))return v; return this.TRACK_MAP[String(v).toLowerCase()]||'UNK'; },
  commsFor(equipment){
    const t=(equipment||[]).join(' ').toLowerCase(); const mob=/vehicular|manpack|man-portable|backpack|dismounted|mobile|handheld|on-the-move/.test(t);
    const out=new Set();
    if(/satcom|ka-band|ka band|x-band|x band|\bhf\b|blos|beyond line|brass/.test(t)) out.add(mob?'CO-1074':'CO-1077');
    if(/\blos\b|line-of-sight|line of sight|\buhf\b|\bvhf\b|\bshf\b|nbwf|essor|saturn|marlos|varc|wideband/.test(t)) out.add(mob?'CO-1080':'CO-1083');
    if(/fibre|fiber|wired|cable|ethernet|copper/.test(t)) out.add('CO-1071');
    if(/optical|laser|free-space|\bfso\b/.test(t)) out.add('CO-1086');
    if(/encrypt|crypto|\bcds\b|melpe key|security gateway|ipsec|\btls\b|\bpki\b|stanag 4774|label/.test(t)) out.add('CO-1051');
    if(/\bsmc\b|service management|network management|spectrum|emcon|\bqos\b/.test(t)) out.add('CO-1057');
    if(!out.size) out.add('CO-1080');
    return [...out];
  },
  /* idempotent: rename ids, remap refs, normalise TC03/TC04-CoI/TC05/TC10 */
  migrateIds(){
    let changed=false;
    Object.entries(DB.domains).forEach(([code,d])=>{
      const c=d.collections||{}; const px=d.reqPrefix||code; const map={};
      (c.useCases||[]).forEach(u=>{
        if(/^UC-\d/.test(u.id||'')){ const nid='UC-'+px+'-'+u.id.slice(3); map[u.id]=nid; u.id=nid; changed=true; }
        if(!Array.isArray(u.commsSvc)){ u.commsSvc=this.commsFor(u.equipment); changed=true; }        // TC01 CO-… services
        const t=this.toTrackId(u.env); if(t!==u.env){ u.env=t; changed=true; }                      // TC03 → STANAG 4162
        if(!Array.isArray(u.coi)){ u.coi=[this.COI_BY_DOMAIN[code]||'CI-1061']; changed=true; }       // TC04 CoI
        if(u.tc05==null||u.tc05===''){ u.tc05=this.defaultTC05(u.cls); changed=true; }                 // TC05
        if(u.c2d2e==null){ u.c2d2e=''; changed=true; }                                                  // transversal C2D2E tag
        if(!Array.isArray(u.climate)){ u.climate=this.defaultClimate(code); changed=true; }            // TC10 → category array
      });
      if(!Object.keys(map).length) return;
      (c.vendors||[]).forEach(v=>{ if(map[v.uc]) v.uc=map[v.uc]; });
      (c.nafOverrides||[]).forEach(n=>{ if(map[n.ucId]) n.ucId=map[n.ucId]; });
    });
    // backfill / re-map C3 Taxonomy links to the concrete sub-branches
    const hasTax = code => (DB.global.c3Taxonomy||[]).some(b=>b.code===code);
    if(hasTax('C3-COMMS-TX')) (DB.global.commsServices||[]).forEach(s=>{ if(s.taxonomy==null||s.taxonomy==='C3-COMMS'){ s.taxonomy='C3-COMMS-TX'; changed=true; } });
    if(hasTax('C3-COI-SPEC')) (DB.global.c3Services||[]).forEach(s=>{ if(s.taxonomy==null||s.taxonomy==='C3-COI'){ s.taxonomy=(s.code==='CI-1021'?'C3-COI-ENAB':'C3-COI-SPEC'); changed=true; } });
    if(changed) this.save();
  },
  save(){ try{ if(this.persistOK) localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){ toast('localStorage full — export to a file instead','err'); } if(this.syncJsonLd) this.syncJsonLd(); },
  resetAll(){ if(!confirm('Discard all local edits and restore the seeded dataset? Export first if unsure.'))return; try{ localStorage.removeItem(LS_KEY); }catch(e){} location.reload(); },

  /* ---- collection access ---- */
  coll(name){
    const sc=SCHEMAS[name];
    if(sc.scope==='global'){ DB.global[name]=DB.global[name]||[]; return DB.global[name]; }
    const d=DB.domains[UI.domain]; d.collections=d.collections||{}; d.collections[name]=d.collections[name]||[]; return d.collections[name];
  },
  collIn(name,domCode){ const sc=SCHEMAS[name]; if(sc.scope==='global')return DB.global[name]||[]; return ((DB.domains[domCode]||{}).collections||{})[name]||[]; },

  /* ---- classification banner ---- */
  setClassification(code){ DB.meta.classification=code; this.save(); this.paintBanner(); if(this.syncPrintHeader)this.syncPrintHeader(); },
  paintBanner(){
    const sel=$('#clsSel'); sel.innerHTML=DB.global.classifications.map(c=>`<option value="${esc(c.code)}" ${c.code===DB.meta.classification?'selected':''}>${esc(c.code)} — ${esc(c.name)}</option>`).join('');
    const c=DB.global.classifications.find(x=>x.code===DB.meta.classification)||{name:'NATO Unclassified',border:'#16a34a'};
    $('#clsLabel').textContent=('NATO '+c.name).toUpperCase().replace('NATO NATO','NATO');
    document.querySelectorAll('.cls-banner').forEach(b=>b.style.background=c.border||'#16a34a');
  },

  /* ---- routing ---- */
  go(route){ UI.route=route; if(window.innerWidth<=880) document.querySelector('aside.side').classList.remove('open'); this.render(); },
  switchDomain(code){ UI.domain=code; UI.route={view:'collection',collection:'useCases',scope:'domain'}; this.render(); },

  render(){ if(this.recordHist) this.recordHist(); this.paintBanner(); this.renderSwitch(); this.renderNav(); this.renderMain(); if(this.decorateAcronyms) this.decorateAcronyms(); if(typeof I18N!=='undefined') I18N.apply(); },

  /* ---- light / dark theme ---- */
  setTheme(t){ document.documentElement.setAttribute('data-theme',t); try{ localStorage.setItem('mdo.theme',t); }catch(e){} const b=$('#themeBtn'); if(b){ b.textContent = t==='dark'?'☾':'☀'; b.title = t==='dark'?'Switch to light mode':'Switch to dark mode'; } },
  toggleTheme(){ const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light'; this.setTheme(cur==='dark'?'light':'dark'); },

  renderSwitch(){
    $('#domSwitch').innerHTML = Object.values(DB.domains).map(d=>
      `<button class="dom-pill ${d.code===UI.domain?'active':''}" title="${esc(d.name)} · ${esc(d.mc)}" onclick="App.switchDomain('${d.code}')">${esc(d.code)} · ${esc(d.name)}</button>`).join('');
  },

  renderNav(){
    const r=UI.route, dom=DB.domains[UI.domain];
    const item=(active,onclick,icon,label,count)=>`<a class="${active?'active':''}" onclick="${onclick}"><span>${icon}</span><span>${esc(label)}</span>${count!=null?`<span class="ct">${count}</span>`:''}</a>`;
    const rpt=(sec,active)=>r.view==='report'&&r.sec===sec;
    let h='';
    h+=`<div class="grp"><div class="grp-h">Technical Report · ACO / ACT</div><div class="nav">`+
       item(rpt('intro'),"App.go({view:'report',sec:'intro'})",'①','1 · Introduction')+
       item(rpt('framework'),"App.go({view:'report',sec:'framework'})",'②','2 · Use Cases Framework')+
       item(rpt('maritime'),"App.go({view:'report',sec:'maritime'})",'③','3 · Use Cases — Maritime Domain',(((DB.domains.M||{}).collections||{}).useCases||[]).length)+
       item(rpt('land'),"App.go({view:'report',sec:'land'})",'④','4 · Use Cases — Land Tactical Domain',(((DB.domains.L||{}).collections||{}).useCases||[]).length)+
       item(rpt('air'),"App.go({view:'report',sec:'air'})",'⑤','5 · Use Cases — Air Tactical Domain',(((DB.domains.A||{}).collections||{}).useCases||[]).length)+
       item(rpt('annexes'),"App.go({view:'report',sec:'annexes'})",'⑥','Annexes')+
       item(rpt('glossary'),"App.go({view:'report',sec:'glossary'})",'📖','Glossary of terms')+
       item(rpt('bibliography'),"App.go({view:'report',sec:'bibliography'})",'❡','Bibliography',(DB.global.references||[]).length)+
       item(rpt('abbreviations'),"App.go({view:'report',sec:'abbreviations'})",'🔤','Abbreviations',(DB.global.acronyms||[]).length)+
       item(r.view==='document',"App.printReport()",'📄','Full report · Print / PDF')+
       `</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Cross-domain · GRC tools</div><div class="nav">`+
       item(r.view==='dashboard',"App.go({view:'dashboard'})",'▦','GRC Dashboard')+
       item(r.view==='governance',"App.go({view:'governance'})",'⚖','Domains and governance',Object.keys(DB.domains).length)+
       item(r.view==='allUC',"App.go({view:'allUC'})",'▦','All Use Cases · multi-domain',App.allUseCases().length)+
       item(r.view==='ierMatrix',"App.go({view:'ierMatrix'})",'▤','IER Matrix · '+UI.domain)+
       item(r.view==='compliance',"App.go({view:'compliance'})",'✓','Compliance map')+
       item(r.view==='qa',"App.go({view:'qa'})",'✔','QA / completeness')+
       `</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Domain · ${esc(dom.name)}</div><div class="nav">`+
       DOMAIN_COLLECTIONS.map(c=>{ const sc=SCHEMAS[c]; const n=(dom.collections&&dom.collections[c]||[]).length;
         return item(r.view==='collection'&&r.scope==='domain'&&r.collection===c,`App.go({view:'collection',scope:'domain',collection:'${c}'})`,sc.icon,sc.plural,n);
       }).join('')+`</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Global GRC catalogs</div><div class="nav">`+
       GLOBAL_COLLECTIONS.map(c=>{ const sc=SCHEMAS[c]; const n=(DB.global[c]||[]).length;
         return item(r.view==='collection'&&r.scope==='global'&&r.collection===c,`App.go({view:'collection',scope:'global',collection:'${c}'})`,sc.icon,sc.plural,n);
       }).join('')+`</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Data</div><div class="nav">`+
       item(false,"App.exportJSON()",'⭳','Export all (JSON)')+
       item(false,"App.exportJsonLd()",'☍','Export JSON-LD')+
       item(false,"document.getElementById('importFile').click()",'⭱','Import JSON')+
       `</div></div>`;
    $('#nav').innerHTML=h;
  },

  renderMain(){
    const r=UI.route;
    if(r.view==='dashboard') return Views.dashboard();
    if(r.view==='report') return Views.report(r.sec);
    if(r.view==='document') return Views.fullDocument();
    if(r.view==='qa') return Views.qa();
    if(r.view==='taxonomyTree') return Views.taxonomyTree();
    if(r.view==='acronyms') return Views.acronyms();
    if(r.view==='governance') return Views.governance();
    if(r.view==='allUC') return Views.allUC();
    if(r.view==='ierMatrix') return Views.ierMatrix();
    if(r.view==='compliance') return Views.compliance();
    if(r.view==='collection'){
      const wasGlobal = r.scope==='global';
      if(r.recordId!=null) return Views.detail(r.collection,r.scope,r.recordId);
      return Views.list(r.collection,r.scope);
    }
  },

  /* ---- ref resolution / cross-links ---- */
  refTitle(refName,refScope,id){
    const list = refScope==='global'?(DB.global[refName]||[]):this.coll(refName);
    const sc=SCHEMAS[refName]; const rec=list.find(x=>String(x[sc.id])===String(id));
    return rec? (rec[sc.title]!=null?rec[sc.title]:rec[sc.id]) : id;
  },
  refChip(refName,refScope,id){
    if(id==null||id==='') return '<span class="muted">—</span>';
    const sc=SCHEMAS[refName];
    const list = refScope==='global'?(DB.global[refName]||[]):this.coll(refName);
    const rec = list.find(x=>String(x[sc.id])===String(id));
    let extra='';
    if(rec){ const col=rec.text||rec.color; if(col) extra=`style="color:${col};border-color:${rec.border||col};background:${this.tint(col)}"`; }
    const onclick = `App.go({view:'collection',scope:'${refScope}',collection:'${refName}',recordId:'${esc(String(id))}'})`;
    return `<span class="chip link" ${extra} onclick="${onclick}" title="${esc(sc.label)}: ${esc(this.refTitle(refName,refScope,id))}">${esc(id)}</span>`;
  },
  tint(hex){ return (hex||'#888')+'22'; },

  /* ---- CRUD ---- */
  create(coll,scope){ Modal.open(coll,scope,null); },
  edit(coll,scope,id){ Modal.open(coll,scope,id); },
  remove(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]):this.coll(coll);
    const i=list.findIndex(x=>String(x[sc.id])===String(id)); if(i<0)return;
    if(!confirm(`Delete ${sc.label} “${id}”? This cannot be undone (export first to keep a copy).`))return;
    list.splice(i,1); this.save(); toast(`${sc.label} deleted`,'ok'); this.render();
  },
  upsert(coll,scope,orig,rec){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]=DB.global[coll]||[]):this.coll(coll);
    if(orig==null){ list.push(rec); } else { const i=list.findIndex(x=>String(x[sc.id])===String(orig)); if(i<0)list.push(rec); else list[i]=rec; }
    this.save();
  },

  /* ---- domain-level CRUD (governance) ---- */
  emptyCollections(){ const o={}; DOMAIN_COLLECTIONS.forEach(c=>o[c]=[]); return o; },
  domainModal(code){
    const d = code!=null ? DB.domains[code] : { code:'', name:'', mc:'', reqPrefix:'', blurb:'' };
    const f=(k,label,hint)=>`<div class="fld wide"><label>${esc(label)}</label><input id="dm_${k}" value="${esc(d[k]||'')}" ${k==='code'&&code!=null?'readonly style="opacity:.6"':''}>${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
    $('#modal').innerHTML=`
      <div class="modal-h"><h3>${code!=null?'Edit':'New'} domain</h3><button class="btn x" onclick="Modal.close()">✕</button></div>
      <div class="modal-b">
        ${f('code','Domain code','One letter/short tag, e.g. L · M · A. Immutable once created.')}
        ${f('name','Domain name','e.g. Land')}
        ${f('mc','Directive / authority','e.g. MC 0640')}
        ${f('reqPrefix','Requirement prefix','Used for REQ ids, e.g. L')}
        <div class="fld wide"><label>Governance note</label><textarea id="dm_blurb">${esc(d.blurb||'')}</textarea></div>
      </div>
      <div class="modal-f"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="App.saveDomain(${code!=null?`'${code}'`:'null'})">${code!=null?'Save changes':'Create domain'}</button></div>`;
    $('#overlay').classList.add('show');
    setTimeout(()=>{ const fi=$('#modal').querySelector('input:not([readonly])'); if(fi)fi.focus(); },30);
  },
  saveDomain(code){
    const g=k=>($('#dm_'+k).value||'').trim();
    const rec={ code:g('code'), name:g('name'), mc:g('mc'), reqPrefix:g('reqPrefix')||g('code'), blurb:g('blurb') };
    if(!rec.code){ toast('Domain code is required','err'); return; }
    if(code==null){
      if(DB.domains[rec.code]){ toast('Domain “'+rec.code+'” already exists','err'); return; }
      DB.domains[rec.code]={ ...rec, collections:this.emptyCollections() };
      UI.domain=rec.code; UI.route={view:'collection',scope:'domain',collection:'useCases'};
    } else {
      const d=DB.domains[code]; d.name=rec.name; d.mc=rec.mc; d.reqPrefix=rec.reqPrefix; d.blurb=rec.blurb;
    }
    this.save(); Modal.close(); toast((code==null?'Created':'Saved')+' domain '+rec.code,'ok'); this.render();
  },
  deleteDomain(code){
    if(Object.keys(DB.domains).length<=1){ toast('Cannot delete the last domain','err'); return; }
    const d=DB.domains[code]; const ucs=((d.collections||{}).useCases||[]).length;
    if(!confirm(`Delete domain “${d.name}” (${code}) and all ${ucs} of its Use Cases plus every collection? Export first to keep a copy. This cannot be undone.`))return;
    delete DB.domains[code];
    if(UI.domain===code) UI.domain=Object.keys(DB.domains)[0];
    UI.route={view:'governance'}; this.save(); toast('Deleted domain '+code,'ok'); this.render();
  },

  /* ---- import / export ---- */
  exportJSON(){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`MDO_GRC_Platform_${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Exported full configuration','ok');
  },
  importJSON(file){
    if(!file)return; const rd=new FileReader();
    rd.onload=()=>{ try{ const obj=JSON.parse(rd.result);
      if(obj.schema!==DB.schema){ if(!confirm('Schema tag differs from this build. Import anyway?'))return; }
      if(!obj.domains||!obj.global){ toast('Not a platform export (missing domains/global)','err'); return; }
      if(!confirm('Replace the entire current configuration with this file? Export first to back up.'))return;
      DB=obj; if(!DB.meta)DB.meta={}; UI.domain=Object.keys(DB.domains)[0]; UI.route={view:'dashboard'};
      App.save(); App.render(); toast('Imported configuration','ok');
    }catch(e){ toast('Invalid JSON: '+e.message,'err'); } };
    rd.readAsText(file);
  },
};
