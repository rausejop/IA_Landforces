<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MDO Secure-CIS GRC Platform — NATO Multi-Domain Use-Case &amp; IER Manager</title>
<style>
:root{
  --nato-blue:#003F87;--nato-blue-dark:#002967;--nato-blue-deep:#001b4d;--nato-blue-light:#5a8acf;
  --nato-gold:#cba135;--nato-gold-light:#e6c569;
  --bg:#0a0e14;--bg-2:#0f1623;--bg-3:#182338;--bg-4:#1f2c44;--line:#1f2c44;--line-2:#2a3a57;
  --fg:#e6edf3;--fg-dim:#8b96a8;--fg-mute:#5a6678;
  --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--info:#3b82f6;
  --font-sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--nato-blue-light);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px}::-webkit-scrollbar-track{background:var(--bg)}

.cls-banner{background:#16a34a;color:#fff;text-align:center;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;padding:3px;flex:0 0 auto}
.cls-banner select{background:transparent;border:0;color:#fff;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer}
.cls-banner select option{color:#000}

/* top bar */
header.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(90deg,var(--nato-blue-deep),var(--bg-2));border-bottom:1px solid var(--nato-blue)}
.emblem{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#0a559a,#003F87 60%,#001b4d);border:2px solid var(--nato-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emblem svg{width:26px;height:26px}
.brand .eyebrow{color:var(--nato-gold);font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase}
.brand h1{font-size:1.0rem;font-weight:700;line-height:1.15}
.top .spacer{flex:1}
.top .tools{display:flex;gap:6px;align-items:center}
.dom-switch{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dom-pill{font-family:var(--font-mono);font-size:0.66rem;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg-dim);cursor:pointer;transition:all .12s}
.dom-pill:hover{border-color:var(--nato-blue-light);color:var(--fg)}
.dom-pill.active{background:var(--nato-blue);border-color:var(--nato-gold);color:#fff}

.btn{font-family:var(--font-mono);font-size:0.66rem;font-weight:600;letter-spacing:0.03em;padding:6px 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--nato-blue-light);background:var(--bg-3)}
.btn.gold{border-color:var(--nato-gold);color:var(--nato-gold-light)}
.btn.gold:hover{background:rgba(203,161,53,0.12)}
.btn.primary{background:var(--nato-blue);border-color:var(--nato-blue);color:#fff}
.btn.primary:hover{background:var(--nato-blue-dark)}
.btn.danger{border-color:#7f1d1d;color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,0.12)}
.btn.sm{font-size:0.6rem;padding:3px 7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* layout */
.shell{flex:1;display:flex;min-height:0}
aside.side{flex:0 0 248px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.side .grp{margin-bottom:12px}
.side .grp-h{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold);padding:5px 9px;display:flex;align-items:center;gap:6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--fg-dim);font-size:0.83rem;cursor:pointer}
.nav a:hover{background:var(--bg-3);color:var(--fg);text-decoration:none}
.nav a.active{background:var(--nato-blue);color:#fff}
.nav a .ct{margin-left:auto;font-family:var(--font-mono);font-size:0.6rem;color:var(--fg-mute);background:var(--bg-4);border-radius:10px;padding:0 7px}
.nav a.active .ct{color:#cfe0ff;background:rgba(255,255,255,0.14)}

main.content{flex:1;overflow-y:auto;padding:18px 22px 60px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.page-h .eyebrow{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold)}
.page-h h2{font-size:1.3rem;line-height:1.1}
.page-h .sub{color:var(--fg-dim);font-size:0.84rem;margin-top:2px}
.page-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.crumbs{font-family:var(--font-mono);font-size:0.66rem;color:var(--fg-mute);margin-bottom:8px}
.crumbs a{color:var(--nato-blue-light);cursor:pointer}

/* search */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 11px;color:var(--fg);font-size:0.85rem}
.search:focus{outline:none;border-color:var(--nato-blue-light)}
.filtsel{background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-size:0.8rem}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:var(--bg-2)}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead th{position:sticky;top:0;background:var(--bg-3);text-align:left;padding:8px 11px;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg-3)}
tbody tr:last-child td{border-bottom:0}
td .rowacts{display:flex;gap:4px;white-space:nowrap}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg-mute)}
.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* chips */
.chip{display:inline-block;font-family:var(--font-mono);font-size:0.6rem;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:0.04em;border:1px solid var(--line-2);color:var(--fg-dim);white-space:nowrap}
.chip.link{cursor:pointer}.chip.link:hover{filter:brightness(1.25);text-decoration:none}
.cls{padding:1px 7px;border-radius:5px;font-weight:700;font-size:0.6rem;letter-spacing:0.06em;font-family:var(--font-mono)}

/* risk meter */
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--bg-4);display:inline-block}
.meter i.on{background:var(--warn)}
.meter i.on.hi{background:var(--bad)}
.meter i.on.lo{background:var(--ok)}

/* dashboard cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--line);border-left:3px solid var(--nato-blue);border-radius:9px;padding:13px 15px}
.card .k{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-mute)}
.card .v{font-size:1.7rem;font-weight:700;margin:2px 0}
.card .d{font-size:0.76rem;color:var(--fg-dim)}
.card.gold{border-left-color:var(--nato-gold)}
.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.panel h3{font-size:0.72rem;font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:10px}
.bar{height:9px;border-radius:5px;background:var(--bg-4);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.74rem;color:var(--fg-dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* detail */
.detail{display:grid;grid-template-columns:1fr;gap:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.field{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.field .fk{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:3px}
.field .fv{font-size:0.86rem;white-space:pre-wrap;word-break:break-word}
.field .fv ul{margin:0;padding-left:18px}
.grouphd{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-blue-light);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,0.74);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:28px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--nato-blue);border-radius:12px;width:min(820px,100%);box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);border-radius:12px 12px 0 0}
.modal-h h3{font-size:1rem}.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg-2);border-radius:0 0 12px 12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld.wide{grid-column:1/-1}
.fld label{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-dim)}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font-size:0.84rem;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--nato-blue-light)}
.fld textarea{min-height:62px;resize:vertical;font-family:inherit}
.fld .hint{font-size:0.68rem;color:var(--fg-mute)}
.modal-sec{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{font-family:var(--font-mono);font-size:0.74rem;padding:9px 16px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--ok);color:#bbf7d0}.toast.err{border-color:var(--bad);color:#fecaca}.toast.info{border-color:var(--nato-blue-light)}

.empty{text-align:center;color:var(--fg-mute);padding:40px;font-size:0.9rem}
.kbd{font-family:var(--font-mono);font-size:0.66rem;background:var(--bg-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
.note{font-size:0.78rem;color:var(--fg-dim);border-left:3px solid var(--nato-gold);background:rgba(203,161,53,0.06);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.rich{font-size:0.9rem;line-height:1.6}
.rich p{margin:0 0 8px}.rich ul,.rich ol{margin:0 0 8px 0;padding-left:20px}.rich li{margin:2px 0}
.rich h3,.rich h4{color:var(--nato-gold);font-size:0.86rem;margin:10px 0 5px}
.rich a{border-bottom:1px dotted}.rich strong,.rich b{color:var(--fg)}
.rich code{font-family:var(--font-mono);background:var(--bg-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:0.82rem}
.rich table{margin:6px 0}.rich th,.rich td{border:1px solid var(--line);padding:4px 8px}
.tabrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:7px 13px;font-size:0.8rem;color:var(--fg-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--nato-gold)}
@media(max-width:880px){aside.side{position:fixed;z-index:40;height:100%;left:-260px;transition:left .2s}aside.side.open{left:0}.modal-b{grid-template-columns:1fr}}
</style>
</head>

"Intel product (imagery / report) · Content Management + JISR Services (C3 Taxonomy) across a classification boundary","when":"Event-driven","protection":"NATO Secret target · STANAG 4774 labels + STANAG 4778 binding validated at CDS","volume":"Variable · KB reports to GB imagery packages"},"equipment":["Cross-Domain Solution (label-aware guard) at the federation NNI","STANAG 4774 confidentiality labels with STANAG 4778 metadata binding","STANAG 4711 PCN tunnels either side of the boundary","Immutable audit chain for every release / down-grade decision"],"attackSurface":"The CDS is the trust crown of the federation; a misconfigured policy can over-release. Mitigation: dual-control policy change, golden-image replay testing, fail-closed default, and per-flow STANAG 4778 binding validation.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1051"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-J-011","serial":"S-JNT-AIR-11","band":"Component","title":"Air–joint integration — ACO/ATO & airspace control","sub":"The Air Component shares the Airspace Control Order and Air Tasking Order with the joint force and federates the Recognized Air Picture so land and maritime users de-conflict in the same airspace.","cls":"NS","prec":"Immediate","env":"HO","lpi":3,"avail":"High (24/7)","timeWindow":"Daily ATO cycle + dynamic changes","zones":"Joint operations area airspace · air CoI","ier":{"who":"ACC / CAOC ➜ JFC ➜ LCC · MCC (airspace users)","what":"ACO / ATO + RAP · Air Services (C3 Taxonomy L1) / Tasking & Order + Recognized Picture Services (L2)","when":"RAP near-real-time","protection":"NATO Secret · STANAG 4774 labels · Link 16 crypto","volume":"High · ATO document + continuous air-track stream"},"equipment":["Link 16 (STANAG 5516) TDMA + JREAP-C (STANAG 5518) over IP for RAP forwarding","FMN Airspace Management service for ACO/ACM distribution","MIL SATCOM / PCN for ATO document dissemination","APP-6 symbology + STANAG 5516 identity for air tracks"],"attackSurface":"Airspace de-confliction is safety-critical; corrupted ACM risks fratricide and airspace conflicts. Mitigation: authenticated Link 16 / JREAP-C, signed ACO, and identity validation per STANAG 5516 before display.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1077"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-J-012","serial":"S-JNT-CYB-12","band":"Component","title":"Cyberspace defensive status & incident reporting (transversal)","sub":"A cyber event on a mission-network element is detected, reported to the NATO Cyber Security Centre, contained, and assessed for mission impact, with a recommended course of action to the JFC.","cls":"NS","prec":"Flash","env":"UNK","lpi":4,"avail":"High (24/7)","timeWindow":"Event-driven; continuous monitoring","zones":"Joint enterprise (all MNEs) · cyber CoI","ier":{"who":"Mission-network element / sensors ➜ NCSC ➜ JFC J6 / J3","what":"Cyber incident report + defensive status · Cyber Security / Infrastructure Services (C3 Taxonomy) per AJP-3.20","when":"continuous telemetry","protection":"NATO Secret · STANAG 4774 labels · out-of-band reporting path where the primary net is suspect","volume":"Medium · structured incident reports + telemetry"},"equipment":["NCSC sensor telemetry across the federation (network + host)","Incident-management workflow with mission-impact assessment","Enclave segmentation + out-of-band reporting path for degraded conditions","STANAG 4774 labels on incident products; restricted distribution list"],"attackSurface":"The reporting plane itself is a target (an adversary suppresses or forges incident data). Mitigation: out-of-band reporting, integrity-protected telemetry, segmentation to contain lateral movement, and attribution  labels current · CDS policy nominal","postconditions":"Single strategic COP available to NAC / SHAPE / JFC with consistent track identity"},{"ucId":"UC-J-004","goal":"Direct the Component Commands through a Joint Coordination Order / FRAGO","trigger":"JFC decides on a change to the scheme of manoeuvre","preconditions":"Joint C2 messaging service up · component NNIs converged · addressing validated","postconditions":"All components acknowledge the order · synchronisation matrix updated"},{"ucId":"UC-J-005","goal":"Fuse component recognized pictures (RGP · RMP · RAP) into a single joint COP","trigger":"Component recognized-picture services publish track updates","preconditions":"Cross-domain track correlation running · identity rules per STANAG 5516 applied","postconditions":"De-conflicted joint COP with single track identity distributed to all consumers"},{"ucId":"UC-J-006","goal":"Run the joint targeting cycle — JTL/JPTL maintenance and time-sensitive targeting","trigger":"Joint Targeting Coordination Board approves a target list / a TST is detected","preconditions":"Joint targeting service up · collateral & legal review embedded · component fires linked","postconditions":"Targets allocated to components · engagement authorised · BDA returned and assessed"},{"ucId":"UC-J-007","goal":"Manage joint collection (CCIRM) and satisfy commander's intelligence requirements","trigger":"A Priority Intelligence Requirement or RFI is raised at the JFC","preconditions":"JISR services federated · collection assets visible · RFI workflow online","postconditions":"Collection tasked · INTREP/INTSUM produced and disseminated · RFI closed"},{"ucId":"UC-J-008","goal":"Maintain the Recognized Logistic Picture and coordinate joint sustainment","trigger":"Periodic logistics reporting cycle / sustainment shortfall flagged","preconditions":"JLSG reporting · LOGREP/LOGASSESSREP schema agreed · host-nation feeds connected","postconditions":"RLP updated · sustainment priorities issued · shortfalls actioned"},{"ucId":"UC-J-009","goal":"Sustain the joint battle rhythm with secure voice and video collaboration","trigger":"Scheduled commander's update / ad-hoc decision brief","preconditions":"Unified communication & collaboration service up · QoS reserved · roster validated","postconditions":"Decision brief conducted · tasks captured and assigned across components"},{"ucId":"UC-J-010","goal":"Ingest national/partner intelligence across a classification boundary via CDS","trigger":"A partner pushes an intel product to the federation boundary","preconditions":"CDS label policy current · STANAG 4774/4778 binding validated · audit chain active","postconditions":"Product released or down-graded per policy · distributed inside the NS enclave · audited"},{"ucId":"UC-J-011","goal":"Integrate air operations with the joint force — share the ACO/ATO and airspace control","trigger":"Daily ATO / Airspace Control Order produced by the Air Component","preconditions":"Air picture (RAP) federating via Link 16 / JREAP-C · airspace service synchronised","postconditions":"ACO/ATO disseminated · airspace de-conflicted with land & maritime users"},{"ucId":"UC-J-012","goal":"Report and coordinate cyberspace defensive status across the joint enterprise","trigger":"A cyber event is detected on a mission-network element","preconditions":"NCSC sensor telemetry flowing · incident workflow online · enclave segmentation enforced","postconditions":"Incident reported and contained · mission-impact assessed · COA recommended to JFC"}],"echelons":[{"lbl":"Strategic — NAC / SACEUR / SHAPE","tier":"H","desc":"Political-military strategic level · strategic direction, OPLAN promulgation & consultation — top of MC 0593 scope"},{"lbl":"Operational — JFC / JTF HQ","tier":"H","desc":"Joint Force / Task Force HQ · joint COP, joint targeting, JISR & logistics coordination — core of MC 0593"},{"lbl":"Component — LCC · MCC · ACC · SOCC","tier":"H","desc":"Component Commands · receive joint direction, return recognized domain pictures & reports"},{"lbl":"Land tactical (Bde and below)","tier":"M","desc":"Realised by MC 0640 · federates the Land edge into the joint core","upstream":true},{"lbl":"Maritime tactical (Task Group)","tier":"M","desc":"Realised by MC 0195 · maritime platform CIS into the joint core","upstream":true},{"lbl":"Air tactical (Wing / CRC / AOC)","tier":"M","desc":"Realised by MC 0655 · air C2 + Space/SATCOM enablers into the joint core","upstream":true}],"scenarios":[],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-J-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Joint Use Cases</strong> for <strong>MC 0593</strong> — the strategic-operational <em>capstone</em> of the NATO CIS directive family. Where the three domain-tactical directives (<strong>MC 0640</strong> Land, <strong>MC 0195</strong> Maritime, <strong>MC 0655</strong> Air) specify field-level interoperability, MC 0593 establishes the <em>baseline C2 services, the joint data structure, and the transversal cybersecurity</em> on which all three federate. Each Use Case is an <strong>Information Exchange Requirement (IER)</strong> in the sense of <strong>AJP-6</strong> (Allied Joint Doctrine for CIS), managed under <strong>APP-15</strong> (NATO Guide for the Management of Information Exchange Requirements), generated as a <strong>NAF v4.1</strong> operational + service view, and tagged end-to-end against the <strong>NATO C3 Taxonomy Baseline 7.0</strong>.</p>\n    <p>Every UC card carries two parts: a <em>NAF v4.1 / APP-15 Specification Header</em> (formal IER ID, primary/secondary actor, goal, trigger, pre/postconditions, NAF view, C3 Taxonomy service, releasability, doctrinal basis) and a <em>14-row Operational Body</em> (the six AJP-6 IER dimensions — Who · What · When · Protection · Precedence · Volume — plus bearer/equipment, time window, environment, zones, availability, classification, an LPI/LPD risk meter, and an attack-surface note). The \"Copy\" button on each card emits a Word-ready HTML table.</p>\n    <div>\n      <div><h3>Scope</h3><p>Joint / strategic-operational. The Use Cases here are the cross-component and reach-back exchanges between the Joint Force Commander (JFC/JTF), the Component Commands (LCC · MCC · ACC · SOCC), and the supporting joint enablers (CIS, JISR, joint targeting, logistics, cyber).</p></div>\n      <div><h3>Method</h3><p>AJP-6 supplies the IER definition; APP-15 supplies the IER management discipline (identification, attribution, validation, maintenance); NAF v4.1 supplies the operational (NOV) and service (NSOV) views; the C3 Taxonomy Baseline 7.0 supplies the service classification used in every card and in §10.</p></div>\n      <div><h3>Realisation</h3><p>FMN Spiral 5 / NISP Baseline 16 core enterprise + COI services over Protected Core Networking (STANAG 4711), with STANAG 4774/4778 confidentiality labels and Cross-Domain Solutions at every federation boundary (NNI). Tactical edges are realised by the Land / Maritime / Air siblings.</p></div>\n    </div>"},{"id":"N-J-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Joint</strong> domain (canonical source: <strong>MC 0593</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3 / AJP-5</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Joint CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Joint information exchanges between the entities of this directive (Strategic · Operational · Component); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Joint IER inventory across the Strategic · Operational · Component tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0593 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (Strategic · Operational · Component).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0593</strong> — Joint capstone directive (Minimum C2 Service Capabilities)</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3 / AJP-5 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-J-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> management discipline and the <strong>NAF v4.1</strong> viewpoint set to the <strong>MC 0593</strong> Joint capstone, producing 12 representative Use Cases across the strategic, operational and component / cross-domain tiers. Every UC carries the full APP-15 specification header (§8.1), the 14-row operational body (§8.2) with the APP-06 / STANAG 5516 entity-identity model in row 9, and a C3 Taxonomy Baseline 7.0 service classification consistent with the Land, Maritime and Air siblings.</p>\n\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Tier coverage</h3><p><strong>Strategic</strong> (3 — direction/OPLAN, NAC consultation, strategic COP), <strong>Operational</strong> (6 — joint coordination, COP fusion, joint targeting, JISR/CCIRM, logistics RLP, battle rhythm), <strong>Component / cross-domain</strong> (3 — CDS intel ingest, air–joint integration, cyberspace reporting).</p></div>\n      <div><h3>Service coverage (C3 Taxonomy B7.0)</h3><p>Exercises <em>Situation Awareness / Recognized Picture</em>, <em>Operations Planning / Targeting</em>, <em>JISR</em>, <em>Logistics</em>, <em>Tasking &amp; Order</em>, <em>Military Messaging</em>, <em>Audio / Video Collaboration</em>, <em>Content Management</em>, <em>Air Services</em>, and <em>Cyber Security Services</em> — the joint capstone service spine on which the tactical siblings depend.</p></div>\n      <div><h3>Threat / identity coverage</h3><p>Risk meter spans 1/5 to 4/5. Row-9 identity uses the four APP-06 / STANAG 5516 categories (Friendly · Hostile · Neutral · Unknown). The four §5 constraint blocks (PCN · service-oriented core · STANAG 4774/4778 + CDS · multi-domain &amp; cyber) map onto every UC's transport row and attack-surface row.</p></div>\n    </div>\n\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>The capstone is a service spine, not a bearer set.</strong> Where the tactical siblings are defined by waveforms and radios, MC 0593 is defined by FMN core enterprise + COI services and the C3 Taxonomy Baseline 7.0 classification that makes them interpretable across all four directives.</li>\n      <li><strong>PCN + label-bound CDS are the federation-critical controls.</strong> STANAG 4711 PCN appears in every UC; STANAG 4774 confidentiality labels with STANAG 4778 binding, validated at a CDS, govern every cross-domain release (UC-010 most acutely).</li>\n      <li><strong>Identity de-confliction is a first-class requirement.</strong> Joint COP fusion (UC-005) and air–joint integration (UC-011) depend on STANAG 5516 entity-identity rules and APP-6 symbology to present one identity per entity across domains.</li>\n      <li><strong>Cyberspace is transversal.</strong> UC-012 treats attribution as <em>Unknown</em> until confirmed and mandates an out-of-band reporting path per AJP-3.20 — a capstone-level assurance the tactical siblings inherit.</li>\n    </ul>\n\n    <h2>11.3 — Open work, NISP B16 nomenclature &amp; FMN Spiral 6</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are <code>DRAFT v0.1</code>; ratification by SHAPE J6 / NCIA and the FMN community of interest is required before any UC moves to <code>APPROVED</code>.</li>\n      <li><strong>NISP B16 nomenclature:</strong> every profile cited uses the exact catalogue identifier where verified (e.g. <code>PFL-00403</code> · <code>PFL-00402</code> · <code>PFL-00405</code> · <code>PFL-00446</code> in Service Area <code>CI-1062</code>; AEP-76 volumes <code>STD-00772/00774/00776/00778/00780</code> under <code>STANAG 4677 Ed.1</code>). Where a joint / air / maritime core-service profile ID is not independently verified against the gated catalogue, it is cited by Service Area + profile title + Spiral rather than a fabricated PFL number — the canonical source is <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16 / AC/322-D(2024)0053</a>.</li>\n      <li><strong>FMN Spiral alignment:</strong> the UCs realise <strong>FMN Spiral 5</strong> services (NISP Baseline 16). <strong>FMN Spiral 6</strong> carries the not-yet-implemented novelties — Data-Centric Security with Attribute-Based Encryption, zero-trust federation, AI-assisted COP fusion, and the C2D2E / DDIL resilience set treated in the linked <a href=\"MC_0XXX_C2D2E_Use_Cases.html\">C2D2E</a> document. Treat any Spiral-6 wording as <em>anticipatory doctrine</em> until a future NISP baseline formalises the corresponding PFL profiles.</li>\n    </ul>"}]}},"L":{"code":"L","name":"Land","mc":"MC 0640","reqPrefix":"L","collections":{"useCases":[{"id":"UC-L-001","serial":"S-COY-CFF-01","band":"Company","title":"Dismounted Call For Fire under EW jamming","sub":"Nation A light infantry company coordinates immediate fires with a Nation B mortar section 4 km away through a contested forest mesh.","cls":"MS","prec":"Flash","env":"HO","lpi":4,"avail":"Mission (best-effort recovery under jamming)","timeWindow":"Mission window 4–6 h","zones":"AOR 1.5 × 1.5 km · Coalition CoI","ier":{"who":"Coy Forward Observer (Nation A) ➜ Mortar Section (Nation B)","what":"Voice (Secure) Call For Fire · XMPP plain-text target coordinates","when":"burst on PTT","protection":"Mission Secret · STANAG 4774 labels at CNR-IP gateway · per-link MELPe key","volume":"Ultra-low · 2.4 kbps voice + bytes-per-burst XMPP"},"equipment":["Tri-band SDR at Coy HQ + legacy analogue VHF radios for dismounted soldiers","NATO NBWF Profile A (STANAG 5630/5634, AComP-5630 Annex G) · VHF Low 30–88 MHz · 25 kHz channels","MELPe codec at 2.4 kbit/s over RTP/UDP/IPv4 · VARC half-duplex PTT (AComP-5634 / STANAG 5634)","Ruggedised backpack edge router enforcing PFL-00446 (DSCP / IGMPv3 / UDP)"],"attackSurface":"Legacy VHF mesh has no native auth; CNR-IP gateway is the single label-enforcement point. Mitigation: per-link key + DSCP starvatio e-mission and on demand","zones":"Coy AOR · BG/Bde shared environmental CoI","ier":{"who":"Coy CFST ➜ BFDC","what":"METEOC Info (Meteorology Services / Environmental Services / COI Services)","when":"Pull on demand","protection":"NR · STANAG 4774 routine label","volume":"Low · structured METEOC packet a few hundred bytes"},"equipment":["JDSS pub/sub (GenInfo METEOC, AEP-76) on Bde DCIS","Tactical IP transport via ESSOR HDR · UHF / L-band 225 MHz – 2.5 GHz","NFV blade caches METEOC for offline ballistic calc","PFL-00446 DSCP CS2"],"attackSurface":"Met data poisoning is low-risk but possible; counter with signed packets and consistency checks against neighbouring Coys.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083"],"coi":["CI-1062"],"tc05":"NATO + Mission Partners · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-L-009","serial":"S-COY-RECCE","band":"Company","title":"Coy Recce Patrols → COIST sensor report","sub":"Dismounted recce patrol pushes ground-truth observations (vehicle counts, ID, posture) up to the Company Intelligence Support Team.","cls":"NS","prec":"Priority","env":"HO","lpi":4,"avail":"Mission","timeWindow":"Patrol window","zones":"Coy recce zone · COI restricted to BG ISR cell","ier":{"who":"Coy Recce Patrol ➜ COIST","what":"Informal Message + sensor product attachment (Informal Messaging Services / Core Services)","when":"Event-driven · timeliness per national profile (not in the FMN IER)","protection":"NS · STANAG 4774 labels per report","volume":"Low · text + small JPEG attachments"},"equipment":["Long-range handheld SDR with NBWF · directional antenna · short-burst tactical messenger","NBWF UHF 225–400 MHz · 25 kHz channels","XMPP attachment relay via Coy NFV blade","Multicast aggregation to COIST via IGMPv3 (RFC 3376)","Brevity-only voice fallback on NBWF if data path saturated"],"attackSurface":"Patrol radio signature is the highest LPI/LPD challenge on a spoofed position fix is detectable downstream.","regional_plan":"Transversal","legal_framework":"Article 4 (multi-nation)","op_level":"SJO","arf_doctrine":"Scenario context — CYBER REACH-BACK. ARF CyOC (Mons) leads cyber defence; this UC is the Land-side tactical effect — RSOMI convoys must complete the move despite GPS spoofing, otherwise force flow into BALTIC SHIELD breaks.","ct_asymmetric":"Ransomware-as-a-service proxies harass national rail and port systems; the convoy operates assuming RSOMI nodes can be intermittently degraded.","transition":"As GPS denial localises, convoys revert to L1 GPS as primary; M-Code remains the operationally-mandated default for mission-critical platforms under MC 0593 transversal cybersecurity baseline.","fmn_spiral6":"BG joins Day-Zero MNE via PCN+. STIX/TAXII threat intel for GPS spoofing geolocate is ABE-gated to convoy commanders so a compromised national gateway cannot exfiltrate jammer locations. Zero-trust token issuance rooted at SHAPE.","ew_degradation":"L1 GPS spoofing across the RSOMI corridor. Counter: M-Code + Galileo PRS + Iridium STL three-source PNT fusion; STANAG 4606 Ed.4 Modem 21 anti-jam on the back-haul; signed LOGSITREP at origin to detect downstream tampering.","ier_matrix":[{"ier":"Convoy LOGSITREP","data":"JDSSDM (LOG) packet · signed at origin","latency":"≤ 30 min cadence","stanag":"JDSSDM (LOG, AEP-76 Vol II) · APP-11 LOGREP"},{"ier":"Position fix (resilient)","data":"M-Code + Galileo PRS + LEO STL fusion","latency":"≤ 30 s","stanag":"M-Code (GPS) · Galileo PRS · Iridium STL"},{"ier":"GPS jammer geolocate","data":"Multi-source bearings · ABE-gated","latency":"≤ 30 s","stanag":"STIX/TAXII · ABE policy"}],"gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1080"],"coi":["CI-1062"],"tc05":"NATO + Mission Partners · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-L-038","serial":"S-NOR-DEU-BDE-HANDOFF","band":"Brigade","title":"NOR coastal Bde → DEU multinational Bde JC3IEDM ORBAT hand-off during the ARF Strategic Swing (STRATEGIC SWING)","sub":"At D+2 of the dilemma-imposing dual-theatre crisis, SACEUR executes the ARF Strategic Swing — Maritime/SOF effort in Plan Norte gives way to Land/Air effort in Plan Centro. This UC is the tactical Land hand-off: the Norwegian coastal Brigade transfers its operational picture (ORBAT delta + FRAGO + COP) to the German-led Multinational Brigade arriving at the Lithuania POE, while the ABE policy plane flips federation scope from MARCOM-Norte to LANDCOM-Centro without re-issuing certificates.","cls":"NS","prec":"Flash","env":"HO","lpi":4,"avail":"Mission · hand-off completed inside the 72-hour swing window","timeWindow":"D+2 to D+5 · ABE policy update ≤ 60 s · FRAGO ≤ 5 min · ORBAT delta ≤ 15 min","zones":"NOR coastal Bde AOR (hand-off source) · LT Lithuania POE (hand-off receiver) · ARF backbone","ier":{"who":"NOR coastal Bde G3 ➜ DEU MN-BCT G3 (Lithuania POE) · with notification to MNC NE + JFC Brunssum","what":"JC3IEDM ORBAT delta + FRAGO push + COP sync + ABE token attribute flip · APP-11 MTF formal hand-off message","when":"Event-driven · timeliness per national profile (not in the FMN IER)","protection":"NS · STANAG 4774 labels · SACEUR-signed swing order · JC3IEDM ORBAT delta cryptographically chained","volume":"Moderate · the pivot is policy-plane, not network-plane"},"equipment":["NOR Bde DCIS NFV stack + DEU MN-BCT DCIS NFV stack (Day-Zero federations on both sides)","Common ABE policy domain rooted at SHAPE — single token issuer, two scopes (MARCOM-Norte, LANDCOM-Centro)","STANAG 4711 PCN+ tunnels into both Plan Norte and Plan Centro MNEs","JC3IEDM ORBAT publish/subscribe service on both Bde DCIS","ESSOR HDR UHF/L-band 225 MHz – 2.5 GHz · MIL Ka-band SATCOM augmenting under cross-theatre time pressure","STANAG 4606 Ed.4 Modem 21 on both backbones for resilience under timed cyber/EW pulses"],"attackSurface":"Adversary times cyber + EW pulses against the predictable swing window; the ABE token issuer is the highest-value target. Counter: pre-rehearsed swing playbook with no-net-change ABE policy plane; SACEUR personally certifies the swing order; STANAG 4606 Ed.4 backbone resilient to local jamming; ABE token issuance uses multi-party computation so no single national CA compromise can topple the federation during the swing.","regional_plan":"Cross-Plan","legal_framework":"Article 4 (dual theatre)","op_level":"MJO","arf_doctrine":"Scenario context — STRATEGIC SWING. SACEUR pivots ARF main effort Plan Norte → Plan Centro in < 72 h. This UC is the tactical Land hand-off that makes the strategic swing visible at Bde level — the policy-plane flip carries operational meaning only when the receiving Bde inherits an actionable ORBAT + FRAGO + COP.","ct_asymmetric":"Multi-vector influence operations + cyber harassment of swing logistics nodes. NCIRC + StratCom COE handle the irregular layer; the Bde hand-off proceeds on the rehearsed playbook.","transition":"After D+30 absorption by NATO Force Model Tier-1 follow-on, JFC Brunssum assumes operational command in Plan Centro and the ABE token attribute flips again — this time from 'ARF Strategic Swing' to 'NFM Tier-1 steady-state' — without re-issuing certificates.","fmn_spiral6":"Two simultaneous Day-Zero federations (Plan Norte Maritime MNE + Plan Centro Land MNE) share a common ABE policy domain rooted at SHAPE. The pivot is a policy-level operation, not a network-level rebuild: ABE tokens carrying the ARF 'Strategic Swing' attribute flip their scope from MARCOM to LANDCOM-Centro in ≤ 60 s.","ew_degradation":"Adversary-timed cyber + EW pulses against the swing window. Counter: pre-rehearsed swing playbook, SACEUR-certified swing order, STANAG 4606 Ed.4 Modem 21 on both backbones, MPC-based ABE token issuance, LEO comms augmentation under SATCOM jamming.","ier_matrix":[{"ier":"ABE policy attribute flip","data":"Token issuer policy push · MARCOM → LANDCOM scope ng &amp; Order Services (COI) · ESSOR HDR UHF/L-band + SATURN UHF 225–400 MHz FFH for air-ground · short-validity tasking tokens"},{"uc":"UC-L-030","radio":"Thales Synaps","nfv":"Klas Voyager","c2":"Saab 9LAND C2 / Systematic SitaWare HQ (dynamic targeting bus)","cds":"—","naf":"<strong>NOV-5 / NSOV-1</strong> · Targeting (dynamic) · ESSOR HDR UHF/L-band · JDSS TST replication (AEP-76) · DSCP EF · dual-sensor confirmation"},{"uc":"UC-L-031","radio":"L3Harris AN/PRC-163 (Coy CCIR Manager handheld)","nfv":"Klas Voyager (BG RFI service)","c2":"Systematic SitaWare Edge","cds":"—","naf":"<strong>NOV-5 / NSOV-4</strong> · Requests &amp; Responses (LAND Services) · NBWF UHF 225–400 MHz + ESSOR HDR back-haul up to Bde"},{"uc":"UC-L-032","radio":"Thales Synaps (ESSOR back-haul to BG)","nfv":"Klas Voyager spare blade + PacStar 400-Series power","c2":"Systematic SitaWare Edge (signed golden image)","cds":"—","naf":"<strong>NOV-5 / NSOV-4</strong> · Core Enterprise Services (DCIS restore) · ESSOR HDR UHF/L-band · signed VNF policy + golden-image reseed · per-blade key rotation"}],"nafOverrides":[{"ucId":"UC-L-001","goal":"Enable immediate indirect fires on a dismounted contact under EW","trigger":"Forward observer identifies hostile target inside Coy AOR","preconditions":"Coy NBWF mesh active · mortar section laid · CNR-IP gateway nominal","postconditions":"Fire mission accepted by mortar section · target serviced · CFST resumes observation"},{"ucId":"UC-L-002","goal":"Federate a manoeuvring BG into the coalition core within the 20-minute STEADFAST COBALT target","trigger":"BG retrograde manoeuvre completes; vehicle halts","preconditions":"Spare NFV blade powered · golden image signed · SATCOM line-of-sight to FMN core","postconditions":"PCR up · BGP-4 announce accepted · BG visible to all 32 nations · BFT flowing"},{"ucId":"UC-L-003","goal":"Ingest CDS-degraded intel from Division reach-back without violating Bde-level classification","trigger":"Division intel package arrives at the Bde NNI","preconditions":"Advenica/Fox-IT CDS policy current · STANAG 4774 label registry synced","postconditions":"Intel package distributed inside Bde enclave · degraded view available to BGs · audit trail signed"},{"ucId":"UC-L-007","goal":"Sensor-to-shooter sub-5-minute conversion from CFST observation","trigger":"CFST observer identifies engageable target","preconditions":"Fires net silent · CFST cleared to call","postconditions":"Fire mission acknowledged · target effects assessed"},{"ucId":"UC-L-016","goal":"Maintain shared BFT across two nations inside the same BG","trigger":"BG continuous operations","preconditions":"Both nations' BFT terminals registered · CDS label policy synced · BGP-4 NNI converged","postconditions":"Each nation's vehicles see the other's positions in real time"},{"ucId":"UC-L-019","goal":"Service Bde deep targets with high-tempo digital fires","trigger":"BJFC identifies validated deep target","preconditions":"DBAWS firing units online · AEP-76 / JDSSDM fires bus (Overlay+Contact) nominal","postconditions":"Deep target serviced · BDA collected · target folder updated"},{"ucId":"UC-L-024","goal":"Push fused theatre intel to the Bde ASAC for action","trigger":"CIFC publishes a new INTREP relevant to the Bde AOR","preconditions":"CIFC↔Bde ASAC PCN tunnel up · STANAG 4774 label policy current","postconditions":"INTREP delivered, acknowledged, and acted upon at Bde level"},{"ucId":"UC-L-032","goal":"Restore Coy C2 services after physical CP loss within 30 minutes","trigger":"Coy CP NFV blade declared lost (kinetic or capture)","preconditions":"BG reserve blade available · signed golden image present · per-blade key issuable","postconditions":"Coy back on the C2 net · keys rotated · audit log of restore archived"}],"echelons":[{"lbl":"Company","tier":"L","desc":"1.5 × 1.5 km AOR · NBWF + legacy VHF + XMPP — MC 0640 lowest in scope"},{"lbl":"Battle Group","tier":"M","desc":"4 × 5 km AOR · ESSOR HDR + NBWF, PCR stand-up via SATCOM"},{"lbl":"Brigade","tier":"M","desc":"15 × 25 km AOR · MarLOS STANAG 4691 + SATURN Ed.4 + PCN tunnels — top of MC 0640 focus"},{"lbl":"Division","tier":"H","desc":"30 × 60 km AOR · reach-back target for Bde · MC 0593 territory","upstream":true},{"lbl":"Corps","tier":"H","desc":"Multi-division strategic backbone · MC 0593 territory","upstream":true},{"lbl":"LANDCOM","tier":"H","desc":"Land Component Command — theatre-level C2 hub · MC 0593 territory","upstream":true}],"scenarios":[],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-L-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents 38 Use Cases for the Land Tactical CIS profile <strong>PFL-00403</strong>, drawn from the Information Exchange Requirement tables of <strong>Annex C to Draft MC 0640</strong>. UC-001..UC-032 cover the steady-state Brigade-and-below catalogue; UC-033..UC-038 are tactical Land IERs anchored in the new doctrine of the <strong>Allied Reaction Force (ARF)</strong> operating under MC 0593 across the three Regional Plans (Norte · Centro · Sur) and through Major Joint Operations Adjacent. Every UC is generated under the <strong>NAF v4 + ADatP-47</strong> methodology, grounded in <strong>AJP-5</strong> (Operational Planning), <strong>AJP-6</strong> (CIS) and <strong>AJP-01</strong> (Allied Joint Doctrine), and overlaid with the <strong>FMN Spiral 6</strong> technical realities (Data-Centric Security · Attribute-Based Encryption · STANAG&nbsp;4606&nbsp;Ed.&nbsp;4 protected tactical communications · accredited unmanned sensor federations).</p>\n    <p>Every UC card carries two parts: a <em>NAF v4 · ADatP-47 Specification Header</em> (formal IER ID, primary actor, goal, trigger, pre/postconditions, NAF view, FMN service, releasability, doctrinal basis) and a <em>14-row Operational Body</em> (the six IER dimensions plus equipment, time window, environment, zones, availability, classification, risk meter, and attack surface). The \"Copy\" button on each card emits a Word-ready HTML table — paste directly into a Word document.</p>\n    <div>\n      <div><h3>Scope</h3><p>Brigade · Battle Group · Company. MC 0640 covers LANDCOM downward; this report focuses on Bde-and-below. Upper echelons (Division, Corps, LANDCOM) appear only as upstream reach-back context.</p></div>\n      <div><h3>Method</h3><p>NAF v4 NOV/NSOV views + ADatP-47 SysML-style UC packages. AJP-5 supplies commander's intent; AJP-6 mandates the service-oriented stance. STEADFAST COBALT supplies the technical constraints.</p></div>\n      <div><h3>Realisation</h3><p>FMN Spiral 5 / NISP Baseline 16 services on a typical NATO stack: <strong>Systematic SitaWare</strong> on <strong>Klas Voyager</strong>, routed by <strong>Cisco ESR6300</strong>, into <strong>Thales Synaps</strong> / <strong>L3Harris AN/PRC-163</strong> SDRs, with <strong>Advenica / Fox-IT</strong> CDS at every NNI.</p></div>\n    </div>"},{"id":"N-L-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Land</strong> domain (canonical source: <strong>MC 0640</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.2</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Land CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Land information exchanges between the entities of this directive (Company · Battle Group · Brigade); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Land IER inventory across the Company · Battle Group · Brigade tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0640 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (Company · Battle Group · Brigade).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0640</strong> — Land tactical directive (PFL-00403 / FMN Spiral 5)</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.2 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-L-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report has applied the NAF v4 + ADatP-47 framework deterministically to the Information Exchange Requirement tables of <strong>Draft MC 0640 Annex C</strong>, producing 32 representative Use Cases across the three echelons in scope (Company · Battle Group · Brigade). Each UC carries the full formal specification header (16 fields per §8.1) and the 14-row operational body (§8.2), and is realisable on the typical NATO ground stack documented in Annex A and Annex C.</p>\n\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Echelon coverage</h3><p>All three MC 0640 tactical bands at 38 UCs total: <strong>Company</strong> (11 UCs — voice + chat + BFT + fires + CASEVAC + recce + ARF-context coastal CT), <strong>Battle Group</strong> (11 UCs — CP stand-up + BFT + formal messaging + VTC + multinational coordination + cross-national CFF + RSOMI under GPS denial), <strong>Brigade</strong> (16 UCs — fires + intel + airspace + EW + sustainment + UAS ISR + coastal observation push to ARF Maritime MNE + GBAD RAP segment + Bde-to-Bde Strategic Swing hand-off). UC-033..UC-038 are tactical Land IERs anchored in ARF / Regional Plan / MJO-Adjacent scenarios (ARCTIC SENTINEL · BALTIC SHIELD · MEDITERRANEAN GUARDIAN · BLACK SEA HORIZON · CYBER REACH-BACK · STRATEGIC SWING) with the FMN Spiral 6 overlay (DCS · ABE · STANAG 4606 Ed.&nbsp;4).</p></div>\n      <div><h3>Service coverage</h3><p>The FMN Spiral 5 / PFL-00403 service catalog is exercised across <em>Voice (Secure)</em>, <em>Tactical Messaging (XMPP)</em>, <em>Military Messaging (APP-11 MTF)</em>, <em>Situational Awareness (NFFI / BFT)</em>, <em>Targeting (AEP-76 / JDSSDM Overlay+Contact)</em>, <em>Environmental (METEOC / JDSSDM GenInfo)</em>, <em>VTC + Office Collab</em>, <em>Logistics</em>, <em>EW Services</em>, <em>Information Management / Document Collab</em>, <em>Core Networking (PCN)</em>, and <em>Airspace Management</em>.</p></div>\n      <div><h3>Threat coverage</h3><p>Risk meter spans 1/5 (garrison RF) to 5/5 (LPI+LPD mission-critical under EW). The four STEADFAST COBALT constraint blocks (PCN · echelon-tiered bandwidth · STANAG 4774 NNI labels · NFV/DCIS) are mapped onto every UC's row 7 (Equipment) and row 14 (Attack Surface).</p></div>\n    </div>\n\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>Bearer tier maps cleanly to echelon.</strong> Company-level UCs land predominantly on NBWF (VHF 30–88 MHz / UHF 225–400 MHz, 25 kHz channels) with MELPe-2400. BG/Bde UCs land on ESSOR HDR (UHF/L-band 225 MHz – 2.5 GHz) with SATCOM uplink for higher reach-back. No UC required a bearer outside the NBWF/ESSOR/SATURN/SATCOM matrix.</li>\n      <li><strong>PCN is the single point of trust at BDE-and-up.</strong> STANAG 4711 IPsec PCN + BGP-4 federation appears as a precondition in 18 of 32 UCs. PCR compromise would cascade through every dependent UC — addressed via TCP-AO authentication and RPKI-style origin validation.</li>\n      <li><strong>STANAG 4774 label enforcement is the federation-critical control.</strong> Cross-domain releasability decisions (NS → NR/NU degradation) recur in 7 UCs spanning intel ingress, multinational BFT, and air-ground coordination. Advenica / Fox-IT CDS appliances are the named realisation in Annex A.</li>\n      <li><strong>NFV stand-up time is the operational tempo gate.</strong> The STEADFAST COBALT &lt;30-minute target appears explicitly in UC-002 (BG CP stand-up, &lt;20 min target) and UC-032 (Coy NFV blade restore, &lt;30 min). The Klas Voyager + Cisco ESR6300 + Systematic SitaWare Edge stack is the de-facto realisation.</li>\n      <li><strong>Vendor consolidation around four blocks.</strong> The 32 NATO nations procure across the four blocks listed in §6 (SDR · NFV · C2 software · CDS). Annex A confirms a typical UC requires at least one vendor from each of Block 1, 2 and 3; Block 4 (CDS) appears only in cross-domain UCs.</li>\n    </ul>\n\n    <h2>11.3 — Open work &amp; future iterations</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are currently <code>DRAFT v0.1</code>. Ratification by LANDCOM CCIS Branch and the FMN community of interest is required before any UC moves to <code>APPROVED</code>.</li>\n      <li><strong>Annex C coverage:</strong> the 32 UCs sample the inventory of <strong>1,339 persisted Annex C Serials</strong> (extraction exhausts the source PDF; Air Support / Medical / Non-NATO sections are absent from this copy of Draft MC 0640). The UC&nbsp;↔&nbsp;Serial mapping is persisted as <code>serials/uc_serial_map.json</code>: 24 of the 32 UCs anchor to a canonical Annex C row, 4 are unmapped (Medical / restore / UAS-as-source / BG-VTC gaps), 7 anchor labels were corrected against the canonical JSON, and the §10 Serial sample was regenerated row-by-row from the JSON. A full reverse index (every Annex C Serial → UC) is the next iteration.</li>\n      <li><strong>PFL-00403 enrichment:</strong> every one of the 1,339 Serials now carries an <code>enrich:{…}</code> field — typical bearer, frequency band, STANAG anchors, LPI/LPD base, default availability, and attack-surface theme — derived from a 4&nbsp;tier × 12&nbsp;category matrix in <code>serials/enrichment_dictionary.json</code> and persisted as <code>serials/annexC_enriched.json</code>. Coverage is 100% (every entity in the extraction and every IE Product is mapped). STANAG anchors are derived from STEADFAST&nbsp;COBALT + the canonical UCs and still need cross-validation against the formal NISP Baseline 16 PFL-00403 entry.</li>\n      <li><strong>NISP B16 alignment audit (2026-05-22):</strong> verified against the canonical Service Area CI-1062 inventory. <strong>PFL-00403</strong> (the deliverable's anchor) is confirmed as <em>Land Tactical C2 IE Profile (FMN Spiral 5)</em>, mandating AEP-76 Edition A Version 3 (2023) Volumes I–V under STANAG 4677 Ed.1, with the JDSSDM 1.2 message set on the JDSS Gateway in exclusive mode (BR BACK010). <strong>PFL-00446</strong> \"IP Access to Tactical Radio (FMN Spiral 5)\" is confirmed as the canonical edge-IP profile cited in Coy-band UCs (mandates AEP-76 Volume V). A separate finding: many UC equipment lines reference <em>\"MIP4\"</em> generically — strictly, PFL-00403 uses MIP 3.1 XML extended with JDSSDM 1.2 (not MIP4). MIP4 = PFL-00402 is a peer profile in the same Spiral 5; PFL-00405 mediates between them. Future iteration: tighten Coy / BG card text to read \"AEP-76 / JDSSDM (STANAG 4677)\" where the canonical anchor is JDSS rather than MIP4.</li>\n      <li><strong>UAS data-link characterisation (UC-028):</strong> the platform-specific L/C-band data link is intentionally generic. Per-platform refinement (e.g. specific NATO RPAS Initial Capability waveforms) belongs to a follow-on iteration.</li>\n      <li><strong>Bilateral / national-specific bearers</strong> (e.g. national C2 stacks of Nations C/D in UC-016) are abstracted in this report. A nation-specific edition can substitute Systematic SitaWare with national C2 stacks while keeping the FMN-side profile identical.</li>\n    </ul>\n\n    <h2>11.4 — Audit history</h2>\n    <p>Chronological trail of substantive changes applied since the initial draft. Each row represents a closed audit / iteration cycle.</p>\n    <table>\n      <thead><tr><th>Date</th><th>Iteration</th><th>Outcome</th></tr></thead>\n      <tbody>\n        <tr><td>2026-05-20</td><td>Initial draft (v0.1)</td><td>32 UCs (Coy 10 / BG 9 / Bde 13) generated under NAF v4 + ADatP-47. Annex C extraction underway.</td></tr>\n        <tr><td>2026-05-21</td><td>Annex C extraction complete</td><td>1,339 Serials persisted (S-001..S-1339) covering Tables C-1..C-7 (partial C-7); PDF source exhausted. UC↔Serial Phase 1 mapping (24/32 anchored, 7 anchor labels corrected). SERIAL_SAMPLE regenerated against canonical JSON. PFL-00403 enrichment dictionary applied to all 1,339 rows.</td></tr>\n        <tr><td>2026-05-22 (am)</td><td>HTML interactive · §10 enrichment surfacing</td><td>§10 Serial rows clickable to expand bearer/freq/STANAGs/LPI/attack-theme detail. §4 framework expanded with MC 0593 capstone + MC 0640/0195/0655 tactical siblings + Space/Cyber transversal.</td></tr>\n        <tr><td>2026-05-22 (am)</td><td>UC-033..UC-038 ARF scenarios</td><td>Six tactical Land IERs (Coy/BG/Bde) anchored in ARCTIC SENTINEL · BALTIC SHIELD · MEDITERRANEAN GUARDIAN · BLACK SEA HORIZON · CYBER REACH-BACK · STRATEGIC SWING. Modal CRUD + JSON schema v0.2 extended with Strategic doctrinal fields + IER matrix array editor.</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>NISP B16 alignment audit</td><td>Verified against canonical CI-1062 Land Domain Services inventory (7 PFLs) + related profiles (PFL-00312 / PFL-00446 / PFL-00406 / PFL-00408). MIP4 → JDSSDM/AEP-76 cleanup applied (45 patterns HTML, 10 dictionary; 21 MIP4 mentions preserved intentionally as acronym / explicit PFL-00402 distinction). STANAG 5525 → STANAG 4677 across enrichment. §4 panel with AEP-76 Volume map + JDSS message taxonomy + FMN Spiral 6 disclaimer. §12 References A–R augmented with D / D.1 / D.2 / D.3 (STANAG 4677 · STANAG 4619 · APP-6(D)).</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Vendor URL audit</td><td>VENDOR_URLS map rebuilt against live vendor sites: 6 broken deep links rolled back to verified homepages; Systematic SitaWare migrated to <code>/int/industries/defence/products/sitaware-suite/{component}/</code>; Curtiss-Wright PacStar rebased to <code>defense-solutions.curtisswright.com</code>; Leonardo Guardian Vantage added (uk.leonardo.com — modular passive land EW + SIGINT) and surfaced in UC-023 equipment row. SitaWare Tactical Communication added as a new entry.</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Final re-apply &amp; sanity check</td><td>annexC_enriched.json regenerated against the corrected dictionary (0 STANAG 5525, 0 MIP4, 74 STANAG 4677, 306 JDSSDM/AEP-76). Embedded JSON validated (11 keys, 4 tiers). JS braces balanced (1156/1156). USE_CASES closure verified. 38 UC entries (Coy 11 / BG 11 / Bde 16).</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Internal anchors + reference URL audit</td><td>All 28 distinct <code>href=\"#xxx\"</code> anchors in topnav/ tactical (MC 0655)","tier":"M","desc":"Maritime-air integration boundary (RAP / ACO) · realised by MC 0655","upstream":true},{"lbl":"Land tactical (MC 0640)","tier":"M","desc":"Amphibious / NGFS integration boundary · realised by MC 0640","upstream":true}],"scenarios":[],"tdlLinks":[{"name":"Link 11","arch":"Netted for Broadcast — ATDLP-5.11 (STANAG 5511)","community":"Maritime and Air C2","employment":"Widely fitted to support real-time track-data exchange for picture compilation and C2 direction.","sop":"ATDLP-7.33 (study draft)"},{"name":"Link 11B","arch":"Point-to-Point — ATDLP-5.11 (STANAG 5511)","community":"Shore-Based Air Defence","employment":"Tactical information exchange between shore-based weapons, surveillance and C2 systems.","sop":"ATDLP-7.33"},{"name":"Link 16","arch":"Broadcast TDMA — ATDLP-5.16 (STANAG 5516)","community":"Joint Air Defence","employment":"High-capacity digital data link with Electronic Protective Measures (EPM) for a multi-warfare environment: air, surface, subsurface, land, space and BMD.","sop":"ATDLP-7.33"},{"name":"Link 16 / JREAP","arch":"JREAP Satellite/Serial/IP — ATDLP-5.18 (STANAG 5518)","community":"Joint BLOS / Static Air Defence Sites","employment":"Extends range-limited tactical networks to Beyond-Line-of-Sight (BLOS) and reduces dependence on relay platforms.","sop":"ATDLP-7.33"},{"name":"Link 22","arch":"Broadcast / Dynamic TDMA (NILE)","community":"Maritime and Air C2","employment":"Latest NATO digital data link for ships, submarines, aircraft and shore sites; LOS (UHF) + BLOS (HF); complements Link 16 with shared messages/data elements.","sop":"ATDLP-7.33"}],"cisServices":[],"narratives":[{"id":"N-M-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Maritime Use Cases</strong> for <strong>MC 0195/13</strong>, the most mature IER domain in the NATO CIS family and the trend-setter for Maritime and Air. The Use Cases span the <em>Maritime Component Command</em> (MCC), the <em>Task Force / Task Group</em> (CTF/CTG · PWC · AAWC) and the <em>platform / unit</em> tier (Principal Surface Combatants, submarines, MCM vessels, Maritime Patrol Aircraft and helicopters) with their assigned functions (ASUW/ASW · AAW · STRIKE/NGFS · ISR · logistics).</p>\n    <p>Each Use Case is a <strong>Requirement (REQ)</strong> fulfilled by a stack of <strong>Capability Elements (CapElem)</strong> per <strong>APP-15</strong> and the <strong>C3 Taxonomy Baseline 7.0</strong>, generated as a <strong>NAF v4.1</strong> view. Track identity follows <strong>STANAG 4162</strong> (Unknown · Assumed Friend · Friend · Neutral · Hostile); formal messages and tracks use <strong>APP-11(E)</strong> MTF in place of the ageing OTH-T GOLD. The 14-row body is structured against the Technical Constraints <strong>TC01–TC11</strong> (§8.4).</p>\n    <div>\n      <div><h3>Scope</h3><p>Afloat C2 (MCC · CTF/CTG · PWC/AAWC), platforms (PSC · CV · SS · MCM · AA · LL) and air units (MPA · MH), with their warfare and support functions — the realistic minimum CIS fit to meet the MCR.</p></div>\n      <div><h3>Method</h3><p>AJP-6 supplies the IER; APP-15 + the CapElem model (A.B.NNN) the management; NAF v4.1 the views; the C3 Taxonomy Baseline 7.0 the service classification. Figures of Merit and KPIs are defined per REQ family (§8.3).</p></div>\n      <div><h3>Realisation</h3><p>HF (BRASS) and SATCOM bearers, Link 11/16/22 (NILE) tactical data links, Maritime Rear Link, secure voice (SCIP/STACIS), and maritime C2 (MCCIS / NIRIS) — with CDS and STANAG 4774/4778 labels at every boundary.</p></div>\n    </div>"},{"id":"N-M-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Maritime</strong> domain (canonical source: <strong>MC 0195/13</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.1</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Maritime CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Maritime information exchanges between the entities of this directive (MCC · CTF/CTG · Platform); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Maritime IER inventory across the MCC · CTF/CTG · Platform tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0195/13 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (MCC · CTF/CTG · Platform).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0195/13</strong> — Maritime directive — the most mature IER domain</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.1 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-M-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>MC 0195/13</strong> model — IER &rarr; REQ &rarr; CapElem stack, with Figures of Merit and KPIs — under <strong>AJP-6</strong>, <strong>APP-15</strong> and <strong>NAF v4.1</strong>, producing 12 Maritime Use Cases across the MCC, CTF/CTG and platform tiers. As the most mature IER domain, MC 0195/13 sets the conventions the Air and Joint siblings inherit.</p>\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Tier coverage</h3><p><strong>MCC</strong> (3 — formal messaging C2D2E, RMP, MSA/White Shipping), <strong>CTF/CTG</strong> (6 — ASUW/ASW, AAW, NGFS, submarine broadcast, MCM, amphibious), <strong>Platform</strong> (3 — RAS/logistics, MPA/MH/RPAS ISR, cross-domain to Joint/Air).</p></div>\n      <div><h3>Service coverage</h3><p>Exercises Military Messaging, Recognized Maritime Picture, Situation Awareness, Maritime warfare, Targeting, Logistics and JISR services — each resolved to a CapElem stack (§9 cards / §10 catalogue).</p></div>\n      <div><h3>Identity &amp; threat coverage</h3><p>Row-9 exercises the full STANAG 4162 set — including <em>Assumed Friend</em> (UC-011 ISR). Track exchange uses APP-11(E), retiring OTH-T GOLD.</p></div>\n    </div>\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>The CapElem model originates here.</strong> MC 0195/13 expresses every IER as a REQ + CapElem stack (A.B.NNN) — the convention extrapolated to the whole family.</li>\n      <li><strong>APP-11(E) replaces OTH-T GOLD.</strong> Machine-processable tracks (XML / ADatP-3) supersede the ageing format across the RMP and AAW UCs.</li>\n      <li><strong>Identity discipline (STANAG 4162).</strong> RMP, AAW and ISR depend on rigorous identity, including the Assumed-Friend state pending positive identification.</li>\n      <li><strong>C2D2E is the design driver.</strong> The HF/BRASS + MRL + submarine-broadcast UCs assume denied/degraded conditions and emission control.</li>\n    </ul>\n    <h2>11.3 — Open work &amp; the legacy tool</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are <code>DRAFT v0.1</code>; ratification by MARCOM and the FMN community of interest is required.</li>\n      <li><strong>NISP B16 nomenclature:</strong> profiles are cited by exact catalogue identifier where verified, else by Service Area + Spiral; canonical source <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16</a>. FMN Spiral 5 implemented; Spiral 6 anticipatory.</li>\n      <li><strong>Legacy tool:</strong> the earlier UC&times;Serial matrix application is preserved as <code>MC_0195_Maritime_Use_Cases_legacy.html</code>; this document supersedes it with the modern CapElem / TC framework.</li>\n    </ul>"}]}},"A":{"code":"A","name":"Air","mc":"MC 0655 / 0695","reqPrefix":"A","collections":{"useCases":[{"id":"UC-A-001","serial":"S-AIR-ATO-01","band":"CAOC","title":"Air Tasking Order production &amp; dissemination","sub":"The Joint Force Air Component (CAOC) produces the daily Air Tasking Order from the Air Operations Directive and disseminates it to all executing wings, squadrons and supporting units.","cls":"NS","prec":"Immediate","env":"FR","lpi":2,"avail":"High (24/7)","timeWindow":"Daily ATO production cycle","zones":"Joint operations area airspace · air CoI","ier":{"who":"JFAC / CAOC ➜ Wings · Squadrons · supporting units","what":"Air Tasking Order (ATO) · Air Tasking Ord
