  /* ---------- QA / COMPLETENESS ---------- */
  qa(){
    const issues={dangling:[],missingTC:[],unreviewed:[]};
    const checkRefs=(coll,scope,rec,domCode)=>{ const sc=SCHEMAS[coll]; sc.fields.forEach(f=>{ const isRef=f.type===FT.REF||f.k==='cls'; const isMulti=f.type===FT.MULTIREF; if(!isRef&&!isMulti)return;
      const refName=f.k==='cls'?'classifications':f.ref; const refScope=f.k==='cls'?'global':f.refScope; const rsc=SCHEMAS[refName]; if(!rsc)return;
      const list=refScope==='global'?(DB.global[refName]||[]):(((DB.domains[domCode]||{}).collections||{})[refName]||[]); const ids=new Set(list.map(x=>String(x[rsc.id])));
      const vals=isMulti?(getPath(rec,f.k)||[]):[getPath(rec,f.k)];
      vals.forEach(v=>{ if(v!=null&&v!==''&&!ids.has(String(v))) issues.dangling.push({where:(scope==='global'?'global':domCode)+' / '+coll+' / '+rec[sc.id],field:f.k,value:v}); }); }); };
    GLOBAL_COLLECTIONS.forEach(c=>(DB.global[c]||[]).forEach(r=>checkRefs(c,'global',r)));
    Object.values(DB.domains).forEach(d=>DOMAIN_COLLECTIONS.forEach(c=>((d.collections&&d.collections[c])||[]).forEach(r=>checkRefs(c,'domain',r,d.code))));
    Object.values(DB.domains).forEach(d=>((d.collections&&d.collections.useCases)||[]).forEach(u=>{
      const miss=[]; if(!(u.equipment&&u.equipment.length))miss.push('TC01'); if(!(u.ier&&u.ier.who))miss.push('TC06·Who'); if(!u.cls)miss.push('TC08'); if(u.lpi==null||u.lpi==='')miss.push('TC09');
      if(miss.length)issues.missingTC.push({uc:u.id,dom:d.code,miss});
      if(!((u.gov||{}).reviewStatus)||u.gov.reviewStatus==='DRAFT')issues.unreviewed.push({uc:u.id,dom:d.code}); }));
    let h=Views.pageH('Quality assurance','QA / completeness','Pre-staffing checks — dangling references, missing Technical Constraints, and unreviewed Use Cases.','');
    h+=`<div class="cards"><div class="card ${issues.dangling.length?'bad':'ok'}"><div class="k">Dangling references</div><div class="v">${issues.dangling.length}</div><div class="d">ref fields pointing nowhere</div></div>`+
      `<div class="card ${issues.missingTC.length?'warn':'ok'}"><div class="k">UCs missing key TCs</div><div class="v">${issues.missingTC.length}</div><div class="d">TC01 / TC06 / TC08 / TC09</div></div>`+
      `<div class="card ${issues.unreviewed.length?'warn':'ok'}"><div class="k">Unreviewed UCs</div><div class="v">${issues.unreviewed.length}</div><div class="d">review = DRAFT / unset</div></div></div>`;
    h+=`<div class="panel"><h3>Dangling references</h3>`+(issues.dangling.length?`<div class="tbl-wrap"><table><thead><tr><th>Location</th><th>Field</th><th>Missing value</th></tr></thead><tbody>`+issues.dangling.map(x=>`<tr><td class="mono" style="font-size:0.74rem">${esc(x.where)}</td><td class="mono muted">${esc(x.field)}</td><td class="mono" style="color:var(--bad)">${esc(x.value)}</td></tr>`).join('')+`</tbody></table></div>`:`<div class="muted">None — every reference resolves.</div>`)+`</div>`;
    h+=`<div class="panel"><h3>Use Cases missing key Technical Constraints</h3>`+(issues.missingTC.length?`<div class="tbl-wrap"><table><thead><tr><th>UC</th><th>Domain</th><th>Missing</th></tr></thead><tbody>`+issues.missingTC.map(x=>`<tr><td class="mono"><a style="cursor:pointer" onclick="App.openUC('${x.dom}','${esc(x.uc)}')">${esc(x.uc)}</a></td><td>${esc(x.dom)}</td><td class="muted">${esc(x.miss.join(', '))}</td></tr>`).join('')+`</tbody></table></div>`:`<div class="muted">None — all Use Cases carry the key TCs.</div>`)+`</div>`;
    h+=`<div class="panel"><h3>Unreviewed Use Cases (${issues.unreviewed.length})</h3><div style="display:flex;flex-wrap:wrap;gap:5px">`+(issues.unreviewed.length?issues.unreviewed.map(x=>`<span class="chip link" onclick="App.openUC('${x.dom}','${esc(x.uc)}')">${esc(x.uc)}</span>`).join(''):'<span class="muted">All reviewed.</span>')+`</div></div>`;

/* link STANAG/AAP/AJP-style tokens & UC ids inside free text to their records */
App.linkRefs=function(html){
  const refs=DB.global.references||[];
  refs.forEach(r=>{ if(!r.code)return; const re=new RegExp('\\b'+r.code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g');
    html=html.replace(re,`<a class="reflink" style="cursor:pointer;border-bottom:1px dotted" onclick="App.go({view:'collection',scope:'global',collection:'references',recordId:'${esc(String(r.code))}'})">${esc(r.code)}</a>`); });
  return html;
};

/* copy a record as JSON-ish duplicate */
App.copyRecord=function(coll,scope,id){
  const sc=SCHEMAS[coll]; const list=scope==='global'?DB.global[coll]:App.coll(coll);
  const rec=list.find(x=>String(x[sc.id])===String(id)); if(!rec)return;
  const dup=deepClone(rec); dup[sc.id]=String(rec[sc.id])+'-COPY';
  list.push(dup); App.save(); toast(`Duplicated as ${dup[sc.id]}`,'ok'); App.render();
};

/* extract a rendered table's data: visible (filtered) rows only, dropping the
   trailing "Actions" column. Shared by clipboard-copy and Word-file export. */
App._tableData=function(tableId){
  const tbl=document.getElementById(tableId); if(!tbl) return null;
  const ths=Array.from(tbl.querySelectorAll('thead th'));
  const drop=new Set(ths.map((th,i)=>/^(actions|)$/i.test(th.innerText.trim())?i:-1).filter(i=>i>=0));
  const keep=i=>!drop.has(i);
  const heads=ths.filter((_,i)=>keep(i)).map(th=>th.innerText.trim());
  const rows=[];
  tbl.querySelectorAll('tbody tr').forEach(tr=>{ if(tr.style.display==='none')return;
    rows.push(Array.from(tr.children).filter((_,i)=>keep(i)).map(td=>td.innerText.replace(/\s+/g,' ').trim())); });
  return {heads,rows};
};

    d.heads.map(x=>`<th style="${CELLCSS};background:#003F87;color:#fff;text-align:left">${e(x)}</th>`).join('')+`</tr></thead><tbody>`;
  d.rows.forEach(r=>{ h+='<tr>'+r.map(c=>`<td style="${CELLCSS}">${e(c)}</td>`).join('')+'</tr>'; });
  return h+'</tbody></table>';
}
/* copy ANY rendered table to clipboard (rich HTML table + tab-separated text). */
App.copyTable=function(tableId,label){
  const d=App._tableData(tableId); if(!d){ toast('No table to copy','err'); return; }
  const html=wordTable(d);
  const plain=[d.heads].concat(d.rows).map(r=>r.join('\t')).join('\n');
  try{
    const data=[new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})];
    navigator.clipboard.write(data).then(()=>toast((label||'Table')+' copied ('+d.rows.length+' rows) — paste into Word','ok'),()=>App._copyFallback(html,plain,label));
  }catch(e){ App._copyFallback(html,plain,label); }
};

<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->

/* download only the visible (filtered) rows as a JSON array of full records */
App.exportFilteredJSON=function(tableId,getRecById,label){

App.exportListJSON=function(coll,scope,tableId){ const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]||[]):App.coll(coll); App.exportFilteredJSON(tableId||('tbl_'+coll), id=>list.find(x=>String(x[sc.id])===String(id)), sc.plural); };
App.allUseCases=function(){ const out=[]; Object.values(DB.domains).forEach(d=>((d.collections&&d.collections.useCases)||[]).forEach(uc=>out.push({dom:d.code,domName:d.name,uc}))); return out; };
App.openUC=function(dom,id){ UI.domain=dom; App.go({view:'collection',scope:'domain',collection:'useCases',recordId:id}); };
App.exportAllUCJson=function(){ const all=App.allUseCases(); App.exportFilteredJSON('tbl_alluc', id=>{ const f=all.find(r=>r.uc.id===id); return f?Object.assign({_domain:f.dom},f.uc):null; }, 'All_Use_Cases'); };
/* ---- JSON-LD (Linked Data) — single serializer driven by SCHEMAS (DRY).
   Ref / multiref fields become @id links, so the whole dataset is one graph.
   Regenerated from the live DB on load and after every edit. ---- */
App._ldId=function(coll,scope,domCode,idv){ return 'urn:mdo:'+(scope==='global'?'global':(domCode||'_'))+':'+coll+':'+encodeURIComponent(String(idv)); };
App._ldNode=function(coll,scope,domCode,rec){
  const sc=SCHEMAS[coll];
  const node={ '@id':App._ldId(coll,scope,domCode,rec[sc.id]), '@type':String(sc.label||coll).replace(/[^A-Za-z0-9]+/g,'') };
  sc.fields.forEach(f=>{
    const v=getPath(rec,f.k); if(v==null||v===''||(Array.isArray(v)&&!v.length)) return;
    if(f.k==='cls') node[f.k]={ '@id':App._ldId('classifications','global',domCode,v) };
    else if(f.type===FT.REF) node[f.k]={ '@id':App._ldId(f.ref,f.refScope,domCode,v) };
    else if(f.type===FT.MULTIREF) node[f.k]=(v||[]).map(id=>({ '@id':App._ldId(f.ref,f.refScope,domCode,id) }));
    else node[f.k]=v;
  });
  return node;
};
App.toJsonLd=function(){
  const graph=[];
  GLOBAL_COLLECTIONS.forEach(coll=>(DB.global[coll]||[]).forEach(r=>graph.push(App._ldNode(coll,'global',null,r))));
  Object.values(DB.domains).forEach(d=>{
    const did=App._ldId('domains','global',null,d.code);
    graph.push({ '@id':did, '@type':'Domain', code:d.code, name:d.name, mc:d.mc, reqPrefix:d.reqPrefix||'' });
    DOMAIN_COLLECTIONS.forEach(coll=>((d.collections&&d.collections[coll])||[]).forEach(r=>graph.push(Object.assign({ inDomain:{ '@id':did } }, App._ldNode(coll,'domain',d.code,r)))));
  });
  return { '@context':{ '@vocab':'https://mdo.nato.int/grc#', xsd:'http://www.w3.org/2001/XMLSchema#', inDomain:{ '@type':'@id' } },
           '@type':'Dataset', schema:DB.schema, generatedAt:(DB.generatedAt||new Date().toISOString()), '@graph':graph };
};
App.syncJsonLd=function(){ const el=document.getElementById('seed-jsonld'); if(el) el.textContent=JSON.stringify(App.toJsonLd()); };

/* ---- navigation history (browser-style back / forward) ----
   Every render() snapshots {domain, route}. Navigating to a new state truncates
   any forward entries (standard back/forward semantics); back()/forward() replay
   a snapshot without recording it. ---- */
App._hist=[]; App._hi=-1; App._navLock=false;
App.recordHist=function(){
  if(this._navLock) return;
  const snap={ domain:UI.domain, route:deepClone(UI.route||{}) };
  const cur=this._hist[this._hi];
  if(cur && cur.domain===snap.domain && JSON.stringify(cur.route)===JSON.stringify(snap.route)){ this._paintNavBtns(); return; }
  this._hist=this._hist.slice(0,this._hi+1);
  this._hist.push(snap); this._hi=this._hist.length-1;
  if(this._hist.length>200){ this._hist.shift(); this._hi--; }   // cap memory
  this._paintNavBtns();
};
App._restoreHist=function(){
  const s=this._hist[this._hi]; if(!s) return;
  this._navLock=true; UI.domain=s.domain; UI.route=deepClone(s.route); this.render(); this._navLock=false;
  this._paintNavBtns();
};
App.back=function(){ if(this._hi<=0) return; this._hi--; this._restoreHist(); };
App.forward=function(){ if(this._hi>=this._hist.length-1) return; this._hi++; this._restoreHist(); };
App._paintNavBtns=function(){ const b=document.getElementById('navBack'), f=document.getElementById('navFwd');
  if(b) b.disabled=this._hi<=0; if(f) f.disabled=this._hi>=this._hist.length-1; };
App.exportJsonLd=function(){
  const blob=new Blob([JSON.stringify(App.toJsonLd(),null,2)],{type:'application/ld+json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='MDO_GRC_Platform_'+new Date().toISOString().slice(0,10)+'.jsonld';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Exported JSON-LD graph','ok');
};
/* assemble the full linear report, then invoke the browser's native print → PDF */
App.printReport=function(){ if(this.syncPrintHeader)this.syncPrintHeader(); UI.route={view:'document'}; this.render(); setTimeout(()=>{ try{ window.print(); }catch(e){} },300); };

};
/* navigate to the grouped Acronyms table and highlight the term */
App.openAcronym=function(code){ this.go({view:'acronyms'}); const id='acr-'+String(code).replace(/[^A-Za-z0-9]/g,'_');
  setTimeout(()=>{ const el=document.getElementById(id); if(el){ el.scrollIntoView({block:'center'}); el.style.transition='background .3s'; el.style.background='rgba(203,161,53,0.28)'; setTimeout(()=>{el.style.background='';},1600); } },60); };
/* auto-decorate cited acronyms in the rendered report: hover = meaning + source; click = Acronyms table */
App.decorateAcronyms=function(){
  const root=document.getElementById('main'); const acr=(DB.global.acronyms)||[]; if(!root||!acr.length) return;
  const map={}; acr.forEach(a=>{ if(a.code) map[a.code]=a; });
  const codes=Object.keys(map).sort((a,b)=>b.length-a.length).map(c=>c.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
  let re; try{ re=new RegExp('(?<![\\w-])('+codes.join('|')+')(?![\\w-])','g'); }catch(e){ return; }
  const skip={A:1,ABBR:1,SCRIPT:1,STYLE:1,BUTTON:1,SUMMARY:1,INPUT:1,TEXTAREA:1,SELECT:1,OPTION:1,TH:1};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); const targets=[]; let n;
  while(n=walker.nextNode()){ let p=n.parentNode,bad=false; while(p&&p!==root){ if(skip[p.nodeName]||(p.classList&&p.classList.contains('acr'))){bad=true;break;} p=p.parentNode; }
    if(!bad&&n.nodeValue){ re.lastIndex=0; if(re.test(n.nodeValue)) targets.push(n); } }
  targets.forEach(tn=>{ const s=tn.nodeValue; re.lastIndex=0; let m,last=0; const frag=document.createDocumentFragment();
    while((m=re.exec(s))){ const code=m[1], a=map[code]; if(!a) continue;
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const el=document.createElement('abbr'); el.className='acr'; el.textContent=code;
      el.title=a.expansion+(a.source&&a.source!=='—'?' — '+a.source:'')+(a.group?' · '+a.group:'');
      el.onclick=function(e){ e.stopPropagation(); App.openAcronym(code); };
      frag.appendChild(el); last=m.index+code.length; }
    if(last>0){ if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(frag,tn); } });
};
App._copyFallback=function(html,text,label){
  const tmp=document.createElement('div'); tmp.contentEditable='true'; tmp.style.position='fixed'; tmp.style.left='-9999px'; tmp.innerHTML=html; document.body.appendChild(tmp);
  const rng=document.createRange(); rng.selectNodeContents(tmp); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng);
  try{ document.execCommand('copy'); toast((label||'Table')+' copied — paste into Word','ok'); }catch(e){ toast('Copy failed — select manually','err'); }
  sel.removeAllRanges(); tmp.remove();
};

/* ============================================================================
   MODAL — generic edit form generated from schema
   ========================================================================== */
const Modal = {
  ctx:null,
  open(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]||[]):App.coll(coll);
    const orig = id!=null ? list.find(x=>String(x[sc.id])===String(id)) : null;
    const rec = orig? deepClone(orig) : Modal.blank(sc);
    Modal.ctx={coll,scope,sc,origId:orig?orig[sc.id]:null};
    let body=''; let curSec=null;
    sc.fields.forEach(f=>{
      if(f.sec&&f.sec!==curSec){ curSec=f.sec; body+=`<div class="modal-sec">${esc(curSec)}</div>`; }
      body+=Modal.fieldHtml(f,rec);
    });
    $('#modal').innerHTML=`
      <div class="modal-h"><h3>${orig?'Edit':'New'} ${esc(sc.label)}</h3><button class="btn x" onclick="Modal.close()">✕</button></div>
      <div class="modal-b">${body}</div>
      <div class="modal-f"><span class="muted" style="margin-right:auto;font-size:0.72rem">${scope==='global'?'Global catalog':DB.domains[UI.domain].name+' domain'}</span><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Modal.save()">${orig?'Save changes':'Create'}</button></div>`;
    $('#overlay').classList.add('show');
    setTimeout(()=>{ const fi=$('#modal').querySelector('input,select,textarea'); if(fi)fi.focus(); },30);
  },
  blank(sc){ const o={}; sc.fields.forEach(f=>{ if(f.type===FT.LIST)setPath(o,f.k,[]); else if(f.type===FT.BOOL)setPath(o,f.k,false); else setPath(o,f.k,''); }); return o; },
  fieldHtml(f,rec){
    const v=getPath(rec,f.k); const fid='m_'+f.k.replace(/\./g,'_');
    const wide=f.wide||f.type===FT.AREA||f.type===FT.LIST||f.type===FT.HTML||f.type===FT.MULTIREF;
    let input='';
    if(f.type===FT.HTML) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}" style="min-height:160px;font-family:var(--font-mono);font-size:0.78rem" placeholder="HTML allowed: <p>, <ul><li>, <b>, <a href>…">${esc(v)}</textarea>`;
    else if(f.type===FT.AREA) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}">${esc(v)}</textarea>`;
    else if(f.type===FT.LIST) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}" placeholder="One per line">${esc((v||[]).join('\n'))}</textarea>`;
    else if(f.type===FT.NUM) input=`<input id="${fid}" data-k="${f.k}" data-t="${f.type}" type="number" value="${esc(v)}">`;
    else if(f.type===FT.BOOL) input=`<select id="${fid}" data-k="${f.k}" data-t="${f.type}"><option value="false" ${!v?'selected':''}>No</option><option value="true" ${v?'selected':''}>Yes</option></select>`;
    else if(f.type===FT.SEL){ const opts=Modal.options(f); input=`<select id="${fid}" data-k="${f.k}" data-t="${f.type}"><option value="">—</option>`+opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else if(f.type===FT.REF||f.k==='cls'){ const opts=Modal.refOptions(f); input=`<select id="${fid}" data-k="${f.k}" data-t="ref"><option value="">—</option>`+opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else if(f.type===FT.MULTIREF){ const sel=(Array.isArray(v)?v:[]).map(String); const opts=Modal.refOptions(f); input=`<select id="${fid}" data-k="${f.k}" data-t="multiref" multiple size="7" style="min-height:130px">`+opts.map(o=>`<option value="${esc(o.v)}" ${sel.includes(String(o.v))?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else input=`<input id="${fid}" data-k="${f.k}" data-t="${f.type}" value="${esc(v)}">`;
    return `<div class="fld ${wide?'wide':''}"><label>${esc(f.label)} ${f.req?'<span class="req">*</span>':''}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
  },
  options(f){ if(Array.isArray(f.options))return f.options.map(o=>({v:o,l:o})); return []; },
  refOptions(f){
    if(f.k==='cls') return (DB.global.classifications||[]).map(c=>({v:c.code,l:c.code+' — '+c.name}));
    const sc=SCHEMAS[f.ref]; const list=f.refScope==='global'?(DB.global[f.ref]||[]):App.coll(f.ref);
    return list.map(r=>({v:r[sc.id],l:String(r[sc.id])+(r[sc.title]&&r[sc.title]!==r[sc.id]?' — '+r[sc.title]:'')}));
  },
  save(){
    const {coll,scope,sc,origId}=Modal.ctx; const rec={};
    $('#modal').querySelectorAll('[data-k]').forEach(el=>{
      const k=el.dataset.k, t=el.dataset.t; let val=el.value;
      if(t===FT.MULTIREF) val=Array.from(el.selectedOptions).map(o=>o.value);
      else if(t===FT.NUM) val=val===''?'':(+val);
      else if(t===FT.LIST) val=val.split('\n').map(s=>s.trim()).filter(Boolean);
      else if(t===FT.BOOL) val=(val==='true');
      setPath(rec,k,val);
    });
    const idv=rec[sc.id];
    if(!idv||String(idv).trim()===''){ toast('“'+(sc.fields.find(f=>f.k===sc.id)||{}).label+'” is required','err'); return; }
    // unique id check (only when id changed / new)
    const list=scope==='global'?(DB.global[coll]||[]):App.coll(coll);
    if(String(idv)!==String(origId) && list.some(x=>String(x[sc.id])===String(idv))){ toast('An entry with id “'+idv+'” already exists','err'); return; }
    App.upsert(coll,scope,origId,rec);
    Modal.close(); toast((origId==null?'Created':'Saved')+' '+sc.label+' '+idv,'ok'); App.render();
  },
  close(){ $('#overlay').classList.remove('show'); Modal.ctx=null; },
};
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')Modal.close(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#overlay').classList.contains('show'))Modal.close(); }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){ const s=document.querySelector('.search'); if(s){e.preventDefault();s.focus();} }
  if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); App.back(); }
  if(e.altKey&&e.key==='ArrowRight'){ e.preventDefault(); App.forward(); }
});

window.addEventListener('resize',fitBurger);

App.load(); fitBurger();
