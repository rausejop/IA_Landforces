const Views = {
  pageH(eyebrow,title,sub,acts){
    return `<div class="page-h"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="acts">${acts||''}</div></div>`;
  },

  /* ---------- generic LIST ---------- */
  list(coll,scope){
    const sc=SCHEMAS[coll]; const list=(scope==='global'?DB.global[coll]:App.coll(coll))||[];
    const cols=sc.fields.slice(0,5);
    const tid='srch_'+coll;
    const acts=`<button class="btn primary" onclick="App.create('${coll}','${scope}')">＋ New ${esc(sc.label)}</button>`+
      (coll==='useCases'?` <button class="btn" onclick="App.go({view:'ierMatrix'})">IER Matrix ▤</button>`:'')+
      (coll==='c3Taxonomy'?` <button class="btn gold" onclick="App.go({view:'taxonomyTree'})">⊞ Hierarchy</button>`:'');
    let h=Views.pageH(scope==='global'?'Global GRC catalog':DB.domains[UI.domain].name+' · '+DB.domains[UI.domain].mc, sc.plural, sc.desc, acts);
    h+=`<div class="toolbar"><input class="search" id="${tid}" placeholder="Filter ${esc(sc.plural)}…" oninput="Views.filterRows('${coll}')"><button class="btn gold sm" onclick="App.copyTable('tbl_${coll}','${esc(sc.plural)}')">⧉ Copy</button><button class="btn sm" onclick="App.exportTableWord('tbl_${coll}','${esc(sc.plural)}')">⤓ Word</button><button class="btn sm" onclick="App.exportListJSON('${coll}','${scope}')">⤓ JSON</button><span class="muted mono" id="ct_${coll}" style="font-size:0.72rem"></span></div>`;
    h+=Views.facetBar(sc,coll,list);
    h+=`<div class="tbl-wrap"><table id="tbl_${coll}"><thead><tr>`+
       cols.map(f=>`<th>${esc(f.label)}</th>`).join('')+`<th style="text-align:right">Actions</th></tr></thead><tbody>`;
    if(!list.length) h+=`<tr><td colspan="${cols.length+1}"><div class="empty">No ${esc(sc.plural)} yet. <button class="btn primary sm" onclick="App.create('${coll}','${scope}')">Create the first one</button></div></td></tr>`;
    list.forEach(rec=>{ h+=Views.row(sc,coll,scope,rec,cols); });
    h+=`</tbody></table></div>`;
    $('#main').innerHTML=h;
    $('#ct_'+coll).textContent=list.length+' record'+(list.length===1?'':'s');
  },
  row(sc,coll,scope,rec,cols){
    const id=rec[sc.id];
    const open=`App.go({view:'collection',scope:'${scope}',collection:'${coll}',recordId:'${esc(String(id))}'})`;
    let tds=cols.map((f,i)=>{
      let v=Views.cell(f,rec);
      if(i===0) v=`<a class="mono" style="font-weight:700;cursor:pointer" onclick="${open}">${v}</a>`;
      return `<td>${v}</td>`;
    }).join('');
    tds+=`<td><div class="rowacts" style="justify-content:flex-end"><button class="btn sm" onclick="${open}">Open</button><button class="btn sm" onclick="App.edit('${coll}','${scope}','${esc(String(id))}')">Edit</button><button class="btn sm danger" onclick="App.remove('${coll}','${scope}','${esc(String(id))}')">Del</button></div></td>`;
    return `<tr data-id="${esc(String(id))}" data-search="${esc(JSON.stringify(rec).toLowerCase())}">${tds}</tr>`;
  },
  cell(f,rec){
    const v=getPath(rec,f.k);
    if(f.type===FT.REF) return App.refChip(f.ref,f.refScope,v);
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.length?(a.slice(0,4).map(id=>App.refChip(f.ref,f.refScope,id)).join(' ')+(a.length>4?` <span class="muted">+${a.length-4}</span>`:'')):'<span class="muted">—</span>'; }
    if(f.k==='cls') return App.refChip('classifications','global',v);
    if(f.k==='lpi') return Views.meter(v);
    if(f.type===FT.LIST) return `<span class="muted">${(v||[]).length} item(s)</span>`;
    if(f.type===FT.BOOL) return v?'✓':'—';
    if(f.type===FT.HTML) return `<span class="clip">${esc(String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}</span>`;
    if(f.type===FT.AREA) return `<span class="clip">${esc(v)}</span>`;
    return esc(v==null?'':v);
  },
  meter(n){ n=+n||0; const cls=n>=4?'hi':(n<=1?'lo':''); let d=''; for(let i=0;i<5;i++)d+=`<i class="${i<n?'on '+cls:''}"></i>`; return `<span class="meter" title="LPI/LPD ${n}/5">${d}</span> <span class="mono muted" style="font-size:0.7rem">${n}/5</span>`; },
  filterTable(coll,q){ q=q.toLowerCase(); let n=0; document.querySelectorAll('#tbl_'+coll+' tbody tr').forEach(tr=>{ const m=!q||(tr.dataset.search||'').includes(q); tr.style.display=m?'':'none'; if(m)n++; }); const c=$('#ct_'+coll); if(c)c.textContent=n+' shown'; },
  facId(coll,k){ return 'fac_'+coll+'_'+k.replace(/\W/g,'_'); },
  facetOptions(f,list){
    if(f.k==='lpi') return [1,2,3,4,5].map(n=>({v:String(n),l:'≥ '+n+'/5'}));
    if(f.type===FT.REF||f.type===FT.MULTIREF||f.k==='cls') return Modal.refOptions(f);
    if(f.type===FT.SEL && Array.isArray(f.options)) return f.options.map(o=>({v:o,l:o}));
    const set=new Set(); list.forEach(r=>{ const v=getPath(r,f.k); if(Array.isArray(v))v.forEach(x=>set.add(x)); else if(v!=null&&v!=='')set.add(v); });
    return [...set].sort().map(v=>({v:String(v),l:String(v)}));
  },
  facetBar(sc,coll,list){
    if(!sc.facets||!sc.facets.length) return '';
    const cells=sc.facets.map(k=>{ const f=sc.fields.find(x=>x.k===k); if(!f)return ''; const opts=Views.facetOptions(f,list);
      const lbl=(f.label||k).replace(/^TC\d+\s*·\s*/,'').replace(/\s*\(.*$/,'');
      return `<select class="filtsel" id="${Views.facId(coll,k)}" onchange="Views.filterRows('${coll}')" title="${esc(f.label)}"><option value="">${esc(lbl)}: all</option>`+
        opts.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')+`</select>`;
    }).join('');
    return `<div class="toolbar" style="margin-top:-4px;gap:6px">${cells}<button class="btn sm" onclick="Views.clearFacets('${coll}')">Clear filters</button></div>`;
  },
  filterRows(coll){
    const sc=SCHEMAS[coll]; const scope=UI.route.scope;
    const list=(scope==='global'?DB.global[coll]:App.coll(coll))||[];
    const q=((document.getElementById('srch_'+coll)||{}).value||'').toLowerCase();
    const facets=(sc.facets||[]).map(k=>{ const el=document.getElementById(Views.facId(coll,k)); return {k,v:el?el.value:''}; }).filter(f=>f.v);
    let n=0;
    list.forEach(rec=>{
      const tr=document.querySelector('#tbl_'+coll+' tr[data-id="'+(window.CSS&&CSS.escape?CSS.escape(String(rec[sc.id])):String(rec[sc.id]))+'"]');
      if(!tr) return;
      let ok = !q || (tr.dataset.search||'').includes(q);
      for(const f of facets){ if(!ok)break; const val=getPath(rec,f.k);
        if(Array.isArray(val)) ok=val.map(String).includes(f.v);
        else if(f.k==='lpi') ok=(+val||0)>=(+f.v);
        else ok=String(val==null?'':val)===f.v;
      }
      tr.style.display=ok?'':'none'; if(ok)n++;
    });
    const c=$('#ct_'+coll); if(c)c.textContent=n+(facets.length||q?' shown':' record'+(n===1?'':'s'));
  },
  clearFacets(coll){ const sc=SCHEMAS[coll]; (sc.facets||[]).forEach(k=>{ const el=document.getElementById(Views.facId(coll,k)); if(el)el.value=''; }); const sr=document.getElementById('srch_'+coll); if(sr)sr.value=''; Views.filterRows(coll); },

  /* ---------- generic DETAIL ---------- */
  detail(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?DB.global[coll]:App.coll(coll);
    const rec=list.find(x=>String(x[sc.id])===String(id));
    if(!rec){ $('#main').innerHTML=Views.pageH('','Not found','That record no longer exists.',''); return; }
    const back=`App.go({view:'collection',scope:'${scope}',collection:'${coll}'})`;
    const isUC = coll==='useCases';
    const copyCall = isUC
      ? `App.copyTablesMulti([{id:'tbl_rec',title:'Technical Caveats for Operational Communications'},{id:'tbl_rec_mcr',title:'Minimum Capability Requirements (MCR)'}],'${esc(String(id))}')`
      : `App.copyTable('tbl_rec','${esc(String(id))}')`;
    const wordCall = isUC
      ? `App.exportTablesWordMulti([{id:'tbl_rec',title:'Technical Caveats for Operational Communications'},{id:'tbl_rec_mcr',title:'Minimum Capability Requirements (MCR)'}],'${esc(String(id))}')`
      : `App.exportTableWord('tbl_rec','${esc(String(id))}')`;
    const acts=`<button class="btn gold" onclick="${copyCall}">⧉ Copy (Word)</button>`+
      ` <button class="btn" onclick="${wordCall}">⤓ Word</button>`+
      ` <button class="btn" onclick="App.copyRecord('${coll}','${scope}','${esc(String(id))}')">⎘ Duplicate</button>`+
      ` <button class="btn primary" onclick="App.edit('${coll}','${scope}','${esc(String(id))}')">✎ Edit</button>`+
      ` <button class="btn danger" onclick="App.remove('${coll}','${scope}','${esc(String(id))}')">Delete</button>`;
    let h=`<div class="crumbs"><a onclick="${back}">${esc(sc.plural)}</a> › ${esc(String(id))}</div>`;
    h+=Views.pageH(sc.label, (rec[sc.title]!=null?rec[sc.title]:rec[sc.id]), '', acts);
    // For a Use Case, the screen shows EXACTLY the two exported tables (no extra
    // field cards) — what you see is what Copy (Word) / Word capture, nothing more.
    if(coll==='useCases'){
      h+=`<div class="panel"><h3>Technical Caveats for Operational Communications</h3><div class="tbl-wrap">${Views.recordTable(coll,scope,rec)}</div></div>`;
      h+=`<div class="panel"><h3>Minimum Capability Requirements (MCR)</h3><div class="tbl-wrap">${Views.ucMcrTable()}</div></div>`;
    } else {
      // grouped fields (readable cards)
      h+=`<div class="dgrid">`;
      let curSec=null;
      sc.fields.forEach(f=>{
        if(f.sec&&f.sec!==curSec){ curSec=f.sec; h+=`<div class="grouphd">${esc(curSec)}</div>`; }
        h+=`<div class="field ${f.wide?'':''}" ${f.wide?'style="grid-column:1/-1"':''}><div class="fk">${esc(f.label)}</div><div class="fv">${Views.detailVal(f,rec)}</div></div>`;
      });
      h+=`</div>`;
      h+=`<div class="panel"><h3>Record table · copy / export source</h3><div class="tbl-wrap">${Views.recordTable(coll,scope,rec)}</div></div>`;
    }
    // cross-references INTO this record (omitted for Use Cases — the screen shows
    // only the two exported tables, matching Copy (Word) / Word exactly)
    if(coll!=='useCases') h+=Views.backrefs(coll,scope,rec);
    $('#main').innerHTML=h;
  },
  /* plain-text rendering of one field's value (for the per-record export table) */
  recordCellText(f,rec){
    const v=getPath(rec,f.k);
    if(f.k==='cls'){ return v?String(v)+(App.refTitle('classifications','global',v)!==v?' — '+App.refTitle('classifications','global',v):''):''; }
    if(f.type===FT.REF){ return v?String(v)+(App.refTitle(f.ref,f.refScope,v)!==v?' — '+App.refTitle(f.ref,f.refScope,v):''):''; }
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.map(id=>String(id)+' '+App.refTitle(f.ref,f.refScope,id)).join('; '); }
    if(f.k==='lpi'){ const n=+v||0; const nar=(DB.global.riskNarr||[]).find(x=>+x.level===n); return n+'/5'+(nar?' ('+nar.label+')':''); }
    if(f.type===FT.LIST){ return (v||[]).join('; '); }
    if(f.type===FT.BOOL) return v?'yes':'no';
    if(f.type===FT.HTML) return String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    return v==null?'':String(v);
  },
  /* a 3-column Group · Field · Value table for one record, fields in schema (TC) order */
  recordTable(coll,scope,rec){
    if(coll==='useCases') return Views.ucExportTable(rec);   // curated TC01–TC11 table (Update_20260622.txt)
    const sc=SCHEMAS[coll]; let curSec=''; let rows='';
    sc.fields.forEach(f=>{ if(f.sec)curSec=f.sec; const txt=Views.recordCellText(f,rec);
      rows+=`<tr><td class="mono muted" style="white-space:nowrap;font-size:0.72rem">${esc(curSec)}</td><td class="mono" style="font-weight:600;white-space:nowrap">${esc(f.label)}</td><td>${esc(txt)||'<span class="muted">—</span>'}</td></tr>`; });
    return `<table id="tbl_rec"><thead><tr><th>Group</th><th>Field</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>`;
  },
  /* Use-Case Copy (Word) / Word source: a clean 2-column Constraint · Value table with
     exactly the rows of Update_20260622.txt — Use Case · Description · TC01…TC11.
     TC01 (frequencies + transmission services) and TC04 (zones + CoIs) are each unified
     into a single row; TC06 IER shows the Capability Elements from the linked MC 0195/13
     REQ table; serial / echelon / C2D2E / the six IER sub-dimensions / governance rows
     are omitted. */
  ucExportTable(rec){
    const sc=SCHEMAS.useCases, F=k=>sc.fields.find(f=>f.k===k)||{k};
    const cell=k=>Views.recordCellText(F(k),rec);
    const join=(...p)=>p.map(x=>x==null?'':String(x).trim()).filter(Boolean).join(' · ');
    const nl=(...p)=>p.map(x=>x==null?'':String(x).trim()).filter(Boolean).join('\n');   // one item per line
    // TC01 — Source/Sink (origin–destination) · transmission services (nearest CO) · Footprint
    const tc01=nl(rec.sourceSink && ('Source/Sink: '+rec.sourceSink), cell('commsSvc') && ('Transmission services: '+cell('commsSvc')), rec.footprint && ('Footprint: '+rec.footprint));
    // TC02 — full description from the editable temporalWindows catalog (longest-name match)
    const tws=(DB.global.temporalWindows||[]).slice().sort((a,b)=>(b.name||'').length-(a.name||'').length);
    const tw=tws.find(t=>t.name && String(rec.timeWindow||'').toLowerCase().startsWith(String(t.name).toLowerCase()));
    const tc02=tw?(tw.name+': '+tw.description):(rec.timeWindow||'');
    // TC03 — full track-identity line from the editable trackIdentity catalog
    const ti=(DB.global.trackIdentity||[]).find(t=>t.code===rec.env);
    const tc03=ti?(String(ti.name).toUpperCase()+': '+ti.definition):cell('env');
    // TC04 — zones · CoIs (one per line)
    const tc04=nl(rec.zones, cell('coi') && ('CoIs: '+cell('coi')));
    // TC06 — Required CapElems only (R.*), with capability name from the domain capElem catalog
    const dom=(String(rec.id||'').match(/^UC-([MLA])-/)||[])[1];
    // PSC tables — exclude submarine-specific REQ rows from the Required CapElems
    const linkedReqs=((((DB.domains||{})[dom]||{}).collections||{}).reqs||[]).filter(r=>r.uc===rec.id && !/submarine/i.test(r.exchange||''));
    const capElems=(((DB.domains||{})[dom]||{}).collections||{}).capElem||[];
    const rCodes=[...new Set(linkedReqs.flatMap(r=>((r.reqCap||'').match(/\[R\.[^\]]+\]/g))||[]))];
    const tc06=rCodes.map(code=>{ const ce=capElems.find(c=>('['+c.id+']')===code); return code+(ce&&ce.cap?(' '+ce.cap):''); }).join('\n');
    // TC07 — full availability line from the editable availability catalog (matched by level)
    const lv=(String(rec.avail||'').match(/(\d)/)||[])[1];
    const av=(DB.global.availability||[]).find(a=>a.code==='L'+lv);
    const tc07=av?(av.name+': '+av.avail+' availability, '+av.unplanned+' Monthly unplanned downtime, '+av.planned+' Monthly planned downtime, '+av.degraded+' degraded service, '+av.restore+' Max Restore Time, '+av.recovery+' Recovery Time, '+av.recPoint+' Recovery Point.'):(rec.avail||'');
    // TC08 — classification code: name (editable classifications catalog)
    const cl=(DB.global.classifications||[]).find(c=>c.code===rec.cls);
    const tc08=cl?(cl.code+': '+cl.name):(rec.cls||'');
    // TC10 — environmental (climatic) conditions, one category per line
    const tc10=(rec.climate||[]).map(code=>{ const c=(DB.global.climatic||[]).find(x=>x.code===code); return code+(c&&c.name?(' '+c.name):''); }).join('\n');
    // TC11 — EPM / Non-EPM · Information Assurance Yes/No (editable UC fields)
    const tc11='EPM: '+(rec.epm||'Non-EPM')+'\nInformation Assurance: '+(rec.ia||'Yes');
    const rows=[
      ['Use Case', [rec.id,rec.title].filter(Boolean).join(' ')],
      ['Description', rec.sub||''],
      ['TC01 Frequencies', tc01],
      ['TC02 Temporal Window', tc02],
      ['TC03 Environment', tc03],
      ['TC04 Zones and CoIs', tc04],
      ['TC05 Collaboration (NNN / IO)', rec.tc05||''],
      ['TC06 IER (Required CapElems)', tc06],
      ['TC07 Availability', tc07],
      ['TC08 Classification', tc08],
      ['TC09 Risk (LPI/LPD)', cell('lpi')],
      ['TC10 Environmental Conditions', tc10],
      ['TC11 Attack Surface', tc11],
    ];
    const body=rows.map(([k,v])=>`<tr><td class="mono" style="font-weight:600;white-space:nowrap">${esc(k)}</td><td style="white-space:pre-line">${esc(v)||'<span class="muted">—</span>'}</td></tr>`).join('');
    return `<table id="tbl_rec"><thead><tr><th>Technical Caveat</th><th>Description</th></tr></thead><tbody>${body}</tbody></table>`;
  },
  /* Second Use-Case export table: Minimum Capability Requirements (MCR) — the
     minimum-performance KPI definitions (same for every UC); header MCR · Description.
     Captured together with the TC table by the Copy (Word) / Word buttons. */
  ucMcrTable(){
    const rows=(DB.global.mcr||[]).map(m=>[ ((m.key==='MINPERF'||m.key==='ENERGY')?m.name:(m.key+' ('+m.name+')')), m.value||'' ]);
    const body=rows.map(([k,v])=>`<tr><td class="mono" style="font-weight:600;white-space:nowrap">${esc(k)}</td><td>${esc(v)||'<span class="muted">—</span>'}</td></tr>`).join('');
    return `<table id="tbl_rec_mcr"><thead><tr><th>MCR</th><th>Value</th></tr></thead><tbody>${body}</tbody></table>`;
  },
  detailVal(f,rec){
    const v=getPath(rec,f.k);
    if(f.k==='cls') return App.refChip('classifications','global',v)+' '+esc(App.refTitle('classifications','global',v));
    if(f.type===FT.REF){ return App.refChip(f.ref,f.refScope,v)+' '+(v?esc(App.refTitle(f.ref,f.refScope,v)):''); }
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.length?`<div style="display:flex;flex-wrap:wrap;gap:5px">${a.map(id=>App.refChip(f.ref,f.refScope,id)+' <span class="muted" style="font-size:0.78rem">'+esc(App.refTitle(f.ref,f.refScope,id))+'</span>').join('<br>')}</div>`:'<span class="muted">—</span>'; }
    if(f.k==='lpi'){ const nar=(DB.global.riskNarr||[]).find(x=>+x.level===(+v||0)); return Views.meter(v)+(nar?`<div class="muted" style="font-size:0.78rem;margin-top:4px">${esc(nar.label)} — ${esc(nar.text)}</div>`:''); }
    if(f.type===FT.LIST){ const a=v||[]; return a.length?`<ul>${a.map(x=>`<li>${App.linkRefs(esc(x))}</li>`).join('')}</ul>`:'<span class="muted">—</span>'; }
    if(f.type===FT.BOOL) return v?'✓ yes':'— no';
    if(f.type===FT.HTML) return v?`<div class="rich">${App.linkRefs(String(v))}</div>`:'<span class="muted">—</span>';
    return v==null||v===''?'<span class="muted">—</span>':App.linkRefs(esc(v));
  },
  backrefs(coll,scope,rec){
    // find collections whose ref fields point at this record → show as related
    const sc=SCHEMAS[coll]; const id=rec[sc.id]; let blocks='';
    Object.entries(SCHEMAS).forEach(([name,s])=>{
      s.fields.forEach(f=>{
        if(f.type===FT.REF&&f.ref===coll&&((f.refScope==='global'&&scope==='global')||(f.refScope==='domain'&&scope==='domain'))){
          const list=s.scope==='global'?(DB.global[name]||[]):App.coll(name);
          const hits=list.filter(x=>String(getPath(x,f.k))===String(id));
          if(hits.length){ blocks+=`<div class="panel"><h3>Referenced by · ${esc(s.plural)}</h3><div style="display:flex;flex-wrap:wrap;gap:6px">`+
            hits.map(x=>App.refChip(name,s.scope==='global'?'global':'domain',x[s.id])).join('')+`</div></div>`; }
        }
      });
    });
    return blocks;
  },

  /* ---------- GRC DASHBOARD ---------- */
  dashboard(){
    const doms=Object.values(DB.domains);
    let totUC=0,totSer=0; const clsCount={}, riskBuckets=[0,0,0,0,0,0];
    doms.forEach(d=>{ const ucs=(d.collections&&d.collections.useCases)||[]; totUC+=ucs.length; ucs.forEach(u=>{ if(u.serial)totSer++; clsCount[u.cls]=(clsCount[u.cls]||0)+1; riskBuckets[Math.max(0,Math.min(5,+u.lpi||0))]++; }); });
    const highRisk=doms.reduce((a,d)=>a+(((d.collections&&d.collections.useCases)||[]).filter(u=>(+u.lpi||0)>=4).length),0);
    let h=Views.pageH('Governance · Risk · Compliance','MDO Secure-CIS GRC Dashboard',`Multi-domain posture across ${doms.length} domains · NAF v4.1 · AJP-6 IER · C3 Taxonomy B7.0`,'');
    h+=`<div class="cards">
      <div class="card gold"><div class="k">Domains</div><div class="v">${doms.length}</div><div class="d">${esc(doms.map(d=>d.code).join(' · '))}</div></div>
      <div class="card"><div class="k">Use Cases (IER)</div><div class="v">${totUC}</div><div class="d">${totSer} mapped to an Annex-C serial</div></div>
      <div class="card ${highRisk?'bad':'ok'}"><div class="k">High LPI/LPD risk</div><div class="v">${highRisk}</div><div class="d">UCs at risk ≥ 4/5</div></div>
      <div class="card"><div class="k">Global catalogs</div><div class="v">${GLOBAL_COLLECTIONS.reduce((a,c)=>a+(DB.global[c]||[]).length,0)}</div><div class="d">editable reference entities</div></div>
    </div>`;
    // governance: per-domain breakdown
    h+=`<div class="panel"><h3>Governance — coverage by domain</h3><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Domain</th><th>Directive</th><th>Use Cases</th><th>CapElem</th><th>Vendors</th><th>Echelons</th><th>Avg risk</th><th></th></tr></thead><tbody>`;
    doms.forEach(d=>{ const c=d.collections||{}; const ucs=c.useCases||[]; const avg=ucs.length?(ucs.reduce((a,u)=>a+(+u.lpi||0),0)/ucs.length):0;
      h+=`<tr><td><span class="chip link" onclick="App.switchDomain('${d.code}')">${esc(d.code)}</span></td><td>${esc(d.name)}</td><td class="muted mono" style="font-size:0.72rem">${esc(d.mc)}</td><td><b>${ucs.length}</b></td><td>${(c.capElem||[]).length}</td><td>${(c.vendors||[]).length}</td><td>${(c.echelons||[]).length}</td><td>${Views.meter(Math.round(avg))}</td><td><button class="btn sm" onclick="App.switchDomain('${d.code}')">Open ▸</button></td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
    // risk distribution
    const maxR=Math.max(1,...riskBuckets);
    h+=`<div class="panel"><h3>Risk — LPI/LPD distribution (all domains)</h3>`;
    h+=riskBuckets.map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span class="mono muted" style="width:34px;font-size:0.72rem">${i}/5</span><div class="bar" style="flex:1"><span style="width:${(n/maxR*100).toFixed(1)}%;background:${i>=4?'var(--bad)':i<=1?'var(--ok)':'var(--warn)'}"></span></div><span class="mono" style="width:34px;text-align:right">${n}</span></div>`).join('');
    h+=`</div>`;

  /* ---------- C3 TAXONOMY B7 — hierarchical accordion (native <details>) ---------- */
  taxonomyTree(){
    const tax=DB.global.c3Taxonomy||[];
    const tops=tax.filter(t=>!t.parent);
    const kidsOf=code=>tax.filter(t=>t.parent===code);
    const coFor=code=>(DB.global.commsServices||[]).filter(s=>s.taxonomy===code);
    const ciFor=code=>(DB.global.c3Services||[]).filter(s=>s.taxonomy===code);
    const capCount=code=>{ let n=0; Object.values(DB.domains).forEach(d=>((d.collections&&d.collections.capElem)||[]).forEach(e=>{ if(e.c3node===code)n++; })); return n; };
    const node=t=>{
      const kids=kidsOf(t.code), co=coFor(t.code), ci=ciFor(t.code), caps=capCount(t.code), leaves=t.branches||[];
      let inner='';
      kids.forEach(k=> inner+=node(k));
      if(leaves.length) inner+=`<ul class="tax-leaves">`+leaves.map(b=>`<li>${esc(b)}</li>`).join('')+`</ul>`;
      if(co.length||ci.length) inner+=`<div class="tax-svcs">`+co.map(s=>App.refChip('commsServices','global',s.code)).join(' ')+' '+ci.map(s=>App.refChip('c3Services','global',s.code)).join(' ')+`</div>`;
      const meta=[t.artefacts?t.artefacts+' artefacts':'', caps?caps+' CapElem':'', (co.length+ci.length)?(co.length+ci.length)+' services':''].filter(Boolean).join(' · ');
      return `<details class="tax-node"><summary><span class="chip link" onclick="event.stopPropagation();App.go({view:'collection',scope:'global',collection:'c3Taxonomy',recordId:'${esc(t.code)}'})">${esc(t.code)}</span> <b>${esc(t.name)}</b>${meta?` <span class="muted">· ${esc(meta)}</span>`:''}</summary><div class="tax-body">${inner||'<span class="muted">—</span>'}</div></details>`;
    };
    const acts=`<button class="btn" onclick="App.go({view:'collection',scope:'global',collection:'c3Taxonomy'})">≣ Table</button> <button class="btn sm" onclick="document.querySelectorAll('.tax-node').forEach(d=>d.open=true)">⊞ Expand all</button> <button class="btn sm" onclick="document.querySelectorAll('.tax-node').forEach(d=>d.open=false)">⊟ Collapse all</button>`;
    let h=Views.pageH('Global · C3 Taxonomy','C3 Taxonomy Baseline 7 — hierarchy','Expandable / collapsible tree: branches → sub-branches → mapped CO-/CI- services and CapElem counts. 1689 artefacts.',acts);
    h+=`<div class="tax-tree"><details class="tax-node" open><summary><b>C3 Taxonomy Baseline 7</b> <span class="muted">· AC/322-WP(2025)0097-REV2-AS1 · 1689 artefacts</span></summary><div class="tax-body">`+tops.map(node).join('')+`</div></details></div>`;
    h+=`<div class="note">Native expand/collapse — click any node. Codes link to the editable record; CO-/CI- chips link to the mapped service. CapElem counts aggregate across all domains.</div>`;
    $('#main').innerHTML=h;
  },

  /* ---------- QA / COMPLETENESS ---------- */
  qa(){
    const issues={dangling:[],missingTC:[],unreviewed:[]};
    const checkRefs=(coll,scope,rec,domCode)=>{ const sc=SCHEMAS[coll]; sc.fields.forEach(f=>{ const isRef=f.type===FT.REF||f.k==='cls'; const isMulti=f.type===FT.MULTIREF; if(!isRef&&!isMulti)return;
      const refName=f.k==='cls'?'classifications':f.ref; const refScope=f.k==='cls'?'global':f.refScope; const rsc=SCHEMAS[refName]; if(!rsc)return;
      const list=refScope==='global'?(DB.global[refName]||[]):(((DB.domains[domCode]||{}).collections||{})[refName]||[]); const ids=new Set(list.map(x=>String(x[rsc.id])));
      const vals=isMulti?(getPath(rec,f.k)||[]):[getPath(rec,f.k)];
      vals.forEach(v=>{ if(v!=null&&v!==''&&!ids.has(String(v))) issues.dangling.push({where:(scope==='global'?'global':domCode)+' / '+coll+' / '+rec[sc.id],field:f.k,value:v}); }); }); };
    GLOBAL_COLLECTIONS.forEach(c=>(DB.global[c]||[]).forEach(r=>checkRefs(c,'global',r)));
    Object.values(DB.domains).forEach(d=>DOMAIN_COLLECTIONS.forEach(c=>((d.collections&&d.collections[c])||[]).forEach(r=>checkRefs(c,'domain',r,d.code))));
    Object.values(DB.domains).forEach(d=>((d.collections&&d.collections.useCases)||[]).forEach(u=>{
      const miss=[]; if(!(u.equipment&&u.equipment.length))miss.push('TC01'); if(!(u.ier&&u.ier.who))miss.push('TC06·Who'); if(!u.cls)miss.push('TC08'); if(u.lpi==null||u.lpi==='')miss.push('TC09');
      if(miss.length)issues.missingTC.push({uc:u.id,dom:d.code,miss});
      if(!((u.gov||{}).reviewStatus)||u.gov.reviewStatus==='DRAFT')issues.unreviewed.push({uc:u.id,dom:d.code}); }));
    let h=Views.pageH('Quality assurance','QA / completeness','Pre-staffing checks — dangling references, missing Technical Constraints, and unreviewed Use Cases.','');
    h+=`<div class="cards"><div class="card ${issues.dangling.length?'bad':'ok'}"><div class="k">Dangling references</div><div class="v">${issues.dangling.length}</div><div class="d">ref fields pointing nowhere</div></div>`+
      `<div class="card ${issues.missingTC.length?'warn':'ok'}"><div class="k">UCs missing key TCs</div><div class="v">${issues.missingTC.length}</div><div class="d">TC01 / TC06 / TC08 / TC09</div></div>`+
      `<div class="card ${issues.unreviewed.length?'warn':'ok'}"><div class="k">Unreviewed UCs</div><div class="v">${issues.unreviewed.length}</div><div class="d">review = DRAFT / unset</div></div></div>`;
    h+=`<div class="panel"><h3>Dangling references</h3>`+(issues.dangling.length?`<div class="tbl-wrap"><table><thead><tr><th>Location</th><th>Field</th><th>Missing value</th></tr></thead><tbody>`+issues.dangling.map(x=>`<tr><td class="mono" style="font-size:0.74rem">${esc(x.where)}</td><td class="mono muted">${esc(x.field)}</td><td class="mono" style="color:var(--bad)">${esc(x.value)}</td></tr>`).join('')+`</tbody></table></div>`:`<div class="muted">None — every reference resolves.</div>`)+`</div>`;
    h+=`<div class="panel"><h3>Use Cases missing key Technical Constraints</h3>`+(issues.missingTC.length?`<div class="tbl-wrap"><table><thead><tr><th>UC</th><th>Domain</th><th>Missing</th></tr></thead><tbody>`+issues.missingTC.map(x=>`<tr><td class="mono"><a style="cursor:pointer" onclick="App.openUC('${x.dom}','${esc(x.uc)}')">${esc(x.uc)}</a></td><td>${esc(x.dom)}</td><td class="muted">${esc(x.miss.join(', '))}</td></tr>`).join('')+`</tbody></table></div>`:`<div class="muted">None — all Use Cases carry the key TCs.</div>`)+`</div>`;
    h+=`<div class="panel"><h3>Unreviewed Use Cases (${issues.unreviewed.length})</h3><div style="display:flex;flex-wrap:wrap;gap:5px">`+(issues.unreviewed.length?issues.unreviewed.map(x=>`<span class="chip link" onclick="App.openUC('${x.dom}','${esc(x.uc)}')">${esc(x.uc)}</span>`).join(''):'<span class="muted">All reviewed.</span>')+`</div></div>`;
    $('#main').innerHTML=h;
  },

/* ---- global search across every collection (use cases, catalogs, references…) ---- */
App.searchAll=function(q){
  q=String(q||'').trim().toLowerCase(); if(q.length<2) return [];
  const out=[];
  const scan=(scope,domCode,coll,list)=>{ const sc=SCHEMAS[coll]; if(!sc)return;
    (list||[]).forEach(rec=>{ let hay=''; try{ hay=JSON.stringify(rec).toLowerCase(); }catch(e){} if(hay.indexOf(q)<0)return;
      const id=rec[sc.id]; const t=(rec[sc.title]!=null&&rec[sc.title]!=='')?rec[sc.title]:id;
      out.push({scope,domCode,coll,id:String(id),title:String(t)}); }); };
  GLOBAL_COLLECTIONS.forEach(c=>scan('global',null,c,DB.global[c]));
  Object.values(DB.domains).forEach(d=>DOMAIN_COLLECTIONS.forEach(c=>scan('domain',d.code,c,(d.collections&&d.collections[c]))));
  return out;
};

/* extract a rendered table's data: visible (filtered) rows only, dropping the
   trailing "Actions" column. Shared by clipboard-copy and Word-file export. */
App._tableData=function(tableId){
  const tbl=document.getElementById(tableId); if(!tbl) return null;
  const ths=Array.from(tbl.querySelectorAll('thead th'));
  const drop=new Set(ths.map((th,i)=>/^(actions|)$/i.test(th.innerText.trim())?i:-1).filter(i=>i>=0));
  const keep=i=>!drop.has(i);
  const heads=ths.filter((_,i)=>keep(i)).map(th=>th.innerText.trim());
  const rows=[];
  tbl.querySelectorAll('tbody tr').forEach(tr=>{ if(tr.style.display==='none')return;
    // collapse spaces/tabs but PRESERVE line breaks inside a cell (white-space:pre-line)
    rows.push(Array.from(tr.children).filter((_,i)=>keep(i)).map(td=>td.innerText.replace(/[^\S\n]+/g,' ').replace(/[ \t]*\n[ \t]*/g,'\n').replace(/\n{2,}/g,'\n').trim())); });
  return {heads,rows};
};
const CELLCSS='border:1px solid #888;padding:4px 8px;vertical-align:top;font-family:Calibri,Arial,sans-serif;font-size:9pt';
function wordTable(d){
  const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let h=`<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%"><thead><tr>`+
    d.heads.map(x=>`<th style="${CELLCSS};background:#003F87;color:#fff;text-align:left">${e(x)}</th>`).join('')+`</tr></thead><tbody>`;
  d.rows.forEach(r=>{ h+='<tr>'+r.map(c=>`<td style="${CELLCSS}">${e(c).replace(/\n/g,'<br>')}</td>`).join('')+'</tr>'; });
  return h+'</tbody></table>';
}

    const data=[new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})];
    navigator.clipboard.write(data).then(()=>toast((label||'Table')+' copied ('+d.rows.length+' rows) — paste into Word','ok'),()=>App._copyFallback(html,plain,label));

/* ---- JSON-LD (Linked Data) — single serializer driven by SCHEMAS (DRY).
   Ref / multiref fields become @id links, so the whole dataset is one graph.
   Regenerated from the live DB on load and after every edit. ---- */
App._ldId=function(coll,scope,domCode,idv){ return 'urn:mdo:'+(scope==='global'?'global':(domCode||'_'))+':'+coll+':'+encodeURIComponent(String(idv)); };
App._ldNode=function(coll,scope,domCode,rec){
  const sc=SCHEMAS[coll];
  const node={ '@id':App._ldId(coll,scope,domCode,rec[sc.id]), '@type':String(sc.label||coll).replace(/[^A-Za-z0-9]+/g,'') };
  sc.fields.forEach(f=>{
    const v=getPath(rec,f.k); if(v==null||v===''||(Array.isArray(v)&&!v.length)) return;
    if(f.k==='cls') node[f.k]={ '@id':App._ldId('classifications','global',domCode,v) };
    else if(f.type===FT.REF) node[f.k]={ '@id':App._ldId(f.ref,f.refScope,domCode,v) };
    else if(f.type===FT.MULTIREF) node[f.k]=(v||[]).map(id=>({ '@id':App._ldId(f.ref,f.refScope,domCode,id) }));
    else node[f.k]=v;
  });
  return node;
};
App.toJsonLd=function(){
  const graph=[];
  GLOBAL_COLLECTIONS.forEach(coll=>(DB.global[coll]||[]).forEach(r=>graph.push(App._ldNode(coll,'global',null,r))));
  Object.values(DB.domains).forEach(d=>{
    const did=App._ldId('domains','global',null,d.code);
    graph.push({ '@id':did, '@type':'Domain', code:d.code, name:d.name, mc:d.mc, reqPrefix:d.reqPrefix||'' });
    DOMAIN_COLLECTIONS.forEach(coll=>((d.collections&&d.collections[coll])||[]).forEach(r=>graph.push(Object.assign({ inDomain:{ '@id':did } }, App._ldNode(coll,'domain',d.code,r)))));
  });
  return { '@context':{ '@vocab':'https://mdo.nato.int/grc#', xsd:'http://www.w3.org/2001/XMLSchema#', inDomain:{ '@type':'@id' } },
           '@type':'Dataset', schema:DB.schema, generatedAt:(DB.generatedAt||new Date().toISOString()), '@graph':graph };
};
App.syncJsonLd=function(){ const el=document.getElementById('seed-jsonld'); if(el) el.textContent=JSON.stringify(App.toJsonLd()); };

/* ---- navigation history (browser-style back / forward) ----
   Every render() snapshots {domain, route}. Navigating to a new state truncates
   any forward entries (standard back/forward semantics); back()/forward() replay
   a snapshot without recording it. ---- */
App._hist=[]; App._hi=-1; App._navLock=false;
App.recordHist=function(){
  if(this._navLock) return;
  const snap={ domain:UI.domain, route:deepClone(UI.route||{}) };
  const cur=this._hist[this._hi];
  if(cur && cur.domain===snap.domain && JSON.stringify(cur.route)===JSON.stringify(snap.route)){ this._paintNavBtns(); return; }
  this._hist=this._hist.slice(0,this._hi+1);
  this._hist.push(snap); this._hi=this._hist.length-1;
  if(this._hist.length>200){ this._hist.shift(); this._hi--; }   // cap memory
  this._paintNavBtns();
};
App._restoreHist=function(){
  const s=this._hist[this._hi]; if(!s) return;
  this._navLock=true; UI.domain=s.domain; UI.route=deepClone(s.route); this.render(); this._navLock=false;
  this._paintNavBtns();
};
App.back=function(){ if(this._hi<=0) return; this._hi--; this._restoreHist(); };
App.forward=function(){ if(this._hi>=this._hist.length-1) return; this._hi++; this._restoreHist(); };
App._paintNavBtns=function(){ const b=document.getElementById('navBack'), f=document.getElementById('navFwd');
  if(b) b.disabled=this._hi<=0; if(f) f.disabled=this._hi>=this._hist.length-1; };
App.exportJsonLd=function(){
  const blob=new Blob([JSON.stringify(App.toJsonLd(),null,2)],{type:'application/ld+json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='MDO_GRC_Platform_'+new Date().toISOString().slice(0,10)+'.jsonld';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Exported JSON-LD graph','ok');
};

};
/* navigate to the grouped Acronyms table and highlight the term */
App.openAcronym=function(code){ this.go({view:'acronyms'}); const id='acr-'+String(code).replace(/[^A-Za-z0-9]/g,'_');
  setTimeout(()=>{ const el=document.getElementById(id); if(el){ el.scrollIntoView({block:'center'}); el.style.transition='background .3s'; el.style.background='rgba(203,161,53,0.28)'; setTimeout(()=>{el.style.background='';},1600); } },60); };
/* auto-decorate cited acronyms in the rendered report: hover = meaning + source; click = Acronyms table */
App.decorateAcronyms=function(){
  const root=document.getElementById('main'); const acr=(DB.global.acronyms)||[]; if(!root||!acr.length) return;
  const map={}; acr.forEach(a=>{ if(a.code) map[a.code]=a; });
  const codes=Object.keys(map).sort((a,b)=>b.length-a.length).map(c=>c.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
  let re; try{ re=new RegExp('(?<![\\w-])('+codes.join('|')+')(?![\\w-])','g'); }catch(e){ return; }
  const skip={A:1,ABBR:1,SCRIPT:1,STYLE:1,BUTTON:1,SUMMARY:1,INPUT:1,TEXTAREA:1,SELECT:1,OPTION:1,TH:1};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); const targets=[]; let n;
  while(n=walker.nextNode()){ let p=n.parentNode,bad=false; while(p&&p!==root){ if(skip[p.nodeName]||(p.classList&&p.classList.contains('acr'))){bad=true;break;} p=p.parentNode; }
    if(!bad&&n.nodeValue){ re.lastIndex=0; if(re.test(n.nodeValue)) targets.push(n); } }
  targets.forEach(tn=>{ const s=tn.nodeValue; re.lastIndex=0; let m,last=0; const frag=document.createDocumentFragment();
    while((m=re.exec(s))){ const code=m[1], a=map[code]; if(!a) continue;
      if(m.index>last) frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      const el=document.createElement('abbr'); el.className='acr'; el.textContent=code;
      el.title=a.expansion+(a.source&&a.source!=='—'?' — '+a.source:'')+(a.group?' · '+a.group:'');
      el.onclick=function(e){ e.stopPropagation(); App.openAcronym(code); };
      frag.appendChild(el); last=m.index+code.length; }
    if(last>0){ if(last<s.length) frag.appendChild(document.createTextNode(s.slice(last))); tn.parentNode.replaceChild(frag,tn); } });
};
App._copyFallback=function(html,text,label){
  const tmp=document.createElement('div'); tmp.contentEditable='true'; tmp.style.position='fixed'; tmp.style.left='-9999px'; tmp.innerHTML=html; document.body.appendChild(tmp);
  const rng=document.createRange(); rng.selectNodeContents(tmp); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(rng);
  try{ document.execCommand('copy'); toast((label||'Table')+' copied — paste into Word','ok'); }catch(e){ toast('Copy failed — select manually','err'); }
  sel.removeAllRanges(); tmp.remove();
};

/* ============================================================================
   MODAL — generic edit form generated from schema
   ========================================================================== */
const Modal = {
  ctx:null,
  open(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]||[]):App.coll(coll);
    const orig = id!=null ? list.find(x=>String(x[sc.id])===String(id)) : null;
    const rec = orig? deepClone(orig) : Modal.blank(sc);
    Modal.ctx={coll,scope,sc,origId:orig?orig[sc.id]:null};
    let body=''; let curSec=null;
    sc.fields.forEach(f=>{
      if(f.sec&&f.sec!==curSec){ curSec=f.sec; body+=`<div class="modal-sec">${esc(curSec)}</div>`; }
      body+=Modal.fieldHtml(f,rec);
    });
    $('#modal').innerHTML=`
      <div class="modal-h"><h3>${orig?'Edit':'New'} ${esc(sc.label)}</h3><button class="btn x" onclick="Modal.close()">✕</button></div>
      <div class="modal-b">${body}</div>
      <div class="modal-f"><span class="muted" style="margin-right:auto;font-size:0.72rem">${scope==='global'?'Global catalog':DB.domains[UI.domain].name+' domain'}</span><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Modal.save()">${orig?'Save changes':'Create'}</button></div>`;
    $('#overlay').classList.add('show');
    setTimeout(()=>{ const fi=$('#modal').querySelector('input,select,textarea'); if(fi)fi.focus(); },30);
  },
  blank(sc){ const o={}; sc.fields.forEach(f=>{ if(f.type===FT.LIST)setPath(o,f.k,[]); else if(f.type===FT.BOOL)setPath(o,f.k,false); else setPath(o,f.k,''); }); return o; },
  fieldHtml(f,rec){
    const v=getPath(rec,f.k); const fid='m_'+f.k.replace(/\./g,'_');
    const wide=f.wide||f.type===FT.AREA||f.type===FT.LIST||f.type===FT.HTML||f.type===FT.MULTIREF;
    let input='';
    if(f.type===FT.HTML) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}" style="min-height:160px;font-family:var(--font-mono);font-size:0.78rem" placeholder="HTML allowed: <p>, <ul><li>, <b>, <a href>…">${esc(v)}</textarea>`;
    else if(f.type===FT.AREA) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}">${esc(v)}</textarea>`;
    else if(f.type===FT.LIST) input=`<textarea id="${fid}" data-k="${f.k}" data-t="${f.type}" placeholder="One per line">${esc((v||[]).join('\n'))}</textarea>`;
    else if(f.type===FT.NUM) input=`<input id="${fid}" data-k="${f.k}" data-t="${f.type}" type="number" value="${esc(v)}">`;
    else if(f.type===FT.BOOL) input=`<select id="${fid}" data-k="${f.k}" data-t="${f.type}"><option value="false" ${!v?'selected':''}>No</option><option value="true" ${v?'selected':''}>Yes</option></select>`;
    else if(f.type===FT.SEL){ const opts=Modal.options(f); input=`<select id="${fid}" data-k="${f.k}" data-t="${f.type}"><option value="">—</option>`+opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else if(f.type===FT.REF||f.k==='cls'){ const opts=Modal.refOptions(f); input=`<select id="${fid}" data-k="${f.k}" data-t="ref"><option value="">—</option>`+opts.map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else if(f.type===FT.MULTIREF){ const sel=(Array.isArray(v)?v:[]).map(String); const opts=Modal.refOptions(f); input=`<select id="${fid}" data-k="${f.k}" data-t="multiref" multiple size="7" style="min-height:130px">`+opts.map(o=>`<option value="${esc(o.v)}" ${sel.includes(String(o.v))?'selected':''}>${esc(o.l)}</option>`).join('')+`</select>`; }
    else input=`<input id="${fid}" data-k="${f.k}" data-t="${f.type}" value="${esc(v)}">`;
    return `<div class="fld ${wide?'wide':''}"><label>${esc(f.label)} ${f.req?'<span class="req">*</span>':''}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
  },
  options(f){ if(Array.isArray(f.options))return f.options.map(o=>({v:o,l:o})); return []; },
  refOptions(f){
    if(f.k==='cls') return (DB.global.classifications||[]).map(c=>({v:c.code,l:c.code+' — '+c.name}));
    const sc=SCHEMAS[f.ref]; const list=f.refScope==='global'?(DB.global[f.ref]||[]):App.coll(f.ref);
    return list.map(r=>({v:r[sc.id],l:String(r[sc.id])+(r[sc.title]&&r[sc.title]!==r[sc.id]?' — '+r[sc.title]:'')}));
  },
  save(){
    const {coll,scope,sc,origId}=Modal.ctx; const rec={};
    $('#modal').querySelectorAll('[data-k]').forEach(el=>{
      const k=el.dataset.k, t=el.dataset.t; let val=el.value;
      if(t===FT.MULTIREF) val=Array.from(el.selectedOptions).map(o=>o.value);
      else if(t===FT.NUM) val=val===''?'':(+val);
      else if(t===FT.LIST) val=val.split('\n').map(s=>s.trim()).filter(Boolean);
      else if(t===FT.BOOL) val=(val==='true');
      setPath(rec,k,val);
    });
    const idv=rec[sc.id];
    if(!idv||String(idv).trim()===''){ toast('“'+(sc.fields.find(f=>f.k===sc.id)||{}).label+'” is required','err'); return; }
    // unique id check (only when id changed / new)
    const list=scope==='global'?(DB.global[coll]||[]):App.coll(coll);
    if(String(idv)!==String(origId) && list.some(x=>String(x[sc.id])===String(idv))){ toast('An entry with id “'+idv+'” already exists','err'); return; }
    App.upsert(coll,scope,origId,rec);
    Modal.close(); toast((origId==null?'Created':'Saved')+' '+sc.label+' '+idv,'ok'); App.render();
  },
  close(){ $('#overlay').classList.remove('show'); Modal.ctx=null; },
};
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')Modal.close(); });
document.addEventListener('click',e=>{ if(!(e.target.closest&&e.target.closest('.gsearch-wrap'))){ const b=document.getElementById('globalSearchResults'); if(b)b.classList.remove('show'); } });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#overlay').classList.contains('show'))Modal.close(); }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))){ const s=document.querySelector('.search'); if(s){e.preventDefault();s.focus();} }
  if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); App.back(); }
  if(e.altKey&&e.key==='ArrowRight'){ e.preventDefault(); App.forward(); }
});

  trText(t){ if(this.D[t]) return this.D[t]; for(const [en,es] of this.P){ if(t.indexOf(en)>=0) return t.replace(en,es); } return t; },
  _walk(el){ for(const n of el.childNodes){ if(n.nodeType!==3) continue; const v=n.nodeValue, t=v.trim(); if(!t) continue;

      if(out!==t) n.nodeValue=v.replace(t,out); } },
