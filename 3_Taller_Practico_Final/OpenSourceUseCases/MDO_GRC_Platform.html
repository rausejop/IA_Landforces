ated"},{"ucId":"UC-A-008","goal":"Coordinate Combat SAR / Personnel Recovery for isolated personnel","trigger":"Isolated Personnel Report (IPR) received","preconditions":"PRCC up · recovery assets identified · authentication procedures current","postconditions":"Recovery mission launched and controlled · personnel recovered"},{"ucId":"UC-A-009","goal":"Coordinate air-to-air refuelling between tankers and receivers","trigger":"ATO AAR plan / dynamic refuelling request","preconditions":"AAR control net up · tanker on track · rendezvous data distributed","postconditions":"Receivers refuelled · fuel state updated · mission continuity assured"},{"ucId":"UC-A-010","goal":"Execute digitally-aided Close Air Support between JTAC and aircraft","trigger":"Supported land commander requests CAS; JTAC controls","preconditions":"Link 16 / VMF + UHF voice up · 9-line and rules of engagement agreed · identity confirmed","postconditions":"CAS delivered · effects assessed · land force advised (MC 0640 boundary)"},{"ucId":"UC-A-011","goal":"Downlink and disseminate ISR / RPAS full-motion video with metadata","trigger":"ISR/RPAS platform on task over the named area of interest","preconditions":"Ku/Ka or SATCOM data link up · STANAG 4609 motion-imagery + KLV metadata · exploitation cell ready","postconditions":"FMV exploited · products disseminated · collection requirement satisfied"},{"ucId":"UC-A-012","goal":"Assure Space / SATCOM / PNT support and report GNSS denial","trigger":"Continuous; degradation detected on SATCOM or GNSS","preconditions":"Anti-jam SATCOM + M-code GPS available · alternate PNT configured · reporting path up","postconditions":"Connectivity / PNT maintained or worked around · denial reported per AJP-3.3"}],"echelons":[{"lbl":"Air Ops Centre — JFAC / CAOC","tier":"H","desc":"Operational air C2 · ATO/ACO production, Recognized Air Picture custodian — core of MC 0655"},{"lbl":"Tactical control — CRC / ASOC / AEW&C","tier":"H","desc":"Real-time control of air assets · RAP feed, intercept & engagement control, dynamic tasking"},{"lbl":"Platform / unit — Wing · GBAD · ISR","tier":"M","desc":"Execution: fighters, ground-based air defence, ISR/RPAS, IFF sensors, tankers"},{"lbl":"Joint capstone — JFC (MC 0593)","tier":"H","desc":"Upstream joint direction & joint COP · realised by MC 0593","upstream":true},{"lbl":"Land tactical (CAS · MC 0640)","tier":"M","desc":"Air-land integration boundary (Close Air Support) · realised by MC 0640","upstream":true},{"lbl":"Maritime tactical (MC 0195)","tier":"M","desc":"Maritime-air integration boundary · realised by MC 0195","upstream":true},{"lbl":"JFACC","tier":"H","desc":"Joint Force Air Component Command — theatre air C2 authority.","upstream":false},{"lbl":"CAOC (BCE)","tier":"H","desc":"Combined Air Operations Centre — hosts the Battlefield Coordination Element.","upstream":false},{"lbl":"Airbase (GLO)","tier":"M","desc":"Air base / wing — Ground Liaison Officer interface to land forces.","upstream":false},{"lbl":"Squadron (GLO)","tier":"L","desc":"Flying squadron — Ground Liaison Officer at the tactical edge.","upstream":false}],"scenarios":[{"code":"VeVA-MN","name":"Vigilance Activities Mission Network (VeVA MN)","phase":"Standing / multi-JOA","note":"Standing multi-JOA Mission Network enabling warfighting C2 in SACEUR’s AOR, underlying readiness to execute the DDA FoP from peacetime through crisis to conflict. Supports HQ/units of the Regional Plans (NCS, NFS, NHDF) on a common infrastructure and single mission information domain."},{"code":"AIR-S1","name":"Peacetime","phase":"COPD v3 · Phase 4","note":"General Air C2 setup; baseline Air-to-Air picture compilation."},{"code":"AIR-S2","name":"CRO MJO setup & activities with initiation of NCS JFAC","phase":"COPD v3 · Phase 4–5","note":"Crisis Response Operation, Major Joint Operation; NATO Command Structure Joint Force Air Component stood up."},{"code":"AIR-S3","name":"CRO SJO activities with NCS JFAC and a small DCDR-Air SE initiated","phase":"COPD v3 · Phase 5","note":"Smaller Joint Operation; small Deployable Component Command Air Supporting Establishment."},{"code":"AIR-S4","name":"CRO SJO activities with NCS JFAC and a larger DCDR-Air SE having CPD","phase":"COPD v3 · Phase 5–6","note":"Larger DCDR-Air SE with a Collocated Planning Detachment (CPD)."},{"code":"AIR-ASR","name":"Air Support Request (Air-Land)","phase":"Air-Land integration","note":"4.3.1 — request for air support from a land force."},{"code":"AIR-CAS","name":"Close Air Support (Air-Land)","phase":"Air-Land integration","note":"4.3.2 — air action against hostile targets in close proximity to friendly forces."},{"code":"AIR-AI","name":"Air Interdiction (Air-Land)","phase":"Air-Land integration","note":"4.3.3 — air operations to delay/disrupt/destroy enemy potential before it is brought to bear."}],"tdlLinks":[{"name":"Link 11","arch":"Netted for Broadcast — ATDLP-5.11 (STANAG 5511)","community":"Maritime and Air C2","employment":"Widely fitted to support real-time track-data exchange for picture compilation and C2 direction.","sop":"ATDLP-7.33 (study draft)"},{"name":"Link 11B","arch":"Point-to-Point — ATDLP-5.11 (STANAG 5511)","community":"Shore-Based Air Defence","employment":"Tactical information exchange between shore-based weapons, surveillance and C2 systems.","sop":"ATDLP-7.33"},{"name":"Link 16","arch":"Broadcast TDMA — ATDLP-5.16 (STANAG 5516)","community":"Joint Air Defence","employment":"High-capacity digital data link with Electronic Protective Measures (EPM) for a multi-warfare environment: air, surface, subsurface, land, space and BMD.","sop":"ATDLP-7.33"},{"name":"Link 16 / JREAP","arch":"JREAP Satellite/Serial/IP — ATDLP-5.18 (STANAG 5518)","community":"Joint BLOS / Static Air Defence Sites","employment":"Extends range-limited tactical networks to Beyond-Line-of-Sight (BLOS) and reduces dependence on relay platforms.","sop":"ATDLP-7.33"},{"name":"Link 22","arch":"Broadcast / Dynamic TDMA (NILE)","community":"Maritime and Air C2","employment":"Latest NATO digital data link for ships, submarines, aircraft and shore sites; LOS (UHF) + BLOS (HF); complements Link 16 with shared messages/data elements.","sop":"ATDLP-7.33"}],"cisServices":[{"code":"CIS-a","name":"Secure Voice","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-b","name":"Secure VTC","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-c","name":"Air Command and Control Information Services (AirC2IS) Portal","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-d","name":"Secure e-mail","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-e","name":"J-CHAT","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-f","name":"Recognized Air Picture (RAP)","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-g","name":"LOGFAS","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-h","name":"Secure Data","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."}],"narratives":[{"id":"N-A-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Air-tactical Use Cases</strong> for <strong>MC 0655</strong>, the directive that specifies the minimum CIS capabilities at the Air tactical level. The Use Cases span the <em>Air Operations Centre</em> (JFAC / CAOC), <em>tactical control</em> (CRC / ASOC / AEW&amp;C) and the <em>platform / unit</em> tier (fighters, ground-based air defence, ISR/RPAS, IFF sensors). Each Use Case is an <strong>Information Exchange Requirement (IER)</strong> per <strong>AJP-6</strong>, managed under <strong>APP-15</strong>, generated as a <strong>NAF v4.1</strong> view, and tagged against the <strong>NATO C3 Taxonomy Baseline 7.0</strong>.</p>\n    <p>Every UC card carries two parts: a <em>NAF v4.1 / APP-15 Specification Header</em> and a <em>14-row Operational Body</em> (the six AJP-6 IER dimensions plus bearer/equipment, time window, environment, zones, availability, classification, an LPI/LPD risk meter and an attack-surface note). Row 9 (Environment) uses the <strong>APP-06 / STANAG 5516</strong> entity-identity model — Friendly · Hostile · Neutral · Unknown — which is central to air operations.</p>\n    <div>\n      <div><h3>Scope</h3><p>Air tactical: the air-picture, tasking and control exchanges between the CAOC, the control agencies (CRC / ASOC / AEW&amp;C) and the executing platforms — plus the Space / SATCOM / PNT enablers under AJP-3.3.</p></div>\n      <div><h3>Method</h3><p>AJP-6 supplies the IER definition; APP-15 the management discipline; NAF v4.1 the NOV/NSOV views; the C3 Taxonomy Baseline 7.0 the service classification (Air Services, Recognized Air Picture, Airspace Management) used in every card.</p></div>\n      <div><h3>Realisation</h3><p>Tactical data links (Link 16 / STANAG 5516, Link 22, JREAP-C / STANAG 5518) for the air picture; Mode 5 IFF (STANAG 4193) for identity; FMN core services over PCN (STANAG 4711) with STANAG 4774/4778 labels for the planning and tasking flows.</p></div>\n    </div>"},{"id":"N-A-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Air</strong> domain (canonical source: <strong>MC 0655</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.3</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Air CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Air information exchanges between the entities of this directive (CAOC · Control · Platform); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Air IER inventory across the CAOC · Control · Platform tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0655 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (CAOC · Control · Platform).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0655</strong> — Air tactical directive (+ Space enablers via AJP-3.3)</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.3 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-A-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> management and the <strong>NAF v4.1</strong> viewpoints to <strong>MC 0655</strong>, producing 12 Air Use Cases across the CAOC, tactical-control and platform tiers. Each carries the APP-15 specification header, the 14-row body with the APP-06 / STANAG 5516 entity-identity model in row 9, and a C3 Taxonomy Baseline 7.0 classification consistent with the Joint, Land and Maritime siblings.</p>\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Tier coverage</h3><p><strong>CAOC</strong> (3 — ATO, ACO/airspace, RAP), <strong>Control</strong> (6 — tactical control, AEW&amp;C feed, air defence, dynamic targeting, CSAR, AAR), <strong>Platform / cross-domain</strong> (3 — digitally-aided CAS, ISR/RPAS FMV, Space/SATCOM/PNT).</p></div>\n      <div><h3>Service coverage (C3 Taxonomy B7.0)</h3><p>Exercises <em>Air Tasking Order</em>, <em>Airspace Management</em>, <em>Recognized Air Picture</em>, <em>Track</em>, <em>Targeting</em>, <em>JISR</em>, <em>Audio/Video Collaboration</em>, and <em>Communications &amp; PNT</em> services.</p></div>\n      <div><h3>Identity &amp; threat coverage</h3><p>Row-9 identity exercises all four APP-06 / STANAG 5516 categories — Unknown and Neutral feature strongly in the air picture. Risk meter spans 2/5 to 4/5; the §5 constraint blocks map onto every bearer and attack-surface row.</p></div>\n    </div>\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>Entity identity is the defining air-domain control.</strong> The RAP (UC-003), air defence (UC-006) and CAS (UC-010) all hinge on Mode 5 IFF (STANAG 4193) and STANAG 5516 identity rules to keep Friendly / Hostile / Neutral / Unknown correct and avoid fratricide.</li>\n      <li><strong>Tactical data links are the air bearer.</strong> Link 16 (STANAG 5516), JREAP-C (STANAG 5518) and Link 22 (STANAG 5522) carry the picture and control; planning/tasking ride the FMN core over PCN.</li>\n      <li><strong>Air–land integration crosses a directive boundary.</strong> Digitally-aided CAS (UC-010) is the explicit hand-off to the <a href=\"MC_0640_Land_Use_Cases.html\">MC 0640</a> land force.</li>\n      <li><strong>Space / SATCOM / PNT resilience is foundational.</strong> UC-012 treats GNSS denial as an Unknown-attribution event and mandates anti-jam SATCOM, M-code GPS and alternate PNT per AJP-3.3.</li>\n    </ul>\n    <h2>11.3 — Open work, NISP B16 nomenclature &amp; FMN Spiral 6</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are <code>DRAFT v0.1</code>; ratification by AIRCOM / JFAC and the FMN community of interest is required before any UC moves to <code>APPROVED</code>.</li>\n      <li><strong>NISP B16 nomenclature:</strong> profiles are cited by exact catalogue identifier where verified, otherwise by Service Area + title + Spiral; the canonical source is <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16 / AC/322-D(2024)0053</a>.</li>\n      <li><strong>FMN Spiral alignment:</strong> the UCs realise <strong>FMN Spiral 5</strong> services. <strong>FMN Spiral 6</strong> carries the not-yet-implemented novelties — AI-assisted RAP fusion, cognitive EW, and the C2D2E / DDIL resilience set treated in the linked <a href=\"MC_0XXX_C2D2E_Use_Cases.html\">C2D2E</a> document. Treat Spiral-6 wording as <em>anticipatory</em>.</li>\n    </ul>"}]}},"S":{"code":"S","name":"Space","mc":"AJP-3.3 (notional)","reqPrefix":"S","collections":{"useCases":[{"id":"UC-S-001","serial":"S1.1","band":"SpOC","title":"MIL § 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Space-domain Use Cases</strong> (<code>UC-S-nnn</code>) across the <em>Space Operations Centre</em> (SpOC / JFSCC), the <em>segment</em> tier (ground · space · user/link segments) and the <em>effects</em> tier (PNT · SATCOM · ISR · Missile Warning · SSA). Space is a transversal enabler: it has no standalone tactical MC directive and is operationalised under <strong>AJP-3.3</strong>, but its IERs are standardised identically to the rest of the family.</p>\n    <p>Each Use Case is a <strong>REQ</strong> fulfilled by a <strong>CapElem</strong> stack per <strong>APP-15</strong> + the <strong>C3 Taxonomy Baseline 7.0</strong> (Space Domain Services <code>CI-1112</code>), generated as a <strong>NAF v4.1</strong> view. Identity follows <strong>STANAG 4162</strong>; the 14-row body uses the <strong>TC01–TC11</strong> constraints (§8.4).</p>\n    <div>\n      <div><h3>Scope</h3><p>Space C2 (SpOC/JFSCC), the ground/space/user segments, and the space effects delivered to the joint force — SATCOM, PNT, SSA, missile warning and space-based ISR.</p></div>\n      <div><h3>Method</h3><p>AJP-6 IER · APP-15 + CapElem · NAF v4.1 views · C3 Taxonomy Baseline 7.0 (CI-1112). Figures of Merit and KPIs per REQ family (§8.3).</p></div>\n      <div><h3>Realisation</h3><p>MILSATCOM (SHF/EHF/Ka, GEO), M-code GPS / Galileo PRS, OPIR missile-warning over Link 16, SSA catalogues, and TT&amp;C — with anti-jam and EMCON throughout.</p></div>\n    </div>"},{"id":"N-S-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Space</strong> domain (canonical source: <strong>AJP-3.3</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.3</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Space CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Space information exchanges between the entities of this directive (SpOC · Segment · Effects); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Space IER inventory across the SpOC · Segment · Effects tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the the Space domain scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (SpOC · Segment · Effects).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>AJP-3.3</strong> — no ratified MC directive yet — AJP-3.3 (Air &amp; Space Operations) is the canonical source</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.3 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-S-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This report applies the family's IER &rarr; REQ &rarr; CapElem model under AJP-6 / APP-15 / NAF v4.1 to the Space domain (AJP-3.3), producing 12 Use Cases across SpOC, segment and effects tiers. Space is a transversal enabler whose PNT, SATCOM, SSA and missile-warning effects underpin all four domains and the joint capstone.</p>\n    <h2>Key findings</h2>\n    <ul>\n      <li><strong>PNT and timing are foundational.</strong> UC-002 underpins the tactical data links across the family; GNSS denial is treated with alternate PNT and Unknown attribution.</li>\n      <li><strong>SATCOM is contested.</strong> Protected anti-jam waveforms, interference geolocation (UC-007) and EMCON (UC-010) are mandatory.</li>\n      <li><strong>Missile warning is time-critical.</strong> OPIR detection (UC-004) disseminates over Link 16 to IAMD/AAW consumers.</li>\n      <li><strong>Space feeds the joint COP.</strong> SSA + status federate into the JFC picture (UC-011) with STANAG 4162 identity.</li>\n    </ul>\n    <h2>Open work</h2>\n    <ul>\n      <li>All UCs are <code>DRAFT v0.1</code>. FMN Spiral 5 implemented; Spiral 6 (AI-assisted SSA, autonomous SATCOM management) anticipatory. NISP B16 codes per <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">the catalogue</a>.</li>\n    </ul>"}]}},"C":{"code":"C","name":"Cyberspace","mc":"AJP-3.20 (notional)","reqPrefix":"C","collections":{"useCases":[{"id":"UC-C-001","serial":"C1.1","band":"CyOC","title":"Cyber incident reporting (NCSC)","sub":"A cyber event on a mission-network element is detected, reported to the NCSC, triaged and ass bilities and patching across the enterprise","trigger":"New vulnerability advisory","preconditions":"Asset inventory · patch pipeline · risk acceptance process","postconditions":"Exposure reduced; residual risk recorded"},{"ucId":"UC-C-008","goal":"Provide identity &amp; access management (PKI / zero-trust)","trigger":"Access request / credential lifecycle event","preconditions":"PKI operational · zero-trust policy (SP 800-207)","postconditions":"Least-privilege access granted and continuously verified"},{"ucId":"UC-C-009","goal":"Assure cross-domain integrity through the CDS","trigger":"Cross-domain transfer requested","preconditions":"CDS policy current · STANAG 4774/4778 binding validated","postconditions":"Transfer released/blocked per policy; audited"},{"ucId":"UC-C-010","goal":"Map cyber dependencies to mission impact (mission assurance)","trigger":"Mission planning / change to CIS assets","preconditions":"Dependency model maintained · asset criticality known","postconditions":"Mission-impact view available to the commander"},{"ucId":"UC-C-011","goal":"Conduct cyber exercise &amp; training (ETEE)","trigger":"Scheduled exercise / readiness requirement","preconditions":"Cyber range available · scenarios approved","postconditions":"Readiness validated; gaps fed to improvement plan"},{"ucId":"UC-C-012","goal":"Represent cyber effects in the joint COP","trigger":"Significant cyber event affecting operations","preconditions":"Cyber COP federating to JFC · labels current","postconditions":"Cyber picture visible in the joint COP; COA recommended"}],"echelons":[{"lbl":"Cyberspace Ops Centre — CyOC / NCSC","tier":"H","desc":"Cyber C2 · incident management, threat intel, cyber COP — top of Cyberspace scope"},{"lbl":"Defensive Cyber Operations — DCO","tier":"H","desc":"Monitoring (SIEM), response &amp; containment, forensics, vulnerability management"},{"lbl":"Mission Assurance — CIS / network","tier":"M","desc":"Identity &amp; access (PKI · zero-trust), dependency mapping, cross-domain integrity"},{"lbl":"Joint capstone — JFC (MC 0593)","tier":"H","desc":"Cyber effects in the joint COP · realised by MC 0593","upstream":true},{"lbl":"C2D2E enabler (X)","tier":"M","desc":"DDIL resilience &amp; intrusion detection · realised by C2D2E","upstream":true},{"lbl":"All domains (L/M/A/S)","tier":"M","desc":"Cyber assures the CIS of every domain","upstream":true}],"scenarios":[],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-C-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Cyberspace Use Cases</strong> (<code>UC-C-nnn</code>) across the <em>Cyberspace Operations Centre</em> (CyOC / NCSC), <em>Defensive Cyber Operations</em> (DCO) and <em>Mission Assurance</em>. Cyberspace is a transversal domain governed by <strong>AJP-3.20</strong> and the NATO <strong>AC/322</strong> directives; its IERs are standardised identically to the rest of the family.</p>\n    <p>Each Use Case is a <strong>REQ</strong> fulfilled by a <strong>CapElem</strong> stack per <strong>APP-15</strong> + the <strong>C3 Taxonomy Baseline 7.0</strong> (Cyberspace Domain Services <code>CI-1029</code>), generated as a <strong>NAF v4.1</strong> view, built on a <strong>zero-trust</strong> posture (NIST SP 800-207). The 14-row body uses the <strong>TC01–TC11</strong> constraints (§8.4); attribution is held Unknown until confirmed.</p>\n    <div>\n      <div><h3>Scope</h3><p>Cyber C2 (CyOC/NCSC), defensive cyber operations (monitoring, response, forensics) and mission assurance (identity, dependency mapping, cross-domain integrity).</p></div>\n      <div><h3>Method</h3><p>AJP-6 IER · APP-15 + CapElem · NAF v4.1 · C3 Taxonomy Baseline 7.0 (CI-1029). Figures of Merit and KPIs per REQ family (§8.3).</p></div>\n      <div><h3>Realisation</h3><p>NCSC sensors / SIEM, STIX/TAXII threat-intel exchange, PKI &amp; zero-trust (SP 800-207), CDS at boundaries, STANAG 4774/4778 labels, out-of-band reporting.</p></div>\n    </div>"},{"id":"N-C-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Cyberspace</strong> domain (canonical source: <strong>AJP-3.20</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.20</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Cyberspace CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Cyberspace information exchanges between the entities of this directive (CyOC · DCO · Mission Assurance); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Cyberspace IER inventory across the CyOC · DCO · Mission Assurance tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the the Cyberspace domain scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (CyOC · DCO · Mission Assurance).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>AJP-3.20</strong> — no ratified MC directive yet — AJP-3.20 (Cyberspace Operations) is the canonical source</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.20 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-C-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This report applies the family's IER &rarr; REQ &rarr; CapElem model under AJP-6 / APP-15 / NAF v4.1 to the Cyberspace domain (AJP-3.20 · AC/322), producing 12 Use Cases across CyOC, DCO and Mission-Assurance tiers on a zero-trust foundation. Cyberspace assures the CIS that every domain depends on.</p>\n    <h2>Key findings</h2>\n    <ul>\n      <li><strong>Attribution is Unknown until confirmed.</strong> Incident reporting (UC-001) and the cyber COP treat identity cautiously per STANAG 4162.</li>\n      <li><strong>Sharing is standardised.</strong> STIX/TAXII threat-intel (UC-002) is labelled and CDS-gated.</li>\n      <li><strong>Zero trust is the foundation.</strong> IAM (UC-008) and segmentation mean a partial compromise does not collapse C2.</li>\n      <li><strong>Mission assurance links cyber to operations.</strong> Dependency mapping (UC-010) and cyber effects in the joint COP (UC-012) connect to the JFC.</li>\n    </ul>\n    <h2>Open work</h2>\n    <ul>\n      <li>All UCs are <code>DRAFT v0.1</code>. FMN Spiral 5 implemented; Spiral 6 (AI-assisted detection, autonomous response) anticipatory. Closely coupled with the <a href=\"MC_0XXX_C2D2E_Use_Cases.html\">C2D2E</a> enabler. NISP B16 codes per <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">the catalogue</a>.</li>\n    </ul>"}]}},"T":{"code":"T","name":"STRATCOM","mc":"AJP-10 (notional)","reqPrefix":"T","collections":{"useCases":[{"id":"UC-T-001","serial":"T1.1","band":"Strategic","title":"StratCom narrative direction &amp; guidance","sub":"NATO StratCom promulgates the approved narrative and guidance to the force, synchronising words, images and actions with the commander's intent.","cls":"NS","prec":"Immediate","env":"FR","lpi":1,"avail":"High","timeWindow":"Event-driven on narrative set/change","zones":"Strategic / theatre · StratCom CoI","ier":{"who":"SHAPE StratCom ➜ force / components","what":"Narrative guidance · Content Management / Military Messaging Services","when":"Event-driven","protection":"NATO Secret · STANAG 4774 labels","volume":"Guidance documents"},"equipment":["FMN content-management / messaging service","Coordination &amp; release workflow","STANAG 4711 PCN distribution","STANAG 4774 labels"],"attackSurface":"Narrative integrity is the target. Mitigation: signed guidance, release authority, provenance, consistency checks.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1051"],"coi":["CI-1021"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-T-002","serial":"T1.2","band":"Strategic","title":"Coalition StratCom synchronisation","sub":"NATO and partner StratCom staffs synchronise messaging within a shared narrative framework to avoid contradiction.","cls":"NS","prec":"Priority","env":"FR","lpi":1,"avail":"High","timeWindow":"Coordination cycle","zones":"Coalition · StratCom CoI","ier":{"who":"NATO StratCom ↔ partner StratCom hostile narratives / disinformation (virtual dimension)","trigger":"Anomalous narrative activity observed","preconditions":"Social-media / OSINT monitoring · detection analytics","postconditions":"Hostile narrative characterised; attribution Unknown until confirmed"},{"ucId":"UC-T-006","goal":"Coordinate and release Public Affairs products","trigger":"PA product ready for release","preconditions":"Approval workflow · narrative alignment check","postconditions":"PA product released; consistency with the narrative assured"},{"ucId":"UC-T-007","goal":"Approve and disseminate PSYOPS products","trigger":"PSYOPS product ready / target audience defined","preconditions":"Approval authority · legal/ROE review · dissemination means","postconditions":"PSYOPS product disseminated to the target audience"},{"ucId":"UC-T-008","goal":"Monitor social media / OSINT for the StratCom picture","trigger":"Continuous monitoring","preconditions":"OSINT collection · source vetting · labelling","postconditions":"Monitoring feed maintained; indicators surfaced"},{"ucId":"UC-T-009","goal":"Analyse audiences and select target audiences","trigger":"Campaign planning / effect required","preconditions":"Audience data · analysis methodology","postconditions":"Target audiences selected with supporting analysis"},{"ucId":"UC-T-010","goal":"Measure effect (MOE/MOP) against the narrative","trigger":"Assessment cycle","preconditions":"Indicators defined · data collection in place","postconditions":"Effect measured and fed back into planning"},{"ucId":"UC-T-011","goal":"Conduct counter-disinformation rapid response","trigger":"Confirmed hostile disinformation requiring response","preconditions":"Pre-approved response options · Cyber coordination","postconditions":"Counter-narrative released; effect monitored"},{"ucId":"UC-T-012","goal":"Coordinate STRATCOM with Cyber / Info Ops","trigger":"Information activity spanning STRATCOM and Cyber","preconditions":"Cross-domain coordination forum · shared labels","postconditions":"Activities de-conflicted and synchronised across domains"}],"echelons":[{"lbl":"Strategic — NAC / SHAPE StratCom","tier":"H","desc":"Narrative direction &amp; guidance · synchronisation with the commander's intent — top of STRATCOM scope"},{"lbl":"Cognitive — Info Ops · PSYOPS · PA","tier":"H","desc":"The cognitive instruments: Information Operations, Psychological Operations, Public Affairs"},{"lbl":"Effects — audience analysis · MOE","tier":"M","desc":"Target-audience analysis and Measurement of Effect across cognitive · virtual · physical dimensions"},{"lbl":"Joint capstone — JFC (MC 0593)","tier":"H","desc":"STRATCOM contribution to the joint COP &amp; intent · realised by MC 0593","upstream":true},{"lbl":"Cyberspace (C)","tier":"M","desc":"Counter-disinformation coupling · realised by Cyber domain","upstream":true},{"lbl":"All domains (L/M/A/S)","tier":"M","desc":"STRATCOM effects synchronise with every domain","upstream":true}],"scenarios":[],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-T-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 STRATCOM Use Cases</strong> (<code>UC-T-nnn</code>) across the <em>Strategic</em> (direction), <em>Cognitive</em> (Information Operations · PSYOPS · Public Affairs) and <em>Effects</em> (audience analysis · Measurement of Effect) tiers — operating in the <strong>cognitive</strong>, <strong>virtual</strong> and <strong>physical</strong> dimensions of the operational environment. Governed by <strong>AJP-10</strong> and <strong>AJP-3.10</strong>.</p>\n    <p>Each Use Case is a <strong>REQ</strong> fulfilled by a <strong>CapElem</strong> stack per <strong>APP-15</strong> + the <strong>C3 Taxonomy Baseline 7.0</strong>, generated as a <strong>NAF v4.1</strong> view. The 14-row body uses the <strong>TC01–TC11</strong> constraints (§8.4); the information environment makes track identity (STANAG 4162) and attribution especially careful — hostile narrative actors are often Unknown.</p>\n    <div>\n      <div><h3>Scope</h3><p>Strategic narrative direction; the cognitive instruments (Info Ops, PSYOPS, Public Affairs); and the effects function (audience analysis, Measurement of Effect) — synchronised with operations.</p></div>\n      <div><h3>Method</h3><p>AJP-6 IER · APP-15 + CapElem · NAF v4.1 · C3 Taxonomy Baseline 7.0. Figures of Merit and KPIs per REQ family (§8.3); effect measured against the narrative.</p></div>\n      <div><h3>Realisation</h3><p>Messaging &amp; content services, OSINT / social-media monitoring, audience-analysis tooling, and secure collaboration — with STANAG 4774 labels and coordination with the Cyber domain.</p></div>\n    </div>"},{"id":"N-T-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>STRATCOM</strong> domain (canonical source: <strong>AJP-10</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-10 / AJP-3.10</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to STRATCOM CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the STRATCOM information exchanges between the entities of this directive (Strategic · Cognitive · Effects); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>STRATCOM IER inventory across the Strategic · Cognitive · Effects tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the STRATCOM scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (Strategic · Cognitive · Effects).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>AJP-10</strong> — no ratified MC directive yet — AJP-10 (Strategic Communications) is the canonical source</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-10 / AJP-3.10 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-T-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This report applies the family's IER &rarr; REQ &rarr; CapElem model under AJP-6 / APP-15 / NAF v4.1 to STRATCOM (AJP-10 · AJP-3.10), producing 12 Use Cases across Strategic, Cognitive and Effects tiers in the cognitive, virtual and physical dimensions.</p>\n    <h2>Key findings</h2>\n    <ul>\n      <li><strong>Narrative coherence is the goal.</strong> Direction (UC-001) and coalition synchronisation (UC-002) keep words, images and actions aligned with intent.</li>\n      <li><strong>Attribution is cautious.</strong> Disinformation detection (UC-005) and OSINT monitoring (UC-008) hold actor identity Unknown until confirmed.</li>\n      <li><strong>Effect is measured.</strong> Audience analysis (UC-009) and MOE/MOP (UC-010) feed the planning cycle.</li>\n      <li><strong>Tightly coupled with Cyber.</strong> Counter-disinformation (UC-011) and cross-domain coordination (UC-012) synchronise with the Cyber domain.</li>\n    </ul>\n    <h2>Open work</h2>\n    <ul>\n      <li>All UCs are <code>DRAFT v0.1</code>. FMN Spiral 5 implemented; Spiral 6 (AI-assisted narrative analytics) anticipatory. Ethical / legal oversight of audience analysis is a standing requirement. NISP B16 codes per <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">the catalogue</a>.</li>\n    </ul>"}]}},"X":{"code":"X","name":"C2D2E / DDIL+AI","mc":"FMN Spiral 6 (notional)","reqPrefix":"X","collections":{"useCases":[{"id":"UC-X-001","serial":"S-C2D-COP-01","band":"Resilience","title":"Disruption-tolerant COP synchronisation","sub":"Disconnected and intermittently-connected nodes keep a usable Common Operational Picture by exchanging signed, content-addressed updates that converge automatically on reconnection — no operator merge.","cls":"NS","prec":"Priority","env":"HO","lpi":4,"avail":"Mission (eventually-consistent under DDIL)","timeWindow":"Continuous; converges opportunistically","zones":"Contested tactical edge · all domains","ier":{"who":"Disconnected C2 node ↔ peer nodes ↔ higher HQ (on reconnection)","what":"COP deltas · Recognized Picture / Situation Awareness Services (C3 Taxonomy) over a data-centric store","when":"Event-driven on contact; eventually consistent","protection":"NATO Secret · STANAG 4774/4778 signed objects · attribute-based access","volume":"Low-medium · compressed deltas, not full pictures"},"equipment":["Delay/Disruption-Tolerant Networking — Bundle Protocol v7 (RFC 9171) store-and-forward","Conflict-free replicated data types (CRDT) / data-centric pub-sub for automatic convergence","Signed, content-addressed COP objects with STANAG 4778 metadata binding","Anticipatory (FMN Spiral 6) — not yet codified in NISP Baseline 16"],"attackSurface":"Eventual consistency can be poisoned by forged deltas. Mitigation: object signing, causal ordering, label-bound provenance, and rejection of unsigned or out-of-policy updates.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1080"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-002","serial":"S-C2D-PACE-02","band":"Resilience","title":"Autonomous PACE-plan bearer failover","sub":"When the primary bearer is denied, C2 traffic fails over automatically across the Primary / Alternate / Contingency / Emergency plan, with operators notified of each demotion.","cls":"NS","prec":"Immediate","env":"HO","lpi":4,"avail":"High (continuity is the point)","timeWindow":"Continuous; event-driven on bearer loss","zones":"Contested tactical edge · all domains","ier":{"who":"C2 node ↔ transport manager ↔ available bearers","what":"Bearer health + failover decision · Communications / Infrastructure Services (C3 Taxonomy)","when":"Event-driven on bearer degradation","protection":"NATO Secret · per-bearer crypto · STANAG 4774 labels preserved across paths","volume":"Low · control-plane signalling"},"equipment":["PACE plan across SATCOM / line-of-sight / HF / cellular bearers with health monitoring","Policy-driven transport manager (priority-aware) selecting the next viable path","STANAG 4711 PCN preserved end-to-end across the active bearer","Anticipatory (FMN Spiral 6) AI-assisted bearer scoring"],"attackSurface":"An adversary can try to force repeated costly failovers (flapping). Mitigation: hysteresis, authenticated health signals, and rate-limited demotion/promotion.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1077","CO-1083"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-003","serial":"S-C2D-REPL-03","band":"Resilience","title":"Data-centric replication under intermittent links","sub":"Mission data is replicated by content and subscription rather than by connection, so a consumer receives the latest signed object as soon as any path becomes available.","cls":"NS","prec":"Priority","env":"HO","lpi":3,"avail":"Mission (eventually consistent)","timeWindow":"Continuous; opportunistic delivery","zones":"Contested tactical edge · all domains","ier":{"who":"Producer ➜ data-centric store ➜ subscribing consumers","what":"Signed data objects · Content Management Services (C3 Taxonomy) over DTN","when":"Event-driven; delivered on next contact","protection":"NATO Secret · STANAG 4774/4778 per-object labels · ABAC","volume":"Variable · deduplicated, compressed objects"},"equipment":["Content-addressed object store with subscription/interest forwarding","DTN Bundle Protocol v7 (RFC 9171) custody transfer","Attribute-based access control bound to STANAG 4778 metadata","Anticipatory (FMN Spiral 6)"],"attackSurface":"Interest/subscription flooding and cache poisoning. Mitigation: signed interests, quota enforcement, and signature verification before caching.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1080"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-004","serial":"S-C2D-INTENT-04","band":"Resilience","title":"Mission command by intent under denial","sub":"An isolated subordinate continues to act within the "NATO Secret · signed spectrum policy · LPI/LPD posture preserved","volume":"Low · control-plane + sensing summaries"},"equipment":["AI spectrum-sensing model on a cognitive SDR (ESSOR-class cognitive modes — anticipatory)","Dynamic spectrum access within a signed frequency policy / whitelist","FFH / EPM fallback (SATURN STANAG 4372 style) when no clear channel exists","Anticipatory (FMN Spiral 6) — model assurance and explainability required"],"attackSurface":"Adversaries can spoof occupancy to herd the radio onto monitored channels. Mitigation: signed policy bounds, anomaly checks on sensing input, and human-on-the-loop for out-of-policy moves.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083","CO-1057"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-006","serial":"S-C2D-RTE-06","band":"AI-Comms","title":"AI adaptive routing & QoS under congestion","sub":"An AI routing agent observes the DTN overlay and continuously re-shapes routing and QoS so mission-essential IERs keep flowing while bulk traffic is shed or deferred.","cls":"NS","prec":"Priority","env":"HO","lpi":3,"avail":"High","timeWindow":"Continuous","zones":"Contested tactical network · all domains","ier":{"who":"AI routing agent ↔ DTN/IP overlay ↔ priority policy","what":"Routing & QoS decisions · Infrastructure / SMC Services (C3 Taxonomy)","when":"Continuous; threshold-driven adaptation","protection":"NATO Restricted · signed policy · DSCP priority preserved","volume":"Low · control-plane telemetry"},"equipment":["AI routing/QoS agent over the DTN + IP overlay","DSCP / MLPP priority policy with explainable decisions","Graceful degradation: priority IERs preserved, bulk deferred","Anticipatory (FMN Spiral 6)"],"attackSurface":"A learning router can be gamed by crafted load. Mitigation: bounded policy envelope, explainability logs, and fallback to deterministic priority routing.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1057"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-007","serial":"S-C2D-PRED-07","band":"AI-Comms","title":"AI link-quality prediction & proactive bearer/waveform selection","sub":"A predictive model forecasts imminent link degradation from telemetry and pre-emptively switches bearer or waveform before the link fails, minimising disruption.","cls":"NS","prec":"Priority","env":"HO","lpi":4,"avail":"High","timeWindow":"Continuous prediction; pre-emptive switch","zones":"Contested tactical edge · all domains","ier":{"who":"AI link-prediction model ↔ transport manager ↔ candidate bearers","what":"Link forecast + switch decision · Communications Services (C3 Taxonomy)","when":"Continuous; anticipatory switch ahead of failure","protection":"NATO Secret · signed model + decision audit · STANAG 4774 labels","volume":"Low · telemetry + decisions"},"equipment":["AI time-series link-quality predictor consuming bearer telemetry","Candidate bearer/waveform set with assurance bounds","Pre-emptive make-before-break switching","Anticipatory (FMN Spiral 6)"],"attackSurface":"Telemetry poisoning could trigger needless or harmful switches. Mitigation: authenticated telemetry, conservative switch thresholds, and audit of every pre-emptive action.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1080"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-008","serial":"S-C2D-COMP-08","band":"AI-Comms","title":"AI bandwidth/codec adaptation & semantic compression","sub":"AI adapts codec, bandwidth and content fidelity to the available link — using semantic compression so mission-essential meaning survives even when throughput collapses.","cls":"NR","prec":"Routine","env":"N","lpi":2,"avail":"High","timeWindow":"Continuous adaptation","zones":"Constrained / shared spectrum · all domains","ier":{"who":"Producer AI codec ↔ link manager ↔ consumer (fidelity floor)","what":"Adapted media / data products · Communications / Content Management Services (C3 Taxonomy)","when":"Continuous; throughput-driven","protection":"NATO Restricted · STANAG 4774 labels preserved through transcoding","volume":"Adaptive · scales down to mission-essential floor"},"equipment":["AI content-adaptation / semantic-compression engine with agreed fidelity floors","Codec ladder (voice / imagery / FMV) negotiated with consumers","Label preservation across transcoding","Anticipatory (FMN Spiral 6)"],"attackSurface":"Over-aggressive compression can drop safety-critical detail. Mitigation: enforced fidelity floors per product class and human-defined essential-elements that are never dropped.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1051"],"coi":["CI-1061"],"tc05":"NATO + Mission Partners · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-009","serial":"S-C2D-EMS-09","band":"EMS-Cognition","title":"Electromagnetic-environment knowledge generation (EMS picture)","sub":"Distributed RF sensing is fused by AI into an electromagnetic-environment picture — emitters geolocated, classified and identified — and cued to EW and C2 consumers.","cls":"NS","prec":"Priority","env":"UNK","lpi":4,"avail":"High (24/7)","timeWindow":"Continuous","zones":"Electromagnetic operating environment · all domains","ier":{"who":"Distributed RF sensors ➜ AI fusion ➜ EW cell & C2 consumers","what":"EMS picture (emitters, geolocation, identity) · JISR / EW Services (C3 Taxonomy)","when":"Near-real-time, continuous","protection":"NATO Secret · STANAG 4774 labels · identity per STANAG 5516 where correlatable","volume":"Medium · emitter tracks + classifications"},"equipment":["Distributed RF / ES sensors feeding an AI geolocation & classification engine","Electromagnetic-environment picture fused with the COP (APP-6 symbology)","Cueing interface to cognitive EW and to C2 situational awareness","Anticipatory (FMN Spiral 6) · doctrine per AJP-3.6"],"attackSurface":"Decoy emitters and spoofed signatures can mislead the EMS picture. Mitigation: multi-sensor corroboration, confidence scoring, and identity treated as Unknown until corroborated.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1080"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-010","serial":"S-C2D-CEW-10","band":"EMS-Cognition","title":"Cognitive EW — AI jamming detection & EPM response","sub":"AI classifies an interference event as hostile jamming and drives an electronic-protection response (frequency hopping, nulling, re-home), assessing effectiveness and reporting per AJP-3.6.","cls":"NS","prec":"Flash","env":"HO","lpi":5,"avail":"High (24/7)","timeWindow":"Continuous; flash on jamming","zones":"Contested electromagnetic spectrum · all domains","ier":{"who":"EMS picture / cognitive-EW AI ↔ affected radios ↔ EW cell","what":"Jamming detection + EPM action + EW report · EW Services (C3 Taxonomy) per AJP-3.6","when":"Event-driven on jamming detection","protection":"NATO Secret · STANAG 4774 labels · attribution Unknown until confirmed","volume":"Low-medium · detections + EPM actions"},"equipment":["Cognitive-EW classifier consuming the EMS picture","EPM repertoire: fast frequency hopping (SATURN STANAG 4372 style), spatial nulling, channel re-home","Automated OPTASK-EW-style reporting (AJP-3.6)","Anticipatory (FMN Spiral 6) · human-on-the-loop for offensive effects"],"attackSurface":"Mis-classifying friendly/neutral emissions as hostile risks fratricide in the spectrum. Mitigation: corroborated classification, human-on-the-loop for active EA, and conservative EPM-only defaults.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-011","serial":"S-C2D-EMCON-11","band":"EMS-Cognition","title":"AI-managed emission control (EMCON) & LPI/LPD posture","sub":"AI advises and (within policy) manages emission control and the LPI/LPD posture as the threat picture and mission phase change, minimising the force's electromagnetic signature.","cls":"NS","prec":"Immediate","env":"HO","lpi":5,"avail":"High","timeWindow":"Continuous; phase- and threat-driven","zones":"Contested electromagnetic spectrum · all domains","ier":{"who":"EMCON AI advisor ↔ commander (human-on-the-loop) ↔ emitting systems","what":"EMCON state + LPI/LPD profile · EW / SMC Services (C3 Taxonomy)","when":"Event-driven on threat/phase change","protection":"NATO Secret · signed EMCON policy · STANAG 4774 labels","volume":"Low · posture directives"},"equipment":["AI EMCON advisor mapping threat picture to an LPI/LPD profile","Policy-bounded automatic emitter management with human-on-the-loop","Signature-management feedback from the EMS picture","Anticipatory (FMN Spiral 6) · doctrine per AJP-3.6"],"attackSurface":"An adversary may try to provoke emissions to fingerprint the force. Mitigation: conservative EMCON defaults, human authority for posture relaxation, and decoy/randomised emission management.","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1057"],"coi":["CI-1061"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-X-012","serial":"S-C2D-ZTA-12","band":"EMS-Cognition","title":"AI anomaly & intrusion detection on tactical networks (zero-trust)","sub":"AI flags anomalous behaviour on a mission-network ele nate/Contingency/Emergency bearers configured · health monitoring active","postconditions":"Traffic continues on the next viable bearer; operators are notified of the demotion"},{"ucId":"UC-X-003","goal":"Replicate mission data by content, not by connection, under intermittent links","trigger":"A consumer subscribes to or requests a data product while links flap","preconditions":"Data-centric pub/sub with content addressing · signed objects · label policy current","postconditions":"Consumer receives the latest signed object once any path becomes available"},{"ucId":"UC-X-004","goal":"Sustain mission command by intent when reach-back is denied","trigger":"Subordinate is isolated from higher HQ","preconditions":"Commander's intent + CCIR cached locally · delegation rules pre-agreed","postconditions":"Subordinate acts within intent; decisions reconcile automatically on reconnection"},{"ucId":"UC-X-005","goal":"Sense the spectrum and select clear channels via dynamic spectrum access","trigger":"Congestion or interference detected on the active channel","preconditions":"AI spectrum-sensing model loaded · policy/whitelist for permitted bands · cognitive radio","postconditions":"Link re-homed to a clear channel within policy; spectrum decision logged"},{"ucId":"UC-X-006","goal":"Adapt routing and QoS in real time to keep priority traffic flowing under congestion","trigger":"Link quality or load crosses a threshold","preconditions":"AI routing agent observing the DTN overlay · DSCP/priority policy set","postconditions":"Priority IERs delivered; bulk traffic shed or deferred; decision explainable"},{"ucId":"UC-X-007","goal":"Predict link degradation and proactively switch bearer/waveform before the link fails","trigger":"AI link-quality model forecasts imminent degradation","preconditions":"Telemetry history available · candidate bearers/waveforms enumerated · assurance bounds set","postconditions":"Pre-emptive switch executed with minimal disruption; rationale recorded"},{"ucId":"UC-X-008","goal":"Adapt bandwidth, codec and content fidelity to the available link via semantic compression","trigger":"Available throughput drops below the product's nominal need","preconditions":"AI content-adaptation model · fidelity floors agreed with consumers","postconditions":"Mission-essential content delivered at reduced fidelity without loss of meaning"},{"ucId":"UC-X-009","goal":"Generate electromagnetic-environment knowledge — an EMS picture from fused RF sensing","trigger":"Continuous; new emitters or interference observed","preconditions":"Distributed RF sensors feeding the fusion engine · geolocation & classification models","postconditions":"EMS picture updated with emitter identity/location; cued to EW and C2 consumers"},{"ucId":"UC-X-010","goal":"Detect jamming and drive an electronic-protection response (cognitive EW)","trigger":"AI classifies an interference event as hostile jamming","preconditions":"EMS picture available · EPM repertoire (FFH, nulling, re-home) configured","postconditions":"EPM applied; effectiveness assessed; event reported per AJP-3.6 with attribution Unknown until confirmed"},{"ucId":"UC-X-011","goal":"Manage emission control (EMCON) and LPI/LPD posture with AI under contest","trigger":"Threat picture or mission phase changes the required emission posture","preconditions":"EMCON policy + LPI/LPD profiles defined · AI advisor with human-on-the-loop","postconditions":"Emission posture adjusted within policy; signature minimised; changes logged"},{"ucId":"UC-X-012","goal":"Detect anomalies and intrusions on tactical networks under a zero-trust model","trigger":"AI flags anomalous behaviour on a mission-network element","preconditions":"Zero-trust (NIST SP 800-207) segmentation · behavioural baselines · out-of-band alerting","postconditions":"Suspect entity contained; incident reported per AJP-3.20; mission impact assessed"}],"echelons":[{"lbl":"Resilience — DDIL C2 continuity","tier":"H","desc":"Delay/disruption-tolerant networking · data-centric replication · PACE failover · mission command by intent"},{"lbl":"AI-Comms — cognitive bearer","tier":"H","desc":"AI spectrum access · link-quality prediction · adaptive routing/QoS · waveform &amp; codec selection"},{"lbl":"EMS-Cognition — electromagnetic knowledge","tier":"H","desc":"RF sensing fusion into an EMS picture · cognitive EW · AI emission control (LPI/LPD)"},{"lbl":"Domain consumers — MC 0593/0640/0195/0655","tier":"M","desc":"The Joint, Land, Maritime and Air directives consume these patterns at their contested tactical edges","upstream":true}],"scenarios":[],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-X-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 transversal Use Cases</strong> for operating C2 under <strong>C2D2E / DDIL</strong> conditions and for applying <strong>Artificial Intelligence</strong> to tactical communications and to electromagnetic-environment knowledge. They are organised in three families: <em>Resilience</em> (keeping C2 alive when the network is denied, disrupted, intermittent or limited), <em>AI-Comms</em> (AI optimisation of the bearer, routing and waveform), and <em>EMS-Cognition</em> (AI generation of an electromagnetic picture and cognitive electronic warfare).</p>\n    <p>Each Use Case is an <strong>IER</strong> per <strong>AJP-6</strong>, managed under <strong>APP-15</strong>, generated as a <strong>NAF v4.1</strong> view and tagged against the <strong>NATO C3 Taxonomy Baseline 7.0</strong>. Because these capabilities are not yet codified in NISP Baseline 16, the report is framed against <strong>FMN Spiral 6 (anticipatory)</strong> — the spiral that will carry the not-yet-implemented novelties. The Use Cases are domain-agnostic and apply to the Joint, Land, Maritime and Air siblings alike.</p>\n    <div>\n      <div><h3>Resilience (DDIL)</h3><p>Delay/disruption-tolerant networking, data-centric replication, PACE failover and mission command by intent so that C2 survives loss of connectivity.</p></div>\n      <div><h3>AI-Comms</h3><p>On-platform machine learning that senses the spectrum, predicts link quality, and selects bearer / waveform / codec dynamically to maximise throughput and survivability under contest.</p></div>\n      <div><h3>EMS-Cognition</h3><p>AI fusion of RF sensing into an electromagnetic-environment picture, cognitive EW (jamming detection &amp; EPM) and AI-managed emission control (LPI/LPD posture).</p></div>\n    </div>"},{"id":"N-X-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>C2D2E / DDIL</strong> domain (canonical source: <strong>AJP-3.6 / AJP-3.20</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.6 / AJP-3.20</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to C2D2E / DDIL CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the C2D2E / DDIL information exchanges between the entities of this directive (Resilience · AI-Comms · EMS-Cognition); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>C2D2E / DDIL IER inventory across the Resilience · AI-Comms · EMS-Cognition tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the the C2D2E enabler scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (Resilience · AI-Comms · EMS-Cognition).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>AJP-3.6 / AJP-3.20</strong> — transversal enabler — anticipatory (FMN Spiral 6); canonical doctrine AJP-3.6 / AJP-3.20</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.6 / AJP-3.20 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-X-conclusions","order":30,"section":"Findings & Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> management and <strong>NAF v4.1</strong> to the <strong>C2D2E / DDIL + AI</strong> problem, producing 12 transversal Use Cases in three families. Each carries the APP-15 header, the 14-row body with the APP-06 / STANAG 5516 identity model, a C3 Taxonomy Baseline 7.0 classification, and an explicit <strong>FMN Spiral 6 (anticipatory)</strong> maturity tag.</p>\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Family coverage</h3><p><strong>Resilience</strong> (4 — DTN COP sync, PACE failover, data-centric replication, mission command by intent), <strong>AI-Comms</strong> (4 — spectrum access, adaptive routing, link prediction, semantic compression), <strong>EMS-Cognition</strong> (4 — EMS picture, cognitive EW, AI EMCON, AI intrusion detection).</p></div>\n      <div><h3>Service coverage (C3 Taxonomy B7.0)</h3><p>Exercises <em>Communications</em>, <em>Infrastructure / SMC</em>, <em>Content Management</em>, <em>Situation Awareness</em>, <em>JISR</em>, <em>EW</em> and <em>Cyber Security</em> services — the technical-services spine the domain directives lean on under contest.</p></div>\n      <div><h3>Threat / identity coverage</h3><p>Risk meter is high throughout (2/5–5/5), reflecting the contested EMS. Row-9 identity leans on Hostile and Unknown; attribution is deliberately held as Unknown until confirmed in the EW and cyber UCs.</p></div>\n    </div>\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>DDIL forces data-centric, connection-agnostic design.</strong> COP sync, replication and mission command by intent all assume the network may be absent and converge when it returns.</li>\n      <li><strong>AI is an optimiser, not an authority.</strong> Every AI-Comms and EMS UC keeps a human-on-the-loop, bounded autonomy and explainability; AI never holds release authority for effects.</li>\n      <li><strong>EMS knowledge is the connective tissue.</strong> The electromagnetic-environment picture (UC-009) feeds cognitive EW (UC-010) and EMCON (UC-011), and shares the APP-06 / STANAG 5516 identity language with the air and joint pictures.</li>\n      <li><strong>Security travels with the data.</strong> Zero-trust and STANAG 4774/4778 labels mean a partial compromise does not collapse C2 — the precondition for trusting any of this under denial.</li>\n    </ul>\n    <h2>11.3 — Open work &amp; FMN Spiral 6</h2>\n    <ul>\n      <li><strong>Anticipatory status:</strong> every capability here is tagged <strong>FMN Spiral 6 (anticipatory)</strong> — it is <em>not</em> codified in NISP Baseline 16. The exact PFL profiles will be assigned when a future NISP baseline formalises AI / cognitive / DDIL services. The canonical catalogue remains <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16 / AC/322-D(2024)0053</a>.</li>\n      <li><strong>AI assurance:</strong> model provenance, adversarial-robustness testing, explainability and human-on-the-loop are mandatory and require a NATO AI-assurance regime not yet standardised.</li>\n      <li><strong>Consumption by the domain directives:</strong> these patterns drop into <a href=\"MC_0593_Joint_Use_Cases.html\">MC 0593</a>, <a href=\"MC_0640_Land_Use_Cases.html\">MC 0640</a>, <a href=\"MC_0195_Maritime_Use_Cases.html\">MC 0195</a> and <a href=\"MC_0655_Air_Use_Cases.html\">MC 0655</a> at their contested edges.</li>\n    </ul>"}]}}}}</script>

/* collections rendered in the domain workspace, in order */
