ned with graceful degradation (REQ M-3)"},{"ucId":"UC-M-004","goal":"Coordinate tactical operations across the force","trigger":"Operations phase or contact requiring tasking","preconditions":"Tactical data links and voice up · control measures current · crypto active","postconditions":"Synchronised operations executed under EMCON (REQ M-4)"},{"ucId":"UC-M-005","goal":"Coordinate air and missile defence engagement","trigger":"Air threat detected; engagement decision required","preconditions":"Fire-control net up · air picture available · engagement authority defined","postconditions":"Threat engaged or handed off; deconfliction maintained (REQ M-5)"},{"ucId":"UC-M-006","goal":"Execute fires / strike coordination from sensor to delivery","trigger":"Target detected; effect requested","preconditions":"Fires net up · target validated · airspace deconflicted","postconditions":"Effect delivered on time and on target; reported (REQ M-6)"},{"ucId":"UC-M-007","goal":"Task ISTAR and EW assets and fuse their reporting","trigger":"Collection requirement or EW effect requested","preconditions":"Tasking net up · sensor feeds available · STANAG 4774 labels applied","postconditions":"Tasking executed; reporting fed to the picture and the fires cycle (REQ M-7)"},{"ucId":"UC-M-008","goal":"Coordinate specialised operations and force protection","trigger":"Specialised task or suppression/barrier required","preconditions":"Specialised net up · plans current · need-to-know enforced","postconditions":"Specialised effect achieved; the force is protected (REQ M-8)"},{"ucId":"UC-M-009","goal":"Coordinate recovery and personnel / casualty evacuation","trigger":"Casualty or isolated-personnel event","preconditions":"Recovery net up · assets available · medical / PR releasability set","postconditions":"Personnel recovered or casualty evacuated within the timeline (REQ M-9)"},{"ucId":"UC-M-010","goal":"Report the logistics situation and coordinate sustainment","trigger":"Reporting cycle or supply shortage event","preconditions":"Logistics reporting up · resilient to denial · LOGREP service up","postconditions":"Sustainment picture current; demands actioned (REQ M-10)"},{"ucId":"UC-M-011","goal":"Disseminate platform ISR sensor feeds and reports","trigger":"ISR sortie or collection request active","preconditions":"Sensor feed up · downlink available · collection plan current","postconditions":"ISR products disseminated; collection requirements answered (REQ M-11)"},{"ucId":"UC-M-012","goal":"Integrate with Joint and mission partners across domains","trigger":"Cross-domain effect required","preconditions":"CDS up · FMN gateway federated · STANAG 4774 releasability labels applied","postconditions":"Cross-domain exchange completed across the security boundary (REQ M-12)"}],"echelons":[{"lbl":"Maritime Component — MCC","tier":"H","desc":"Maritime Component Command (afloat or ashore) · RMP custodian, formal messaging, MSA — top of MC 0195/13"},{"lbl":"Task Force / Group — CTF / CTG · PWC","tier":"H","desc":"Commander Task Force/Group and warfare commanders (ASUWC/ASWC · AAWC) · tactical coordination and data links"},{"lbl":"Platform / Unit — PSC · SS · MCM · MPA · MH","tier":"M","desc":"Ships, submarines, MCM vessels and maritime air executing assigned functions (ASUW/ASW · AAW · STRIKE · ISR · logistics)"},{"lbl":"Joint capstone — JFC (MC 0593)","tier":"H","desc":"Upstream joint direction and joint COP · realised by MC 0593","upstream":true},{"lbl":"Air tactical (MC 0655)","tier":"M","desc":"Maritime-air integration boundary (RAP / ACO) · realised by MC 0655","upstream":true},{"lbl":"Land tactical (MC 0640)","tier":"M","desc":"Amphibious / NGFS integration boundary · realised by MC 0640","upstream":true}],"scenarios":[{"code":"MAR-MN","name":"Maritime Vigilance — Standing Mission Network","phase":"Standing / multi-JOA","note":"Standing maritime Mission Network enabling warfighting C2 across SACEUR’s maritime AOR from peacetime through crisis to conflict; common infrastructure and a single maritime information domain for the Regional Plans."},{"code":"MAR-S1","name":"Peacetime — maritime presence and MSA","phase":"COPD v3 · Phase 4","note":"Baseline maritime situational awareness, White Shipping (NCAGS) and Recognized Maritime Picture compilation."},{"code":"MAR-S2","name":"Crisis Response — Major Joint Operation (NCS MCC)","phase":"COPD v3 · Phase 4-5","note":"Crisis Response Operation, Major Joint Operation; NATO Command Structure Maritime Component Command stood up."},{"code":"MAR-S3","name":"Crisis Response — Smaller Joint Operation (maritime task group)","phase":"COPD v3 · Phase 5","note":"Smaller Joint Operation conducted by a maritime task group (CTF/CTG) with a Principal Warfare Commander construct."},{"code":"MAR-S4","name":"Collective Defence — high-end maritime warfighting","phase":"COPD v3 · Phase 6","note":"Article 5 collective defence; high-intensity multi-warfare operations (ASuW / ASW / AAW) under peer threat."},{"code":"MAR-ASW","name":"Anti-Surface / Anti-Submarine Warfare operations","phase":"Warfare coordination","note":"The Principal Warfare Commander coordinates surface and sub-surface warfare across the task group over tactical data links and secure voice."},{"code":"MAR-AMPH","name":"Amphibious operations (CATF / CLF)","phase":"Joint integration","note":"Amphibious task force and landing force C2 across the ship-to-objective manoeuvre."},{"code":"MAR-MIO","name":"Maritime Interdiction / Embargo operations","phase":"Crisis response","note":"Maritime interdiction, boarding and embargo enforcement with mission-partner and non-NATO coordination."},{"code":"C2D2E-EW","name":"Contested EMS — active C2D2E / electromagnetic warfare","phase":"Enemy confrontation (hostile environment)","note":"Whenever the environment is hostile with the adversary present, an active C2D2E electromagnetic-warfare scenario applies to the Maritime domain: the enemy saturates the spectrum so that GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time / eLORAN where available), AI-managed Fast Frequency Hopping and Dynamic Spectrum Access, disruption-tolerant networking and strict EMCON. This scenario underlies every hostile (TC03 = Hostile) Use Case in the domain."}],"tdlLinks":[{"name":"Link 11","arch":"Netted for Broadcast — ATDLP-5.11 (STANAG 5511)","community":"Maritime and Air C2","employment":"Widely fitted to support real-time track-data exchange for picture compilation and C2 direction.","sop":"ATDLP-7.33 (study draft)"},{"name":"Link 11B","arch":"Point-to-Point — ATDLP-5.11 (STANAG 5511)","community":"Shore-Based Air Defence","employment":"Tactical information exchange between shore-based weapons, surveillance and C2 systems.","sop":"ATDLP-7.33"},{"name":"Link 16","arch":"Broadcast TDMA — ATDLP-5.16 (STANAG 5516)","community":"Joint Air Defence","employment":"High-capacity digital data link with Electronic Protective Measures (EPM) for a multi-warfare environment: air, surface, subsurface, land, space and BMD.","sop":"ATDLP-7.33"},{"name":"Link 16 / JREAP","arch":"JREAP Satellite/Serial/IP — ATDLP-5.18 (STANAG 5518)","community":"Joint BLOS / Static Air Defence Sites","employment":"Extends range-limited tactical networks to Beyond-Line-of-Sight (BLOS) and reduces dependence on relay platforms.","sop":"ATDLP-7.33"},{"name":"Link 22","arch":"Broadcast / Dynamic TDMA (NILE)","community":"Maritime and Air C2","employment":"Latest NATO digital data link for ships, submarines, aircraft and shore sites; LOS (UHF) + BLOS (HF); complements Link 16 with shared messages/data elements.","sop":"ATDLP-7.33"}],"cisServices":[],"narratives":[{"id":"N-M-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Maritime Use Cases</strong> for <strong>MC 0195/13</strong>, the most mature IER domain in the NATO CIS family and the trend-setter for Maritime and Air. The Use Cases span the <em>Maritime Component Command</em> (MCC), the <em>Task Force / Task Group</em> (CTF/CTG · PWC · AAWC) and the <em>platform / unit</em> tier (Principal Surface Combatants, submarines, MCM vessels, Maritime Patrol Aircraft and helicopters) with their assigned functions (ASUW/ASW · AAW · STRIKE/NGFS · ISR · logistics).</p>\n    <p>Each Use Case is a <strong>Requirement (REQ)</strong> fulfilled by a stack of <strong>Capability Elements (CapElem)</strong> per <strong>APP-15</strong> and the <strong>C3 Taxonomy Baseline 7.0</strong>, generated as a <strong>NAF v4.1</strong> view. Track identity follows <strong>STANAG 4162</strong> (Unknown · Assumed Friend · Friend · Neutral · Hostile); formal messages and tracks use <strong>APP-11(E)</strong> MTF in place of the ageing OTH-T GOLD. The 14-row body is structured against the Technical Constraints <strong>TC01–TC11</strong> (§8.4).</p>\n    <div>\n      <div><h3>Scope</h3><p>Afloat C2 (MCC · CTF/CTG · PWC/AAWC), platforms (PSC · CV · SS · MCM · AA · LL) and air units (MPA · MH), with their warfare and support functions — the realistic minimum CIS fit to meet the MCR.</p></div>\n      <div><h3>Method</h3><p>AJP-6 supplies the IER; APP-15 + the CapElem model (A.B.NNN) the management; NAF v4.1 the views; the C3 Taxonomy Baseline 7.0 the service classification. Figures of Merit and KPIs are defined per REQ family (§8.3).</p></div>\n      <div><h3>Realisation</h3><p>HF (BRASS) and SATCOM bearers, Link 11/16/22 (NILE) tactical data links, Maritime Rear Link, secure voice (SCIP/STACIS), and maritime C2 (MCCIS / NIRIS) — with CDS and STANAG 4774/4778 labels at every boundary.</p></div>\n    </div>"},{"id":"N-M-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Maritime</strong> domain (canonical source: <strong>MC 0195/13</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.1</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Maritime CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Maritime information exchanges between the entities of this directive (MCC · CTF/CTG · Platform); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Maritime IER inventory across the MCC · CTF/CTG · Platform tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0195/13 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (MCC · CTF/CTG · Platform).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0195/13</strong> — Maritime directive — the most mature IER domain</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.1 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-M-conclusions","order":30,"section":"Findings and Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>MC 0195/13</strong> model — IER &rarr; REQ &rarr; CapElem stack, with Figures of Merit and KPIs — under <strong>AJP-6</strong>, <strong>APP-15</strong> and <strong>NAF v4.1</strong>, producing 12 Maritime Use Cases across the MCC, CTF/CTG and platform tiers. As the most mature IER domain, MC 0195/13 sets the conventions the Air and Joint siblings inherit.</p>\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Tier coverage</h3><p><strong>MCC</strong> (3 — formal messaging C2D2E, RMP, MSA/White Shipping), <strong>CTF/CTG</strong> (6 — ASUW/ASW, AAW, NGFS, submarine broadcast, MCM, amphibious), <strong>Platform</strong> (3 — RAS/logistics, MPA/MH/RPAS ISR, cross-domain to Joint/Air).</p></div>\n      <div><h3>Service coverage</h3><p>Exercises Military Messaging, Recognized Maritime Picture, Situation Awareness, Maritime warfare, Targeting, Logistics and JISR services — each resolved to a CapElem stack (§9 cards / §10 catalogue).</p></div>\n      <div><h3>Identity &amp; threat coverage</h3><p>Row-9 exercises the full STANAG 4162 set — including <em>Assumed Friend</em> (UC-011 ISR). Track exchange uses APP-11(E), retiring OTH-T GOLD.</p></div>\n    </div>\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>The CapElem model originates here.</strong> MC 0195/13 expresses every IER as a REQ + CapElem stack (A.B.NNN) — the convention extrapolated to the whole family.</li>\n      <li><strong>APP-11(E) replaces OTH-T GOLD.</strong> Machine-processable tracks (XML / ADatP-3) supersede the ageing format across the RMP and AAW UCs.</li>\n      <li><strong>Identity discipline (STANAG 4162).</strong> RMP, AAW and ISR depend on rigorous identity, including the Assumed-Friend state pending positive identification.</li>\n      <li><strong>C2D2E is the design driver.</strong> The HF/BRASS + MRL + submarine-broadcast UCs assume denied/degraded conditions and emission control.</li>\n    </ul>\n    <h2>11.3 — Open work &amp; the legacy tool</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are <code>DRAFT v0.1</code>; ratification by MARCOM and the FMN community of interest is required.</li>\n      <li><strong>NISP B16 nomenclature:</strong> profiles are cited by exact catalogue identifier where verified, else by Service Area + Spiral; canonical source <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16</a>. FMN Spiral 5 implemented; Spiral 6 anticipatory.</li>\n      <li><strong>Legacy tool:</strong> the earlier UC&times;Serial matrix application is preserved as <code>MC_0195_Maritime_Use_Cases_legacy.html</code>; this document supersedes it with the modern CapElem / TC framework.</li>\n    </ul>"}]}},"A":{"code":"A","name":"Air","mc":"MC 0655 / 0695","reqPrefix":"A","collections":{"useCases":[{"id":"UC-A-001","serial":"A-1","band":"Air Ops Centre — JFAC / CAOC","title":"Air Tasking Order production and formal messaging in C2D2E","sub":"The Joint Force Air Component produces and disseminates the Air Tasking Order and exchanges formal messaging with units while degraded.","cls":"NS","prec":"Immediate","env":"HO","lpi":3,"avail":"High (24/7)","timeWindow":"ATO cycle; RTA minutes","zones":"JOA · Air C2 CoI","ier":{"who":"JFAC / CAOC and D · ISR","title":"Space / SATCOM / PNT enabler and cross-domain integration","sub":"Space, SATCOM and PNT enabling services and cross-domain integration with Joint, Land and Maritime, resilient to denial.","cls":"MS","prec":"Immediate","env":"UNK","lpi":4,"avail":"High (24/7)","timeWindow":"Continuous; event-driven","zones":"JOA · multinational CoI","ier":{"who":"Air liaison and space/SATCOM and Land and Maritime and partners","what":"SATCOM / PNT services and cross-domain federated exchange via CDS","when":"Continuous and event-driven","protection":"Mission Secret · CDS · STANAG 4774","volume":"Medium · mixed"},"equipment":["SATCOM (Ka / X-band) and PNT (alternative on denial)","Cross-domain track exchange via CDS (Advenica / Fox-IT)","Link 16 / JREAP to land and maritime","FMN federated gateway"],"attackSurface":"SATCOM/PNT and cross-domain gateways are prime targets. Mitigation: alternative PNT, CDS and zero-trust.","c2d2e":"","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1077","CO-1051"],"coi":["CI-1005"],"tc05":"FMN Mission-Network partners (NNN / IO) · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-A-013","serial":"A-13","band":"Air Ops Centre — JFAC / CAOC","title":"C2D2E (DDIL + AI) — resilient C2 and EMCON/LPI-LPD posture · air","sub":"An air component / formation operating against capable ESM and contested datalinks sustains the Recognised Air Picture and Link-16/JREAP connectivity through AI-enabled communications and an AI-managed EMCON / LPI-LPD posture. It folds 4 C2D2E capability threads into one Information-Exchange Use Case:\n• Mission command by intent under denial — An isolated subordinate continues to act within the commander's cached intent and CCIR while reach-back is denied; decisions reconcile automatically when connectivity returns.\n• AI link-quality prediction and proactive bearer/waveform selection — A predictive model forecasts imminent link degradation from telemetry and pre-emptively switches bearer or waveform before the link fails, minimising disruption.\n• AI bandwidth/codec adaptation and semantic compression — AI adapts codec, bandwidth and content fidelity to the available link — using semantic compression so mission-essential meaning survives even when throughput collapses.\n• AI-managed emission control (EMCON) and LPI/LPD posture — AI advises and (within policy) manages emission control and the LPI/LPD posture as the threat picture and mission phase change, minimising the force's electromagnetic signature.","cls":"NS","prec":"Immediate","env":"HO","lpi":5,"avail":"High","timeWindow":"Continuous; phase- and threat-driven","zones":"Contested electromagnetic spectrum · all domains","equipment":["Local-first cache of commander's intent, CCIR and pre-agreed delegations","Decision journal that reconciles with higher HQ on reconnection","DTN sync of the decision log","Anticipatory (FMN Spiral 6)","AI time-series link-quality predictor consuming bearer telemetry","Candidate bearer/waveform set with assurance bounds","Pre-emptive make-before-break switching","AI content-adaptation / semantic-compression engine with agreed fidelity floors","Codec ladder (voice / imagery / FMV) negotiated with consumers","Label preservation across transcoding","AI EMCON advisor mapping threat picture to an LPI/LPD profile","Policy-bounded automatic emitter management with human-on-the-loop","Signature-management feedback from the EMS picture","Anticipatory (FMN Spiral 6) · doctrine per AJP-3.6"],"attackSurface":"Stale or forged intent could mis-direct an isolated unit. Mitigation: signed, time-bounded intent packages, explicit delegation limits, and reconciliation review on reconnection. Telemetry poisoning could trigger needless or harmful switches. Mitigation: authenticated telemetry, conservative switch thresholds, and audit of every pre-emptive action. Over-aggressive compression can drop safety-critical detail. Mitigation: enforced fidelity floors per product class and human-defined essential-elements that are never dropped. An adversary may try to provoke emissions to fingerprint the force. Mitigation: conservative EMCON defaults, human authority for posture relaxation, and decoy/randomised emission management. Under active C2D2E electromagnetic warfare the adversary saturates the spectrum: GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time), AI-managed frequency hopping and dynamic spectrum access, disruption-tolerant networking and strict EMCON.","ier":{"who":"EMCON AI advisor ↔ commander (human-on-the-loop) ↔ emitting systems","what":"Aggregates 4 C2D2E capability threads for operating under DDIL conditions with AI-enabled communications: Mission command by intent under denial; AI link-quality prediction and proactive bearer/waveform selection; AI bandwidth/codec adaptation and semantic compression; AI-managed emission control (EMCON) and LPI/LPD posture.","when":"Event-driven on threat/phase change","protection":"NATO Secret · signed EMCON policy · STANAG 4774 labels","volume":"Low · posture directives"},"c2d2e":"C2D2E (DDIL + AI)","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1051","CO-1057"],"coi":["CI-1005"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]}],"capElem":[{"id":"R.I.101","cap":"Domain Situational Awareness — Recognized Air Picture (RAP)","fmn":"FMN Spiral 4 · SPO MSA","kpi":"TPPS · ADC","nisp":"Illustrative ID — mapped to a validated C3 Taxonomy B7 branch (see C3 node); not a NISP B16 identifier","c3node":"C3-INFO"},{"id":"R.I.102","cap":"Targeting / Fires Support","fmn":"FMN Spiral 5","kpi":"DPD · ADC","nisp":"Illustrative ID — mapped to a validated C3 Taxonomy B7 branch (see C3 node) ed operations and force protection","trigger":"Specialised task or suppression/barrier required","preconditions":"Specialised net up · plans current · need-to-know enforced","postconditions":"Specialised effect achieved; the force is protected (REQ A-8)"},{"ucId":"UC-A-009","goal":"Coordinate recovery and personnel / casualty evacuation","trigger":"Casualty or isolated-personnel event","preconditions":"Recovery net up · assets available · medical / PR releasability set","postconditions":"Personnel recovered or casualty evacuated within the timeline (REQ A-9)"},{"ucId":"UC-A-010","goal":"Report the logistics situation and coordinate sustainment","trigger":"Reporting cycle or supply shortage event","preconditions":"Logistics reporting up · resilient to denial · LOGREP service up","postconditions":"Sustainment picture current; demands actioned (REQ A-10)"},{"ucId":"UC-A-011","goal":"Disseminate platform ISR sensor feeds and reports","trigger":"ISR sortie or collection request active","preconditions":"Sensor feed up · downlink available · collection plan current","postconditions":"ISR products disseminated; collection requirements answered (REQ A-11)"},{"ucId":"UC-A-012","goal":"Integrate with Joint and mission partners across domains","trigger":"Cross-domain effect required","preconditions":"CDS up · FMN gateway federated · STANAG 4774 releasability labels applied","postconditions":"Cross-domain exchange completed across the security boundary (REQ A-12)"}],"echelons":[{"lbl":"Air Ops Centre — JFAC / CAOC","tier":"H","desc":"Operational air C2 · ATO/ACO production, Recognized Air Picture custodian — core of MC 0655"},{"lbl":"Tactical control — CRC / ASOC / AEW and C","tier":"H","desc":"Real-time control of air assets · RAP feed, intercept and engagement control, dynamic tasking"},{"lbl":"Platform / unit — Wing · GBAD · ISR","tier":"M","desc":"Execution: fighters, ground-based air defence, ISR/RPAS, IFF sensors, tankers"},{"lbl":"Joint capstone — JFC (MC 0593)","tier":"H","desc":"Upstream joint direction and joint COP · realised by MC 0593","upstream":true},{"lbl":"Land tactical (CAS · MC 0640)","tier":"M","desc":"Air-land integration boundary (Close Air Support) · realised by MC 0640","upstream":true},{"lbl":"Maritime tactical (MC 0195)","tier":"M","desc":"Maritime-air integration boundary · realised by MC 0195","upstream":true},{"lbl":"JFACC","tier":"H","desc":"Joint Force Air Component Command — theatre air C2 authority.","upstream":false},{"lbl":"CAOC (BCE)","tier":"H","desc":"Combined Air Operations Centre — hosts the Battlefield Coordination Element.","upstream":false},{"lbl":"Airbase (GLO)","tier":"M","desc":"Air base / wing — Ground Liaison Officer interface to land forces.","upstream":false},{"lbl":"Squadron (GLO)","tier":"L","desc":"Flying squadron — Ground Liaison Officer at the tactical edge.","upstream":false}],"scenarios":[{"code":"VeVA-MN","name":"Vigilance Activities Mission Network (VeVA MN)","phase":"Standing / multi-JOA","note":"Standing multi-JOA Mission Network enabling warfighting C2 in SACEUR’s AOR, underlying readiness to execute the DDA FoP from peacetime through crisis to conflict. Supports HQ/units of the Regional Plans (NCS, NFS, NHDF) on a common infrastructure and single mission information domain."},{"code":"AIR-S1","name":"Peacetime","phase":"COPD v3 · Phase 4","note":"General Air C2 setup; baseline Air-to-Air picture compilation."},{"code":"AIR-S2","name":"CRO MJO setup and activities with initiation of NCS JFAC","phase":"COPD v3 · Phase 4–5","note":"Crisis Response Operation, Major Joint Operation; NATO Command Structure Joint Force Air Component stood up."},{"code":"AIR-S3","name":"CRO SJO activities with NCS JFAC and a small DCDR-Air SE initiated","phase":"COPD v3 · Phase 5","note":"Smaller Joint Operation; small Deployable Component Command Air Supporting Establishment."},{"code":"AIR-S4","name":"CRO SJO activities with NCS JFAC and a larger DCDR-Air SE having CPD","phase":"COPD v3 · Phase 5–6","note":"Larger DCDR-Air SE with a Collocated Planning Detachment (CPD)."},{"code":"AIR-ASR","name":"Air Support Request (Air-Land)","phase":"Air-Land integration","note":"4.3.1 — request for air support from a land force."},{"code":"AIR-CAS","name":"Close Air Support (Air-Land)","phase":"Air-Land integration","note":"4.3.2 — air action against hostile targets in close proximity to friendly forces."},{"code":"AIR-AI","name":"Air Interdiction (Air-Land)","phase":"Air-Land integration","note":"4.3.3 — air operations to delay/disrupt/destroy enemy potential before it is brought to bear."},{"code":"C2D2E-EW","name":"Contested EMS — active C2D2E / electromagnetic warfare","phase":"Enemy confrontation (hostile environment)","note":"Whenever the environment is hostile with the adversary present, an active C2D2E electromagnetic-warfare scenario applies to the Air domain: the enemy saturates the spectrum so that GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time / eLORAN where available), AI-managed Fast Frequency Hopping and Dynamic Spectrum Access, disruption-tolerant networking and strict EMCON. This scenario underlies every hostile (TC03 = Hostile) Use Case in the domain."}],"tdlLinks":[{"name":"Link 11","arch":"Netted for Broadcast — ATDLP-5.11 (STANAG 5511)","community":"Maritime and Air C2","employment":"Widely fitted to support real-time track-data exchange for picture compilation and C2 direction.","sop":"ATDLP-7.33 (study draft)"},{"name":"Link 11B","arch":"Point-to-Point — ATDLP-5.11 (STANAG 5511)","community":"Shore-Based Air Defence","employment":"Tactical information exchange between shore-based weapons, surveillance and C2 systems.","sop":"ATDLP-7.33"},{"name":"Link 16","arch":"Broadcast TDMA — ATDLP-5.16 (STANAG 5516)","community":"Joint Air Defence","employment":"High-capacity digital data link with Electronic Protective Measures (EPM) for a multi-warfare environment: air, surface, subsurface, land, space and BMD.","sop":"ATDLP-7.33"},{"name":"Link 16 / JREAP","arch":"JREAP Satellite/Serial/IP — ATDLP-5.18 (STANAG 5518)","community":"Joint BLOS / Static Air Defence Sites","employment":"Extends range-limited tactical networks to Beyond-Line-of-Sight (BLOS) and reduces dependence on relay platforms.","sop":"ATDLP-7.33"},{"name":"Link 22","arch":"Broadcast / Dynamic TDMA (NILE)","community":"Maritime and Air C2","employment":"Latest NATO digital data link for ships, submarines, aircraft and shore sites; LOS (UHF) + BLOS (HF); complements Link 16 with shared messages/data elements.","sop":"ATDLP-7.33"}],"cisServices":[{"code":"CIS-a","name":"Secure Voice","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-b","name":"Secure VTC","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-c","name":"Air Command and Control Information Services (AirC2IS) Portal","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-d","name":"Secure e-mail","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-e","name":"J-CHAT","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-f","name":"Recognized Air Picture (RAP)","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-g","name":"LOGFAS","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."},{"code":"CIS-h","name":"Secure Data","note":"Basic CIS connectivity element enabling NATO forces to communicate effectively (MC 0695 Air)."}],"narratives":[{"id":"N-A-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents <strong>12 Air-tactical Use Cases</strong> for <strong>MC 0655</strong>, the directive that specifies the minimum CIS capabilities at the Air tactical level. The Use Cases span the <em>Air Operations Centre</em> (JFAC / CAOC), <em>tactical control</em> (CRC / ASOC / AEW&amp;C) and the <em>platform / unit</em> tier (fighters, ground-based air defence, ISR/RPAS, IFF sensors). Each Use Case is an <strong>Information Exchange Requirement (IER)</strong> per <strong>AJP-6</strong>, managed under <strong>APP-15</strong>, generated as a <strong>NAF v4.1</strong> view, and tagged against the <strong>NATO C3 Taxonomy Baseline 7.0</strong>.</p>\n    <p>Every UC card carries two parts: a <em>NAF v4.1 / APP-15 Specification Header</em> and a <em>14-row Operational Body</em> (the six AJP-6 IER dimensions plus bearer/equipment, time window, environment, zones, availability, classification, an LPI/LPD risk meter and an attack-surface note). Row 9 (Environment) uses the <strong>APP-06 / STANAG 5516</strong> entity-identity model — Friendly · Hostile · Neutral · Unknown — which is central to air operations.</p>\n    <div>\n      <div><h3>Scope</h3><p>Air tactical: the air-picture, tasking and control exchanges between the CAOC, the control agencies (CRC / ASOC / AEW&amp;C) and the executing platforms — plus the Space / SATCOM / PNT enablers under AJP-3.3.</p></div>\n      <div><h3>Method</h3><p>AJP-6 supplies the IER definition; APP-15 the management discipline; NAF v4.1 the NOV/NSOV views; the C3 Taxonomy Baseline 7.0 the service classification (Air Services, Recognized Air Picture, Airspace Management) used in every card.</p></div>\n      <div><h3>Realisation</h3><p>Tactical data links (Link 16 / STANAG 5516, Link 22, JREAP-C / STANAG 5518) for the air picture; Mode 5 IFF (STANAG 4193) for identity; FMN core services over PCN (STANAG 4711) with STANAG 4774/4778 labels for the planning and tasking flows.</p></div>\n    </div>"},{"id":"N-A-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Air</strong> domain (canonical source: <strong>MC 0655</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.3</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Air CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Air information exchanges between the entities of this directive (CAOC · Control · Platform); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Air IER inventory across the CAOC · Control · Platform tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0655 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (CAOC · Control · Platform).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0655</strong> — Air tactical directive (+ Space enablers via AJP-3.3)</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.3 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-A-conclusions","order":30,"section":"Findings and Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report applies the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> management and the <strong>NAF v4.1</strong> viewpoints to <strong>MC 0655</strong>, producing 12 Air Use Cases across the CAOC, tactical-control and platform tiers. Each carries the APP-15 specification header, the 14-row body with the APP-06 / STANAG 5516 entity-identity model in row 9, and a C3 Taxonomy Baseline 7.0 classification consistent with the Joint, Land and Maritime siblings.</p>\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Tier coverage</h3><p><strong>CAOC</strong> (3 — ATO, ACO/airspace, RAP), <strong>Control</strong> (6 — tactical control, AEW&amp;C feed, air defence, dynamic targeting, CSAR, AAR), <strong>Platform / cross-domain</strong> (3 — digitally-aided CAS, ISR/RPAS FMV, Space/SATCOM/PNT).</p></div>\n      <div><h3>Service coverage (C3 Taxonomy B7.0)</h3><p>Exercises <em>Air Tasking Order</em>, <em>Airspace Management</em>, <em>Recognized Air Picture</em>, <em>Track</em>, <em>Targeting</em>, <em>JISR</em>, <em>Audio/Video Collaboration</em>, and <em>Communications &amp; PNT</em> services.</p></div>\n      <div><h3>Identity &amp; threat coverage</h3><p>Row-9 identity exercises all four APP-06 / STANAG 5516 categories — Unknown and Neutral feature strongly in the air picture. Risk meter spans 2/5 to 4/5; the §5 constraint blocks map onto every bearer and attack-surface row.</p></div>\n    </div>\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>Entity identity is the defining air-domain control.</strong> The RAP (UC-003), air defence (UC-006) and CAS (UC-010) all hinge on Mode 5 IFF (STANAG 4193) and STANAG 5516 identity rules to keep Friendly / Hostile / Neutral / Unknown correct and avoid fratricide.</li>\n      <li><strong>Tactical data links are the air bearer.</strong> Link 16 (STANAG 5516), JREAP-C (STANAG 5518) and Link 22 (STANAG 5522) carry the picture and control; planning/tasking ride the FMN core over PCN.</li>\n      <li><strong>Air–land integration crosses a directive boundary.</strong> Digitally-aided CAS (UC-010) is the explicit hand-off to the <a href=\"MC_0640_Land_Use_Cases.html\">MC 0640</a> land force.</li>\n      <li><strong>Space / SATCOM / PNT resilience is foundational.</strong> UC-012 treats GNSS denial as an Unknown-attribution event and mandates anti-jam SATCOM, M-code GPS and alternate PNT per AJP-3.3.</li>\n    </ul>\n    <h2>11.3 — Open work, NISP B16 nomenclature &amp; FMN Spiral 6</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are <code>DRAFT v0.1</code>; ratification by AIRCOM / JFAC and the FMN community of interest is required before any UC moves to <code>APPROVED</code>.</li>\n      <li><strong>NISP B16 nomenclature:</strong> profiles are cited by exact catalogue identifier where verified, otherwise by Service Area + title + Spiral; the canonical source is <a href=\"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf\" target=\"_blank\" rel=\"noopener\">NISP Baseline 16 / AC/322-D(2024)0053</a>.</li>\n      <li><strong>FMN Spiral alignment:</strong> the UCs realise <strong>FMN Spiral 5</strong> services. <strong>FMN Spiral 6</strong> carries the not-yet-implemented novelties — AI-assisted RAP fusion, cognitive EW, and the C2D2E / DDIL resilience set treated in the linked <a href=\"MC_0XXX_C2D2E_Use_Cases.html\">C2D2E</a> document. Treat Spiral-6 wording as <em>anticipatory</em>.</li>\n    </ul>"}]}}}}</script>

const LS_KEY = 'mdo.grc.platform.v16';  /* v16: ?view=document deep-link (PDF export); TC01 definition aligned to C3 Taxonomy C3-COMMS */
let DB = null;
let UI = { domain:null, route:{view:'dashboard'} };

const App = {
  /* ---- persistence ---- */
  persistOK:true,
  load(){
    // probe storage (some browsers disable localStorage on the file:// origin)
    try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); this.persistOK=true; }
    catch(e){ this.persistOK=false; }
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    const seed=JSON.parse($('#seed-db').textContent);
    DB = (saved && saved.schema===seed.schema) ? saved : seed;
    if(!DB.meta) DB.meta={};
    if(DB.meta.classification==null) DB.meta.classification = (DB.global.classifications[0]||{}).code||'NU';
    this.migrateIds();
    UI.domain = UI.domain || Object.keys(DB.domains)[0];
    if(this.syncJsonLd) this.syncJsonLd();
    if(this.syncPrintHeader) this.syncPrintHeader();
    if(!this.persistOK) setTimeout(()=>toast('This browser blocks storage on file:// — edits stay in memory; use Export to save. (Tip: open via a local server to persist.)','info'),400);
  },
  defaultTC05(cls){ return cls==='MS'?'FMN Mission-Network partners (NNN / IO) · FMN Spiral 5':(cls==='NS'?'NATO; selected partners via CDS · FMN Spiral 5':'NATO + Mission Partners · FMN Spiral 5'); },
  defaultClimate(code){ const base=['A1','A2','A3','B1','B2','B3','C0','C1','C2','C3','C4']; return code==='M'?base.concat(['M1','M2','M3']):base; },
  COI_BY_DOMAIN:{J:'CI-1061',A:'CI-1005',M:'CI-1067',L:'CI-1062',S:'CI-1112',C:'CI-1029',T:'CI-1021',X:'CI-1061'},
  TRACK_MAP:{hostile:'HO',unknown:'UNK',friend:'FR',friendly:'FR','assumed friend':'AF',neutral:'N',permissive:'FR',contested:'UNK',denied:'HO',unk:'UNK',af:'AF',fr:'FR',n:'N',ho:'HO'},
  toTrackId(v){ if(!v)return ''; const codes=['UNK','AF','FR','N','HO']; if(codes.includes(v))return v; return this.TRACK_MAP[String(v).toLowerCase()]||'UNK'; },
  commsFor(equipment){
    const t=(equipment||[]).join(' ').toLowerCase(); const mob=/vehicular|manpack|man-portable|backpack|dismounted|mobile|handheld|on-the-move/.test(t);
    const out=new Set();
    if(/satcom|ka-band|ka band|x-band|x band|\bhf\b|blos|beyond line|brass/.test(t)) out.add(mob?'CO-1074':'CO-1077');
    if(/\blos\b|line-of-sight|line of sight|\buhf\b|\bvhf\b|\bshf\b|nbwf|essor|saturn|marlos|varc|wideband/.test(t)) out.add(mob?'CO-1080':'CO-1083');
    if(/fibre|fiber|wired|cable|ethernet|copper/.test(t)) out.add('CO-1071');
    if(/optical|laser|free-space|\bfso\b/.test(t)) out.add('CO-1086');
    if(/encrypt|crypto|\bcds\b|melpe key|security gateway|ipsec|\btls\b|\bpki\b|stanag 4774|label/.test(t)) out.add('CO-1051');
    if(/\bsmc\b|service management|network management|spectrum|emcon|\bqos\b/.test(t)) out.add('CO-1057');
    if(!out.size) out.add('CO-1080');
    return [...out];
  },
  /* idempotent: rename ids, remap refs, normalise TC03/TC04-CoI/TC05/TC10 */
  migrateIds(){
    let changed=false;
    Object.entries(DB.domains).forEach(([code,d])=>{
      const c=d.collections||{}; const px=d.reqPrefix||code; const map={};
      (c.useCases||[]).forEach(u=>{
        if(/^UC-\d/.test(u.id||'')){ const nid='UC-'+px+'-'+u.id.slice(3); map[u.id]=nid; u.id=nid; changed=true; }
        if(!Array.isArray(u.commsSvc)){ u.commsSvc=this.commsFor(u.equipment); changed=true; }        // TC01 CO-… services
        const t=this.toTrackId(u.env); if(t!==u.env){ u.env=t; changed=true; }                      // TC03 → STANAG 4162
        if(!Array.isArray(u.coi)){ u.coi=[this.COI_BY_DOMAIN[code]||'CI-1061']; changed=true; }       // TC04 CoI
        if(u.tc05==null||u.tc05===''){ u.tc05=this.defaultTC05(u.cls); changed=true; }                 // TC05
        if(u.c2d2e==null){ u.c2d2e=''; changed=true; }                                                  // transversal C2D2E tag
        if(!Array.isArray(u.climate)){ u.climate=this.defaultClimate(code); changed=true; }            // TC10 → category array
      });
      if(!Object.keys(map).length) return;
      (c.vendors||[]).forEach(v=>{ if(map[v.uc]) v.uc=map[v.uc]; });
      (c.nafOverrides||[]).forEach(n=>{ if(map[n.ucId]) n.ucId=map[n.ucId]; });
    });
    // backfill / re-map C3 Taxonomy links to the concrete sub-branches
    const hasTax = code => (DB.global.c3Taxonomy||[]).some(b=>b.code===code);
    if(hasTax('C3-COMMS-TX')) (DB.global.commsServices||[]).forEach(s=>{ if(s.taxonomy==null||s.taxonomy==='C3-COMMS'){ s.taxonomy='C3-COMMS-TX'; changed=true; } });
    if(hasTax('C3-COI-SPEC')) (DB.global.c3Services||[]).forEach(s=>{ if(s.taxonomy==null||s.taxonomy==='C3-COI'){ s.taxonomy=(s.code==='CI-1021'?'C3-COI-ENAB':'C3-COI-SPEC'); changed=true; } });
    if(changed) this.save();
  },
  save(){ try{ if(this.persistOK) localStorage.setItem(LS_KEY,JSON.stringify(DB)); }catch(e){ toast('localStorage full — export to a file instead','err'); } if(this.syncJsonLd) this.syncJsonLd(); },
  resetAll(){ if(!confirm('Discard all local edits and restore the seeded dataset? Export first if unsure.'))return; try{ localStorage.removeItem(LS_KEY); }catch(e){} location.reload(); },

  /* ---- collection access ---- */
  coll(name){
    const sc=SCHEMAS[name];
    if(sc.scope==='global'){ DB.global[name]=DB.global[name]||[]; return DB.global[name]; }
    const d=DB.domains[UI.domain]; d.collections=d.collections||{}; d.collections[name]=d.collections[name]||[]; return d.collections[name];
  },
  collIn(name,domCode){ const sc=SCHEMAS[name]; if(sc.scope==='global')return DB.global[name]||[]; return ((DB.domains[domCode]||{}).collections||{})[name]||[]; },

  /* ---- classification banner ---- */
  setClassification(code){ DB.meta.classification=code; this.save(); this.paintBanner(); if(this.syncPrintHeader)this.syncPrintHeader(); },
  paintBanner(){
    const sel=$('#clsSel'); sel.innerHTML=DB.global.classifications.map(c=>`<option value="${esc(c.code)}" ${c.code===DB.meta.classification?'selected':''}>${esc(c.code)} — ${esc(c.name)}</option>`).join('');
    const c=DB.global.classifications.find(x=>x.code===DB.meta.classification)||{name:'NATO Unclassified',border:'#16a34a'};
    $('#clsLabel').textContent=('NATO '+c.name).toUpperCase().replace('NATO NATO','NATO');
    document.querySelectorAll('.cls-banner').forEach(b=>b.style.background=c.border||'#16a34a');
  },

  /* ---- routing ---- */
  go(route){ UI.route=route; if(window.innerWidth<=880) document.querySelector('aside.side').classList.remove('open'); this.render(); },
  switchDomain(code){ UI.domain=code; UI.route={view:'collection',collection:'useCases',scope:'domain'}; this.render(); },

  render(){ if(this.recordHist) this.recordHist(); this.paintBanner(); this.renderSwitch(); this.renderNav(); this.renderMain(); if(this.decorateAcronyms) this.decorateAcronyms(); },

  renderSwitch(){
    $('#domSwitch').innerHTML = Object.values(DB.domains).map(d=>
      `<button class="dom-pill ${d.code===UI.domain?'active':''}" title="${esc(d.name)} · ${esc(d.mc)}" onclick="App.switchDomain('${d.code}')">${esc(d.code)} · ${esc(d.name)}</button>`).join('');
  },

  renderNav(){
    const r=UI.route, dom=DB.domains[UI.domain];
    const item=(active,onclick,icon,label,count)=>`<a class="${active?'active':''}" onclick="${onclick}"><span>${icon}</span><span>${esc(label)}</span>${count!=null?`<span class="ct">${count}</span>`:''}</a>`;
    const rpt=(sec,active)=>r.view==='report'&&r.sec===sec;
    let h='';
    h+=`<div class="grp"><div class="grp-h">Technical Report · ACO / ACT</div><div class="nav">`+
       item(rpt('cover'),"App.go({view:'report',sec:'cover'})",'§','Cover and Document Control')+
       item(rpt('execsum'),"App.go({view:'report',sec:'execsum'})",'★','Executive Summary (BLUF)')+
       item(rpt('intro'),"App.go({view:'report',sec:'intro'})",'①','1 · Introduction')+
       item(rpt('background'),"App.go({view:'report',sec:'background'})",'②','2 · Background')+
       item(rpt('methodology'),"App.go({view:'report',sec:'methodology'})",'③','3 · Methodology and Limitations')+
       item(rpt('framework'),"App.go({view:'report',sec:'framework'})",'④','4 · Use-Case Framework')+
       item(rpt('byDomain'),"App.go({view:'report',sec:'byDomain'})",'⑤','5 · Use Cases by Domain',App.allUseCases().length)+
       item(rpt('findings'),"App.go({view:'report',sec:'findings'})",'⑥','6 · Findings and Recommendations',(DB.global.recommendations||[]).length)+
       item(rpt('rtm'),"App.go({view:'report',sec:'rtm'})",'⑦','7 · Traceability and Compliance')+
       item(rpt('annexes'),"App.go({view:'report',sec:'annexes'})",'⑧','8 · Annexes')+
       item(r.view==='acronyms',"App.go({view:'acronyms'})",'🔤','Acronyms (C3-grouped)',(DB.global.acronyms||[]).length)+
       item(r.view==='document',"App.printReport()",'📄','Full report · Print / PDF')+
       `</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Cross-domain · GRC tools</div><div class="nav">`+
       item(r.view==='dashboard',"App.go({view:'dashboard'})",'▦','GRC Dashboard')+
       item(r.view==='governance',"App.go({view:'governance'})",'⚖','Domains and governance',Object.keys(DB.domains).length)+
       item(r.view==='allUC',"App.go({view:'allUC'})",'▦','All Use Cases · multi-domain',App.allUseCases().length)+
       item(r.view==='ierMatrix',"App.go({view:'ierMatrix'})",'▤','IER Matrix · '+UI.domain)+
       item(r.view==='compliance',"App.go({view:'compliance'})",'✓','Compliance map')+
       item(r.view==='qa',"App.go({view:'qa'})",'✔','QA / completeness')+
       `</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Domain · ${esc(dom.name)}</div><div class="nav">`+
       DOMAIN_COLLECTIONS.map(c=>{ const sc=SCHEMAS[c]; const n=(dom.collections&&dom.collections[c]||[]).length;
         return item(r.view==='collection'&&r.scope==='domain'&&r.collection===c,`App.go({view:'collection',scope:'domain',collection:'${c}'})`,sc.icon,sc.plural,n);
       }).join('')+`</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Global GRC catalogs</div><div class="nav">`+
       GLOBAL_COLLECTIONS.map(c=>{ const sc=SCHEMAS[c]; const n=(DB.global[c]||[]).length;
         return item(r.view==='collection'&&r.scope==='global'&&r.collection===c,`App.go({view:'collection',scope:'global',collection:'${c}'})`,sc.icon,sc.plural,n);
       }).join('')+`</div></div>`;
    h+=`<div class="grp"><div class="grp-h">Data</div><div class="nav">`+
       item(false,"App.exportJSON()",'⭳','Export all (JSON)')+
       item(false,"App.exportJsonLd()",'☍','Export JSON-LD')+
       item(false,"document.getElementById('importFile').click()",'⭱','Import JSON')+
       `</div></div>`;
    $('#nav').innerHTML=h;
  },

  renderMain(){
    const r=UI.route;
    if(r.view==='dashboard') return Views.dashboard();
    if(r.view==='report') return Views.report(r.sec);
    if(r.view==='document') return Views.fullDocument();
    if(r.view==='qa') return Views.qa();
    if(r.view==='taxonomyTree') return Views.taxonomyTree();
    if(r.view==='acronyms') return Views.acronyms();
    if(r.view==='governance') return Views.governance();
    if(r.view==='allUC') return Views.allUC();
    if(r.view==='ierMatrix') return Views.ierMatrix();
    if(r.view==='compliance') return Views.compliance();
    if(r.view==='collection'){
      const wasGlobal = r.scope==='global';
      if(r.recordId!=null) return Views.detail(r.collection,r.scope,r.recordId);
      return Views.list(r.collection,r.scope);
    }

  /* ---- ref resolution / cross-links ---- */
  refTitle(refName,refScope,id){
    const list = refScope==='global'?(DB.global[refName]||[]):this.coll(refName);
    const sc=SCHEMAS[refName]; const rec=list.find(x=>String(x[sc.id])===String(id));
    return rec? (rec[sc.title]!=null?rec[sc.title]:rec[sc.id]) : id;
  },
  refChip(refName,refScope,id){
    if(id==null||id==='') return '<span class="muted">—</span>';
    const sc=SCHEMAS[refName];
    const list = refScope==='global'?(DB.global[refName]||[]):this.coll(refName);
    const rec = list.find(x=>String(x[sc.id])===String(id));
    let extra='';
    if(rec){ const col=rec.text||rec.color; if(col) extra=`style="color:${col};border-color:${rec.border||col};background:${this.tint(col)}"`; }
    const onclick = `App.go({view:'collection',scope:'${refScope}',collection:'${refName}',recordId:'${esc(String(id))}'})`;
    return `<span class="chip link" ${extra} onclick="${onclick}" title="${esc(sc.label)}: ${esc(this.refTitle(refName,refScope,id))}">${esc(id)}</span>`;
  },
  tint(hex){ return (hex||'#888')+'22'; },

  /* ---- CRUD ---- */
  create(coll,scope){ Modal.open(coll,scope,null); },
  edit(coll,scope,id){ Modal.open(coll,scope,id); },
  remove(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]):this.coll(coll);
    const i=list.findIndex(x=>String(x[sc.id])===String(id)); if(i<0)return;
    if(!confirm(`Delete ${sc.label} “${id}”? This cannot be undone (export first to keep a copy).`))return;
    list.splice(i,1); this.save(); toast(`${sc.label} deleted`,'ok'); this.render();
  },
  upsert(coll,scope,orig,rec){
    const sc=SCHEMAS[coll]; const list=scope==='global'?(DB.global[coll]=DB.global[coll]||[]):this.coll(coll);
    if(orig==null){ list.push(rec); } else { const i=list.findIndex(x=>String(x[sc.id])===String(orig)); if(i<0)list.push(rec); else list[i]=rec; }
    this.save();
  },

  /* ---- domain-level CRUD (governance) ---- */
  emptyCollections(){ const o={}; DOMAIN_COLLECTIONS.forEach(c=>o[c]=[]); return o; },
  domainModal(code){
    const d = code!=null ? DB.domains[code] : { code:'', name:'', mc:'', reqPrefix:'', blurb:'' };
    const f=(k,label,hint)=>`<div class="fld wide"><label>${esc(label)}</label><input id="dm_${k}" value="${esc(d[k]||'')}" ${k==='code'&&code!=null?'readonly style="opacity:.6"':''}>${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
    $('#modal').innerHTML=`
      <div class="modal-h"><h3>${code!=null?'Edit':'New'} domain</h3><button class="btn x" onclick="Modal.close()">✕</button></div>
      <div class="modal-b">
        ${f('code','Domain code','One letter/short tag, e.g. L · M · A. Immutable once created.')}
        ${f('name','Domain name','e.g. Land')}
        ${f('mc','Directive / authority','e.g. MC 0640')}
        ${f('reqPrefix','Requirement prefix','Used for REQ ids, e.g. L')}
        <div class="fld wide"><label>Governance note</label><textarea id="dm_blurb">${esc(d.blurb||'')}</textarea></div>
      </div>
      <div class="modal-f"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="App.saveDomain(${code!=null?`'${code}'`:'null'})">${code!=null?'Save changes':'Create domain'}</button></div>`;
    $('#overlay').classList.add('show');
    setTimeout(()=>{ const fi=$('#modal').querySelector('input:not([readonly])'); if(fi)fi.focus(); },30);
  },
  saveDomain(code){
    const g=k=>($('#dm_'+k).value||'').trim();
    const rec={ code:g('code'), name:g('name'), mc:g('mc'), reqPrefix:g('reqPrefix')||g('code'), blurb:g('blurb') };
    if(!rec.code){ toast('Domain code is required','err'); return; }
    if(code==null){
      if(DB.domains[rec.code]){ toast('Domain “'+rec.code+'” already exists','err'); return; }
      DB.domains[rec.code]={ ...rec, collections:this.emptyCollections() };
      UI.domain=rec.code; UI.route={view:'collection',scope:'domain',collection:'useCases'};
    } else {
      const d=DB.domains[code]; d.name=rec.name; d.mc=rec.mc; d.reqPrefix=rec.reqPrefix; d.blurb=rec.blurb;
    }
    this.save(); Modal.close(); toast((code==null?'Created':'Saved')+' domain '+rec.code,'ok'); this.render();
  },
  deleteDomain(code){
    if(Object.keys(DB.domains).length<=1){ toast('Cannot delete the last domain','err'); return; }
    const d=DB.domains[code]; const ucs=((d.collections||{}).useCases||[]).length;
    if(!confirm(`Delete domain “${d.name}” (${code}) and all ${ucs} of its Use Cases plus every collection? Export first to keep a copy. This cannot be undone.`))return;
    delete DB.domains[code];
    if(UI.domain===code) UI.domain=Object.keys(DB.domains)[0];
    UI.route={view:'governance'}; this.save(); toast('Deleted domain '+code,'ok'); this.render();
  },

  /* ---- import / export ---- */
  exportJSON(){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`MDO_GRC_Platform_${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Exported full configuration','ok');
  },
  importJSON(file){
    if(!file)return; const rd=new FileReader();
    rd.onload=()=>{ try{ const obj=JSON.parse(rd.result);
      if(obj.schema!==DB.schema){ if(!confirm('Schema tag differs from this build. Import anyway?'))return; }
      if(!obj.domains||!obj.global){ toast('Not a platform export (missing domains/global)','err'); return; }
      if(!confirm('Replace the entire current configuration with this file? Export first to back up.'))return;
      DB=obj; if(!DB.meta)DB.meta={}; UI.domain=Object.keys(DB.domains)[0]; UI.route={view:'dashboard'};
      App.save(); App.render(); toast('Imported configuration','ok');
    }catch(e){ toast('Invalid JSON: '+e.message,'err'); } };
    rd.readAsText(file);
  },
};

/* ============================================================================
   VIEWS
   ========================================================================== */
const Views = {
  pageH(eyebrow,title,sub,acts){
    return `<div class="page-h"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="acts">${acts||''}</div></div>`;
  },

  /* ---------- generic LIST ---------- */
  list(coll,scope){
    const sc=SCHEMAS[coll]; const list=(scope==='global'?DB.global[coll]:App.coll(coll))||[];
    const cols=sc.fields.slice(0,5);
    const tid='srch_'+coll;
    const acts=`<button class="btn primary" onclick="App.create('${coll}','${scope}')">＋ New ${esc(sc.label)}</button>`+
      (coll==='useCases'?` <button class="btn" onclick="App.go({view:'ierMatrix'})">IER Matrix ▤</button>`:'')+
      (coll==='c3Taxonomy'?` <button class="btn gold" onclick="App.go({view:'taxonomyTree'})">⊞ Hierarchy</button>`:'');
    let h=Views.pageH(scope==='global'?'Global GRC catalog':DB.domains[UI.domain].name+' · '+DB.domains[UI.domain].mc, sc.plural, sc.desc, acts);
    h+=`<div class="toolbar"><input class="search" id="${tid}" placeholder="Filter ${esc(sc.plural)}…" oninput="Views.filterRows('${coll}')"><button class="btn gold sm" onclick="App.copyTable('tbl_${coll}','${esc(sc.plural)}')">⧉ Copy</button><button class="btn sm" onclick="App.exportTableWord('tbl_${coll}','${esc(sc.plural)}')">⤓ Word</button><button class="btn sm" onclick="App.exportListJSON('${coll}','${scope}')">⤓ JSON</button><span class="muted mono" id="ct_${coll}" style="font-size:0.72rem"></span></div>`;
    h+=Views.facetBar(sc,coll,list);
    h+=`<div class="tbl-wrap"><table id="tbl_${coll}"><thead><tr>`+
       cols.map(f=>`<th>${esc(f.label)}</th>`).join('')+`<th style="text-align:right">Actions</th></tr></thead><tbody>`;
    if(!list.length) h+=`<tr><td colspan="${cols.length+1}"><div class="empty">No ${esc(sc.plural)} yet. <button class="btn primary sm" onclick="App.create('${coll}','${scope}')">Create the first one</button></div></td></tr>`;
    list.forEach(rec=>{ h+=Views.row(sc,coll,scope,rec,cols); });
    h+=`</tbody></table></div>`;
    $('#main').innerHTML=h;
    $('#ct_'+coll).textContent=list.length+' record'+(list.length===1?'':'s');
  },
  row(sc,coll,scope,rec,cols){
    const id=rec[sc.id];
    const open=`App.go({view:'collection',scope:'${scope}',collection:'${coll}',recordId:'${esc(String(id))}'})`;
    let tds=cols.map((f,i)=>{
      let v=Views.cell(f,rec);
      if(i===0) v=`<a class="mono" style="font-weight:700;cursor:pointer" onclick="${open}">${v}</a>`;
      return `<td>${v}</td>`;
    }).join('');
    tds+=`<td><div class="rowacts" style="justify-content:flex-end"><button class="btn sm" onclick="${open}">Open</button><button class="btn sm" onclick="App.edit('${coll}','${scope}','${esc(String(id))}')">Edit</button><button class="btn sm danger" onclick="App.remove('${coll}','${scope}','${esc(String(id))}')">Del</button></div></td>`;
    return `<tr data-id="${esc(String(id))}" data-search="${esc(JSON.stringify(rec).toLowerCase())}">${tds}</tr>`;
  },
  cell(f,rec){
    const v=getPath(rec,f.k);
    if(f.type===FT.REF) return App.refChip(f.ref,f.refScope,v);
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.length?(a.slice(0,4).map(id=>App.refChip(f.ref,f.refScope,id)).join(' ')+(a.length>4?` <span class="muted">+${a.length-4}</span>`:'')):'<span class="muted">—</span>'; }
    if(f.k==='cls') return App.refChip('classifications','global',v);
    if(f.k==='lpi') return Views.meter(v);
    if(f.type===FT.LIST) return `<span class="muted">${(v||[]).length} item(s)</span>`;
    if(f.type===FT.BOOL) return v?'✓':'—';
    if(f.type===FT.HTML) return `<span class="clip">${esc(String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}</span>`;
    if(f.type===FT.AREA) return `<span class="clip">${esc(v)}</span>`;
    return esc(v==null?'':v);
  },
  meter(n){ n=+n||0; const cls=n>=4?'hi':(n<=1?'lo':''); let d=''; for(let i=0;i<5;i++)d+=`<i class="${i<n?'on '+cls:''}"></i>`; return `<span class="meter" title="LPI/LPD ${n}/5">${d}</span> <span class="mono muted" style="font-size:0.7rem">${n}/5</span>`; },
  filterTable(coll,q){ q=q.toLowerCase(); let n=0; document.querySelectorAll('#tbl_'+coll+' tbody tr').forEach(tr=>{ const m=!q||(tr.dataset.search||'').includes(q); tr.style.display=m?'':'none'; if(m)n++; }); const c=$('#ct_'+coll); if(c)c.textContent=n+' shown'; },
  facId(coll,k){ return 'fac_'+coll+'_'+k.replace(/\W/g,'_'); },
  facetOptions(f,list){
    if(f.k==='lpi') return [1,2,3,4,5].map(n=>({v:String(n),l:'≥ '+n+'/5'}));
    if(f.type===FT.REF||f.type===FT.MULTIREF||f.k==='cls') return Modal.refOptions(f);
    if(f.type===FT.SEL && Array.isArray(f.options)) return f.options.map(o=>({v:o,l:o}));
    const set=new Set(); list.forEach(r=>{ const v=getPath(r,f.k); if(Array.isArray(v))v.forEach(x=>set.add(x)); else if(v!=null&&v!=='')set.add(v); });
    return [...set].sort().map(v=>({v:String(v),l:String(v)}));
  },
  facetBar(sc,coll,list){
    if(!sc.facets||!sc.facets.length) return '';
    const cells=sc.facets.map(k=>{ const f=sc.fields.find(x=>x.k===k); if(!f)return ''; const opts=Views.facetOptions(f,list);
      const lbl=(f.label||k).replace(/^TC\d+\s*·\s*/,'').replace(/\s*\(.*$/,'');
      return `<select class="filtsel" id="${Views.facId(coll,k)}" onchange="Views.filterRows('${coll}')" title="${esc(f.label)}"><option value="">${esc(lbl)}: all</option>`+
        opts.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')+`</select>`;
    }).join('');
    return `<div class="toolbar" style="margin-top:-4px;gap:6px">${cells}<button class="btn sm" onclick="Views.clearFacets('${coll}')">Clear filters</button></div>`;
  },
  filterRows(coll){
    const sc=SCHEMAS[coll]; const scope=UI.route.scope;
    const list=(scope==='global'?DB.global[coll]:App.coll(coll))||[];
    const q=((document.getElementById('srch_'+coll)||{}).value||'').toLowerCase();
    const facets=(sc.facets||[]).map(k=>{ const el=document.getElementById(Views.facId(coll,k)); return {k,v:el?el.value:''}; }).filter(f=>f.v);
    let n=0;
    list.forEach(rec=>{
      const tr=document.querySelector('#tbl_'+coll+' tr[data-id="'+(window.CSS&&CSS.escape?CSS.escape(String(rec[sc.id])):String(rec[sc.id]))+'"]');
      if(!tr) return;
      let ok = !q || (tr.dataset.search||'').includes(q);
      for(const f of facets){ if(!ok)break; const val=getPath(rec,f.k);
        if(Array.isArray(val)) ok=val.map(String).includes(f.v);
        else if(f.k==='lpi') ok=(+val||0)>=(+f.v);
        else ok=String(val==null?'':val)===f.v;
      }
      tr.style.display=ok?'':'none'; if(ok)n++;
    });
    const c=$('#ct_'+coll); if(c)c.textContent=n+(facets.length||q?' shown':' record'+(n===1?'':'s'));
  },
  clearFacets(coll){ const sc=SCHEMAS[coll]; (sc.facets||[]).forEach(k=>{ const el=document.getElementById(Views.facId(coll,k)); if(el)el.value=''; }); const sr=document.getElementById('srch_'+coll); if(sr)sr.value=''; Views.filterRows(coll); },

  /* ---------- generic DETAIL ---------- */
  detail(coll,scope,id){
    const sc=SCHEMAS[coll]; const list=scope==='global'?DB.global[coll]:App.coll(coll);
    const rec=list.find(x=>String(x[sc.id])===String(id));
    if(!rec){ $('#main').innerHTML=Views.pageH('','Not found','That record no longer exists.',''); return; }
    const back=`App.go({view:'collection',scope:'${scope}',collection:'${coll}'})`;
    const acts=`<button class="btn gold" onclick="App.copyTable('tbl_rec','${esc(String(id))}')">⧉ Copy (Word)</button>`+
      ` <button class="btn" onclick="App.exportTableWord('tbl_rec','${esc(String(id))}')">⤓ Word</button>`+
      ` <button class="btn" onclick="App.copyRecord('${coll}','${scope}','${esc(String(id))}')">⎘ Duplicate</button>`+
      ` <button class="btn primary" onclick="App.edit('${coll}','${scope}','${esc(String(id))}')">✎ Edit</button>`+
      ` <button class="btn danger" onclick="App.remove('${coll}','${scope}','${esc(String(id))}')">Delete</button>`;
    let h=`<div class="crumbs"><a onclick="${back}">${esc(sc.plural)}</a> › ${esc(String(id))}</div>`;
    h+=Views.pageH(sc.label, (rec[sc.title]!=null?rec[sc.title]:rec[sc.id]), '', acts);
    // grouped fields (readable cards)
    h+=`<div class="dgrid">`;
    let curSec=null;
    sc.fields.forEach(f=>{
      if(f.sec&&f.sec!==curSec){ curSec=f.sec; h+=`<div class="grouphd">${esc(curSec)}</div>`; }
      h+=`<div class="field ${f.wide?'':''}" ${f.wide?'style="grid-column:1/-1"':''}><div class="fk">${esc(f.label)}</div><div class="fv">${Views.detailVal(f,rec)}</div></div>`;
    });
    h+=`</div>`;
    // TC-ordered export table — the source for the Copy (Word) / Word buttons above
    h+=`<div class="panel"><h3>${coll==='useCases'?'Technical-Constraint table (TC01–TC11) · copy / export source':'Record table · copy / export source'}</h3><div class="tbl-wrap">${Views.recordTable(coll,scope,rec)}</div></div>`;
    // cross-references INTO this record
    h+=Views.backrefs(coll,scope,rec);
    $('#main').innerHTML=h;
  },
  /* plain-text rendering of one field's value (for the per-record export table) */
  recordCellText(f,rec){
    const v=getPath(rec,f.k);
    if(f.k==='cls'){ return v?String(v)+(App.refTitle('classifications','global',v)!==v?' — '+App.refTitle('classifications','global',v):''):''; }
    if(f.type===FT.REF){ return v?String(v)+(App.refTitle(f.ref,f.refScope,v)!==v?' — '+App.refTitle(f.ref,f.refScope,v):''):''; }
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.map(id=>String(id)+' '+App.refTitle(f.ref,f.refScope,id)).join('; '); }
    if(f.k==='lpi'){ const n=+v||0; const nar=(DB.global.riskNarr||[]).find(x=>+x.level===n); return n+'/5'+(nar?' ('+nar.label+')':''); }
    if(f.type===FT.LIST){ return (v||[]).join('; '); }
    if(f.type===FT.BOOL) return v?'yes':'no';
    if(f.type===FT.HTML) return String(v||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    return v==null?'':String(v);
  },
  /* a 3-column Group · Field · Value table for one record, fields in schema (TC) order */
  recordTable(coll,scope,rec){
    const sc=SCHEMAS[coll]; let curSec=''; let rows='';
    sc.fields.forEach(f=>{ if(f.sec)curSec=f.sec; const txt=Views.recordCellText(f,rec);
      rows+=`<tr><td class="mono muted" style="white-space:nowrap;font-size:0.72rem">${esc(curSec)}</td><td class="mono" style="font-weight:600;white-space:nowrap">${esc(f.label)}</td><td>${esc(txt)||'<span class="muted">—</span>'}</td></tr>`; });
    return `<table id="tbl_rec"><thead><tr><th>Group</th><th>Field</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>`;
  },
  detailVal(f,rec){
    const v=getPath(rec,f.k);
    if(f.k==='cls') return App.refChip('classifications','global',v)+' '+esc(App.refTitle('classifications','global',v));
    if(f.type===FT.REF){ return App.refChip(f.ref,f.refScope,v)+' '+(v?esc(App.refTitle(f.ref,f.refScope,v)):''); }
    if(f.type===FT.MULTIREF){ const a=v||[]; return a.length?`<div style="display:flex;flex-wrap:wrap;gap:5px">${a.map(id=>App.refChip(f.ref,f.refScope,id)+' <span class="muted" style="font-size:0.78rem">'+esc(App.refTitle(f.ref,f.refScope,id))+'</span>').join('<br>')}</div>`:'<span class="muted">—</span>'; }
    if(f.k==='lpi'){ const nar=(DB.global.riskNarr||[]).find(x=>+x.level===(+v||0)); return Views.meter(v)+(nar?`<div class="muted" style="font-size:0.78rem;margin-top:4px">${esc(nar.label)} — ${esc(nar.text)}</div>`:''); }
    if(f.type===FT.LIST){ const a=v||[]; return a.length?`<ul>${a.map(x=>`<li>${App.linkRefs(esc(x))}</li>`).join('')}</ul>`:'<span class="muted">—</span>'; }
    if(f.type===FT.BOOL) return v?'✓ yes':'— no';
    if(f.type===FT.HTML) return v?`<div class="rich">${App.linkRefs(String(v))}</div>`:'<span class="muted">—</span>';
    return v==null||v===''?'<span class="muted">—</span>':App.linkRefs(esc(v));
  },
  backrefs(coll,scope,rec){
    // find collections whose ref fields point at this record → show as related
    const sc=SCHEMAS[coll]; const id=rec[sc.id]; let blocks='';
    Object.entries(SCHEMAS).forEach(([name,s])=>{
      s.fields.forEach(f=>{
        if(f.type===FT.REF&&f.ref===coll&&((f.refScope==='global'&&scope==='global')||(f.refScope==='domain'&&scope==='domain'))){
          const list=s.scope==='global'?(DB.global[name]||[]):App.coll(name);
          const hits=list.filter(x=>String(getPath(x,f.k))===String(id));
          if(hits.length){ blocks+=`<div class="panel"><h3>Referenced by · ${esc(s.plural)}</h3><div style="display:flex;flex-wrap:wrap;gap:6px">`+
            hits.map(x=>App.refChip(name,s.scope==='global'?'global':'domain',x[s.id])).join('')+`</div></div>`; }
        }
      });
    });
    return blocks;
  },

  /* ---------- GRC DASHBOARD ---------- */
  dashboard(){
    const doms=Object.values(DB.domains);
    let totUC=0,totSer=0; const clsCount={}, riskBuckets=[0,0,0,0,0,0];
    doms.forEach(d=>{ const ucs=(d.collections&&d.collections.useCases)||[]; totUC+=ucs.length; ucs.forEach(u=>{ if(u.serial)totSer++; clsCount[u.cls]=(clsCount[u.cls]||0)+1; riskBuckets[Math.max(0,Math.min(5,+u.lpi||0))]++; }); });
    const highRisk=doms.reduce((a,d)=>a+(((d.collections&&d.collections.useCases)||[]).filter(u=>(+u.lpi||0)>=4).length),0);
    let h=Views.pageH('Governance · Risk · Compliance','MDO Secure-CIS GRC Dashboard',`Multi-domain posture across ${doms.length} domains · NAF v4.1 · AJP-6 IER · C3 Taxonomy B7.0`,'');
    h+=`<div class="cards">
      <div class="card gold"><div class="k">Domains</div><div class="v">${doms.length}</div><div class="d">${esc(doms.map(d=>d.code).join(' · '))}</div></div>
      <div class="card"><div class="k">Use Cases (IER)</div><div class="v">${totUC}</div><div class="d">${totSer} mapped to an Annex-C serial</div></div>
      <div class="card ${highRisk?'bad':'ok'}"><div class="k">High LPI/LPD risk</div><div class="v">${highRisk}</div><div class="d">UCs at risk ≥ 4/5</div></div>
      <div class="card"><div class="k">Global catalogs</div><div class="v">${GLOBAL_COLLECTIONS.reduce((a,c)=>a+(DB.global[c]||[]).length,0)}</div><div class="d">editable reference entities</div></div>
    </div>`;
    // governance: per-domain breakdown
    h+=`<div class="panel"><h3>Governance — coverage by domain</h3><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Domain</th><th>Directive</th><th>Use Cases</th><th>CapElem</th><th>Vendors</th><th>Echelons</th><th>Avg risk</th><th></th></tr></thead><tbody>`;
    doms.forEach(d=>{ const c=d.collections||{}; const ucs=c.useCases||[]; const avg=ucs.length?(ucs.reduce((a,u)=>a+(+u.lpi||0),0)/ucs.length):0;
      h+=`<tr><td><span class="chip link" onclick="App.switchDomain('${d.code}')">${esc(d.code)}</span></td><td>${esc(d.name)}</td><td class="muted mono" style="font-size:0.72rem">${esc(d.mc)}</td><td><b>${ucs.length}</b></td><td>${(c.capElem||[]).length}</td><td>${(c.vendors||[]).length}</td><td>${(c.echelons||[]).length}</td><td>${Views.meter(Math.round(avg))}</td><td><button class="btn sm" onclick="App.switchDomain('${d.code}')">Open ▸</button></td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
    // risk distribution
    const maxR=Math.max(1,...riskBuckets);
    h+=`<div class="panel"><h3>Risk — LPI/LPD distribution (all domains)</h3>`;
    h+=riskBuckets.map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span class="mono muted" style="width:34px;font-size:0.72rem">${i}/5</span><div class="bar" style="flex:1"><span style="width:${(n/maxR*100).toFixed(1)}%;background:${i>=4?'var(--bad)':i<=1?'var(--ok)':'var(--warn)'}"></span></div><span class="mono" style="width:34px;text-align:right">${n}</span></div>`).join('');
    h+=`</div>`;
    // compliance: classification mix
    h+=`<div class="panel"><h3>Compliance — classification mix</h3><div class="bar">`;
    const totCls=Object.values(clsCount).reduce((a,b)=>a+b,0)||1;
    h+=DB.global.classifications.map(c=>{ const n=clsCount[c.code]||0; return n?`<span style="width:${(n/totCls*100).toFixed(1)}%;background:${c.text}" title="${esc(c.code)}: ${n}"></span>`:''; }).join('');
    h+=`</div><div class="legend">`+DB.global.classifications.map(c=>`<span><i style="background:${c.text}"></i>${esc(c.code)} ${clsCount[c.code]||0}</span>`).join('')+`</div></div>`;
    // governance: review-status mix
    const revCount={}; doms.forEach(d=>((d.collections&&d.collections.useCases)||[]).forEach(u=>{ const r=(u.gov&&u.gov.reviewStatus)||'—'; revCount[r]=(revCount[r]||0)+1; }));

  /* ---------- C3 TAXONOMY B7 — hierarchical accordion (native <details>) ---------- */
  taxonomyTree(){
    const tax=DB.global.c3Taxonomy||[];
    const tops=tax.filter(t=>!t.parent);
    const kidsOf=code=>tax.filter(t=>t.parent===code);
    const coFor=code=>(DB.global.commsServices||[]).filter(s=>s.taxonomy===code);
    const ciFor=code=>(DB.global.c3Services||[]).filter(s=>s.taxonomy===code);
    const capCount=code=>{ let n=0; Object.values(DB.domains).forEach(d=>((d.collections&&d.collections.capElem)||[]).forEach(e=>{ if(e.c3node===code)n++; })); return n; };
    const node=t=>{
      const kids=kidsOf(t.code), co=coFor(t.code), ci=ciFor(t.code), caps=capCount(t.code), leaves=t.branches||[];
      let inner='';
      kids.forEach(k=> inner+=node(k));
      if(leaves.length) inner+=`<ul class="tax-leaves">`+leaves.map(b=>`<li>${esc(b)}</li>`).join('')+`</ul>`;
      if(co.length||ci.length) inner+=`<div class="tax-svcs">`+co.map(s=>App.refChip('commsServices','global',s.code)).join(' ')+' '+ci.map(s=>App.refChip('c3Services','global',s.code)).join(' ')+`</div>`;
      const meta=[t.artefacts?t.artefacts+' artefacts':'', caps?caps+' CapElem':'', (co.length+ci.length)?(co.length+ci.length)+' services':''].filter(Boolean).join(' · ');
      return `<details class="tax-node"><summary><span class="chip link" onclick="event.stopPropagation();App.go({view:'collection',scope:'global',collection:'c3Taxonomy',recordId:'${esc(t.code)}'})">${esc(t.code)}</span> <b>${esc(t.name)}</b>${meta?` <span class="muted">· ${esc(meta)}</span>`:''}</summary><div class="tax-body">${inner||'<span class="muted">—</span>'}</div></details>`;
    };
    const acts=`<button class="btn" onclick="App.go({view:'collection',scope:'global',collection:'c3Taxonomy'})">≣ Table</button> <button class="btn sm" onclick="document.querySelectorAll('.tax-node').forEach(d=>d.open=true)">⊞ Expand all</button> <button class="btn sm" onclick="document.querySelectorAll('.tax-node').forEach(d=>d.open=false)">⊟ Collapse all</button>`;
    let h=Views.pageH('Global · C3 Taxonomy','C3 Taxonomy Baseline 7 — hierarchy','Expandable / collapsible tree: branches → sub-branches → mapped CO-/CI- services and CapElem counts. 1689 artefacts.',acts);
    h+=`<div class="tax-tree"><details class="tax-node" open><summary><b>C3 Taxonomy Baseline 7</b> <span class="muted">· AC/322-WP(2025)0097-REV2-AS1 · 1689 artefacts</span></summary><div class="tax-body">`+tops.map(node).join('')+`</div></details></div>`;
    h+=`<div class="note">Native expand/collapse — click any node. Codes link to the editable record; CO-/CI- chips link to the mapped service. CapElem counts aggregate across all domains.</div>`;
    $('#main').innerHTML=h;
  },
