<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MDO Secure-CIS GRC Platform — NATO Multi-Domain Use-Case and IER Manager</title>
<style>
:root{
  --nato-blue:#003F87;--nato-blue-dark:#002967;--nato-blue-deep:#001b4d;--nato-blue-light:#5a8acf;
  --nato-gold:#cba135;--nato-gold-light:#e6c569;
  --bg:#0a0e14;--bg-2:#0f1623;--bg-3:#182338;--bg-4:#1f2c44;--line:#1f2c44;--line-2:#2a3a57;
  --fg:#e6edf3;--fg-dim:#8b96a8;--fg-mute:#5a6678;
  --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--info:#3b82f6;
  --font-sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--nato-blue-light);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px}::-webkit-scrollbar-track{background:var(--bg)}

.cls-banner{background:#16a34a;color:#fff;text-align:center;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;padding:3px;flex:0 0 auto}
.cls-banner select{background:transparent;border:0;color:#fff;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer}
.cls-banner select option{color:#000}

/* top bar */
header.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(90deg,var(--nato-blue-deep),var(--bg-2));border-bottom:1px solid var(--nato-blue)}
.emblem{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#0a559a,#003F87 60%,#001b4d);border:2px solid var(--nato-gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emblem svg{width:26px;height:26px}
.brand .eyebrow{color:var(--nato-gold);font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase}
.brand h1{font-size:1.0rem;font-weight:700;line-height:1.15}
.top .spacer{flex:1}
.navhist{display:flex;gap:3px}
.navhist .btn{padding:4px 8px;font-size:0.72rem}
.top .tools{display:flex;gap:6px;align-items:center}
.dom-switch{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dom-pill{font-family:var(--font-mono);font-size:0.66rem;font-weight:700;padding:4px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg-dim);cursor:pointer;transition:all .12s}
.dom-pill:hover{border-color:var(--nato-blue-light);color:var(--fg)}
.dom-pill.active{background:var(--nato-blue);border-color:var(--nato-gold);color:#fff}

.btn{font-family:var(--font-mono);font-size:0.66rem;font-weight:600;letter-spacing:0.03em;padding:6px 11px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--fg);cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover{border-color:var(--nato-blue-light);background:var(--bg-3)}
.btn.gold{border-color:var(--nato-gold);color:var(--nato-gold-light)}
.btn.gold:hover{background:rgba(203,161,53,0.12)}
.btn.primary{background:var(--nato-blue);border-color:var(--nato-blue);color:#fff}
.btn.primary:hover{background:var(--nato-blue-dark)}
.btn.danger{border-color:#7f1d1d;color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,0.12)}
.btn.sm{font-size:0.6rem;padding:3px 7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* layout */
.shell{flex:1;display:flex;min-height:0}
aside.side{flex:0 0 248px;background:var(--bg-2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
.side .grp{margin-bottom:12px}
.side .grp-h{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold);padding:5px 9px;display:flex;align-items:center;gap:6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--fg-dim);font-size:0.83rem;cursor:pointer}
.nav a:hover{background:var(--bg-3);color:var(--fg);text-decoration:none}
.nav a.active{background:var(--nato-blue);color:#fff}
.nav a .ct{margin-left:auto;font-family:var(--font-mono);font-size:0.6rem;color:var(--fg-mute);background:var(--bg-4);border-radius:10px;padding:0 7px}
.nav a.active .ct{color:#cfe0ff;background:rgba(255,255,255,0.14)}

main.content{flex:1;overflow-y:auto;padding:18px 22px 60px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.page-h .eyebrow{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--nato-gold)}
.page-h h2{font-size:1.3rem;line-height:1.1}
.page-h .sub{color:var(--fg-dim);font-size:0.84rem;margin-top:2px}
.page-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.crumbs{font-family:var(--font-mono);font-size:0.66rem;color:var(--fg-mute);margin-bottom:8px}
.crumbs a{color:var(--nato-blue-light);cursor:pointer}

/* search */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 11px;color:var(--fg);font-size:0.85rem}
.search:focus{outline:none;border-color:var(--nato-blue-light)}
.filtsel{background:var(--bg-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-size:0.8rem}

/* tables */
.tbl-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:var(--bg-2)}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead th{position:sticky;top:0;background:var(--bg-3);text-align:left;padding:8px 11px;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
tbody td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg-3)}
tbody tr:last-child td{border-bottom:0}
td .rowacts{display:flex;gap:4px;white-space:nowrap}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg-mute)}
.clip{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* chips */
.chip{display:inline-block;font-family:var(--font-mono);font-size:0.6rem;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:0.04em;border:1px solid var(--line-2);color:var(--fg-dim);white-space:nowrap}
.chip.link{cursor:pointer}.chip.link:hover{filter:brightness(1.25);text-decoration:none}
.cls{padding:1px 7px;border-radius:5px;font-weight:700;font-size:0.6rem;letter-spacing:0.06em;font-family:var(--font-mono)}

/* risk meter */
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--bg-4);display:inline-block}
.meter i.on{background:var(--warn)}
.meter i.on.hi{background:var(--bad)}
.meter i.on.lo{background:var(--ok)}

/* dashboard cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--bg-2),var(--bg));border:1px solid var(--line);border-left:3px solid var(--nato-blue);border-radius:9px;padding:13px 15px}
.card .k{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-mute)}
.card .v{font-size:1.7rem;font-weight:700;margin:2px 0}
.card .d{font-size:0.76rem;color:var(--fg-dim)}
.card.gold{border-left-color:var(--nato-gold)}
.card.ok{border-left-color:var(--ok)}.card.warn{border-left-color:var(--warn)}.card.bad{border-left-color:var(--bad)}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.panel h3{font-size:0.72rem;font-family:var(--font-mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:10px}
.bar{height:9px;border-radius:5px;background:var(--bg-4);overflow:hidden;display:flex}
.bar > span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.74rem;color:var(--fg-dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* detail */
.detail{display:grid;grid-template-columns:1fr;gap:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.field{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.field .fk{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--nato-gold);margin-bottom:3px}
.field .fv{font-size:0.86rem;white-space:pre-wrap;word-break:break-word}
.field .fv ul{margin:0;padding-left:18px}
.grouphd{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-blue-light);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,0.74);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:28px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--nato-blue);border-radius:12px;width:min(820px,100%);box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);border-radius:12px 12px 0 0}
.modal-h h3{font-size:1rem}.modal-h .x{margin-left:auto}
.modal-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg-2);border-radius:0 0 12px 12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld.wide{grid-column:1/-1}
.fld label{font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-dim)}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font-size:0.84rem;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--nato-blue-light)}
.fld textarea{min-height:62px;resize:vertical;font-family:inherit}
.fld .hint{font-size:0.68rem;color:var(--fg-mute)}
.modal-sec{grid-column:1/-1;font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--nato-gold);border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:8px}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{font-family:var(--font-mono);font-size:0.74rem;padding:9px 16px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--ok);color:#bbf7d0}.toast.err{border-color:var(--bad);color:#fecaca}.toast.info{border-color:var(--nato-blue-light)}

.empty{text-align:center;color:var(--fg-mute);padding:40px;font-size:0.9rem}
.kbd{font-family:var(--font-mono);font-size:0.66rem;background:var(--bg-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
.note{font-size:0.78rem;color:var(--fg-dim);border-left:3px solid var(--nato-gold);background:rgba(203,161,53,0.06);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.rich{font-size:0.9rem;line-height:1.6}
.rich p{margin:0 0 8px}.rich ul,.rich ol{margin:0 0 8px 0;padding-left:20px}.rich li{margin:2px 0}
.rich h3,.rich h4{color:var(--nato-gold);font-size:0.86rem;margin:10px 0 5px}
.rich a{border-bottom:1px dotted}.rich strong,.rich b{color:var(--fg)}
.rich code{font-family:var(--font-mono);background:var(--bg-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:0.82rem}
.rich table{margin:6px 0}.rich th,.rich td{border:1px solid var(--line);padding:4px 8px}
.tabrow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:7px 13px;font-size:0.8rem;color:var(--fg-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--nato-gold)}
@media(max-width:880px){aside.side{position:fixed;z-index:40;height:100%;left:-260px;transition:left .2s}aside.side.open{left:0}.modal-b{grid-template-columns:1fr}}

/* ----- C3 Taxonomy hierarchical accordion (native <details>) ----- */
.tax-tree{font-size:0.86rem}
.tax-node{border-left:1px solid var(--line);margin:2px 0 2px 4px;padding-left:8px}
.tax-node>summary{cursor:pointer;padding:5px 6px;border-radius:6px;list-style:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tax-node>summary:hover{background:var(--bg-3)}
.tax-node>summary::-webkit-details-marker{display:none}
.tax-node>summary::before{content:'▸';color:var(--nato-gold);display:inline-block;width:0.9em;transition:transform .12s;flex:0 0 auto}
.tax-node[open]>summary::before{transform:rotate(90deg)}
.tax-body{padding:1px 0 2px 12px}
.tax-leaves{margin:3px 0 6px 16px;color:var(--fg-dim)}
.tax-leaves li{margin:1px 0}
.tax-svcs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 7px 16px}

/* ----- cited-acronym auto-links (hover = meaning + source; click = Acronyms table) ----- */
abbr.acr{cursor:pointer;border-bottom:1px dotted var(--nato-gold-light);text-decoration:none;color:inherit}
abbr.acr:hover{color:var(--nato-gold-light);background:rgba(203,161,53,0.10)}

/* ----- Technical-Report document (full linear flow + print/PDF) ----- */
.doc-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.doc-cls,.doc-cls-bottom{display:none}
.rpt-sec{margin-bottom:18px}
#printdoc .rpt-sec{border:1px solid var(--line);border-radius:9px;padding:16px 18px;background:var(--bg-2)}
.rpt-h{font-size:1.15rem;color:var(--fg);border-bottom:2px solid var(--nato-gold);padding-bottom:6px;margin-bottom:12px}
.rpt-h3{color:var(--nato-gold);margin:14px 0 8px;font-size:0.92rem;font-family:var(--font-mono)}
.toc{padding-left:22px;line-height:1.95}
@media print{
  /* paged-media trick: running header (reference) + footer with "Page X of Y".
     Honoured by engines with @page margin-box support; the fixed bars below are
     the fallback that always render the reference and classification in Chrome. */
  @page{ size:A4; margin:18mm 14mm 18mm }   /* running header/footer margin-boxes injected at runtime (App.syncPrintHeader) with the live reference + classification */
  html,body{height:auto;overflow:visible;background:#fff;color:#000;display:block;font-size:10.5pt}
  .cls-banner,header.top,aside.side,#toast,.overlay,.doc-actions,.page-h .acts,.crumbs,.btn,.navhist{display:none !important}
  .shell{display:block;min-height:0}
  main.content{overflow:visible;padding:0;display:block}
  #printdoc .rpt-sec{break-before:page;page-break-before:always;border:0;background:#fff;padding:0 0 6pt}
  #printdoc .rpt-sec.cover{break-before:auto;page-break-before:auto}
  tr,.card,.tax-node{break-inside:avoid;page-break-inside:avoid}   /* keep rows/cards whole; let big tables flow across pages */
  thead{display:table-header-group}                                /* repeat column headers on each page a table spans */
  .rpt-h,.rpt-h3,h2,h3,.panel>h3{break-after:avoid;page-break-after:avoid}   /* no orphaned headings */
  .doc-cls,.doc-cls-bottom{display:flex !important;position:fixed;left:8mm;right:8mm;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:7.5pt;letter-spacing:0.5px;color:#003F87;gap:8px}
  .doc-cls .dc,.doc-cls-bottom .dc{flex:1;text-align:center;letter-spacing:1.5px;font-weight:700}
  .doc-cls .dl,.doc-cls-bottom .dl{font-weight:700;white-space:nowrap}
  .doc-cls .dr,.doc-cls-bottom .dr{white-space:nowrap}
  .doc-cls{top:7mm} .doc-cls-bottom{bottom:7mm}
  .panel,.tbl-wrap,.card{background:#fff !important;border-color:#bbb;box-shadow:none;margin-bottom:8pt}
  .rpt-h{color:#003F87;border-bottom-color:#cba135} .rpt-h3,.card .v,.field .fk,.panel h3{color:#003F87 !important}
  table{font-size:8.5pt;width:100%} thead th{background:#003F87 !important;color:#fff !important}
  tbody td,thead th{border:1px solid #bbb}
  a{color:#000 !important;text-decoration:none}
  .chip,.cls{border:1px solid #999;color:#222 !important;background:#fff !important}
  abbr.acr,.reflink{border-bottom:none !important;background:none !important;color:inherit !important}
  b,strong,.rich b,.rich strong{color:#003F87 !important}
  .rich,.rich p,.rich li,.field .fv,td,p{color:#111 !important}
  .doc-cls,.doc-cls-bottom{display:none !important}   /* redundant with @page margin-boxes; avoid content overlap */
  .muted,.fg-dim{color:#555 !important}
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important }
}
</style>
</head>
<body>
<div class="cls-banner">
  <span id="clsLabel">NATO UNCLASSIFIED</span> · MDO Secure-CIS GRC Platform · DRAFT — classification:
  <select id="clsSel" onchange="App.setClassification(this.value)"></select>
</div>

<header class="top">
  <button class="btn sm" id="burger" style="display:none" onclick="document.querySelector('aside.side').classList.toggle('open')">☰</button>
  <div class="navhist">
    <button class="btn sm" id="navBack" title="Back (Alt+←)" onclick="App.back()" disabled>◀</button>
    <button class="btn sm" id="navFwd" title="Forward (Alt+→)" onclick="App.forward()" disabled>▶</button>
  </div>
  <div class="emblem"><svg viewBox="0 0 24 24"><g transform="translate(12 12)" fill="#fff" stroke="#cba135" stroke-width="0.5"><polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2"/></g><circle cx="12" cy="12" r="1.3" fill="#cba135"/></svg></div>
  <div class="brand">
    <div class="eyebrow">Allied Command Operations · NAF v4.1 · AJP-6 IER · C3 Taxonomy B7.0</div>
    <h1>MDO Secure Communications — GRC Platform</h1>
  </div>
  <div class="spacer"></div>
  <div class="dom-switch" id="domSwitch"></div>
  <div class="tools">
    <button class="btn gold" onclick="App.exportJSON()">⭳ Export</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">⭱ Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="App.importJSON(this.files[0])">
    <button class="btn danger" onclick="App.resetAll()">↺ Reset</button>
  </div>
</header>

<div class="shell">
  <aside class="side"><div id="nav"></div></aside>
  <main class="content" id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00292","title":"Land Tactical C2 Information Exchange Profile (FMN Spiral 4) — predecessor of PFL-00403 [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00402","title":"MIP4 Profile (FMN Spiral 5) — distinct from PFL-00403 [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00405","title":"MIP 4 / JDSSDM Mediation Profile (FMN Spiral 5) [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00312","title":"Tactical Interoperability Network Interconnection (FMN Spiral 4) [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00446","title":"IP Access to Tactical Radio (FMN Spiral 5) — AEP-76 Vol V [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00406","title":"NVG / JDSSDM Mediation Profile (FMN Spiral 5) [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00408","title":"ADatP-36 / JDSSDM Mediation Profile (FMN Spiral 5) [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"PFL-00293","title":"Maritime C2 Information Exchange Profile (FMN Spiral 4) — CI-1067 [NISP B16 confirmed]","kind":"PFL","url":"","note":""},{"code":"NISP Baseline 16","title":"NATO Interoperability Standards and Profiles — Baseline 16 Catalogue (5 SEP 2024). Authoritative source validated for the PFL / CI identifiers in this report.","kind":"Other","url":"https://nhqc3s.hq.nato.int/apps/nisp/NISP_Baseline_16_Catalogue_5SEP2024_enclosure_only.pdf","note":""},{"code":"MC 0593","title":"Minimum Level of C2 Service Capabilities (Joint)","kind":"MC","url":"","note":""},{"code":"MC 0640","title":"Land Tactical IER directive","kind":"MC","url":"","note":""},{"code":"MC 0195","title":"Maritime IER directive","kind":"MC","url":"","note":""},{"code":"MC 0655","title":"Air IER directive","kind":"MC","url":"","note":""},{"code":"MC 0695","title":"Air Tactical IER / VeVA MN","kind":"MC","url":"","note":""},{"code":"COPD","title":"Comprehensive Operations Planning Directive v3","kind":"Other","url":"","note":""},{"code":"AECTP-230","title":"Climatic Conditions (Allied Environmental Conditions and Test Publication)","kind":"Other","url":"","note":""},{"code":"STANAG 4866","title":"Climatic categories codification (May 2009)","kind":"STANAG","url":"","note":""},{"code":"AJP-3.1","title":"Allied Joint Doctrine for Electronic Warfare","kind":"AJP","url":"","note":""},{"code":"JP-3.6","title":"Electronic Warfare (LPI/LPD requirements)","kind":"Other","url":"","note":""},{"code":"AC/322","title":"NATO C3 Board directives (security / EMSEC)","kind":"Other","url":"","note":""},{"code":"C3 Taxonomy B7","title":"NATO C3 Taxonomy Baseline 7 — AC/322-WP(2025)0097-REV2-AS1, approved by the Digital Policy Committee 13 May 2026; 1689 artefacts; CC BY-NC 4.0; Tidepedia Baseline 100186","kind":"Other","url":"https://tide.act.nato.int/mediawiki/tipeia","note":""}],"riskNarr":[{"level":0,"label":"Negligible","text":"No tactical concealment required; routine garrison-style RF posture."},{"level":1,"label":"Low","text":"Light EW posture; periodic frequency hopping suffices."},{"level":2,"label":"Moderate","text":"Moderate LPI required; spread-spectrum and DSCP shaping recommended."},{"level":3,"label":"High","text":"Strong LPI required; FFH-EPM, low-duty-cycle bursts, directional antennas."},{"level":4,"label":"Critical","text":"LPI+LPD mission-critical; ESSOR HDR FFH, minimal emission profile, brevity-only voice."},{"level":5,"label":"Dominant-EW","text":"Adversary EW dominant; assume detection; rely on encryption-in-depth and scheduled brevity bursts."}],"reportSections":[{"id":"RPT-1","order":10,"section":"Introduction","title":"1 · Introduction","body":"<p>This Technical Report presents a Governance, Risk and Compliance (GRC) view of NATO tactical Communication and Information System (CIS) <b>Information-Exchange Use Cases</b> across the <b>Maritime</b>, <b>Land</b> and <b>Air</b> domains, prepared for review by <b>Allied Command Operations (ACO)</b> and <b>Allied Command Transformation (ACT)</b>.</p><p>Each Use Case follows the canonical <b>UC-X-nnn</b> naming (X = domain letter) and is characterised by the eleven <b>Technical Constraints (TC01–TC11)</b>, with the AJP-6 six-dimension Information Exchange Requirement (IER) carried at TC06. Resilience for operating in Denied, Degraded, Intermittent and Limited (DDIL) environments with AI-enabled communications — the former C2D2E theme — is now carried transversally inside each domain.</p>"},{"id":"RPT-2","order":20,"section":"Background","title":"2 · Background","body":"<p>NATO Federated Mission Networking (FMN) and the C3 Taxonomy (Baseline 7.0) frame interoperable C2 across domains. The Military Committee directives — <b>MC 0195/13 (Maritime)</b>, <b>MC 0640 (Land)</b> and <b>MC 0655 / 0695 (Air)</b> — specify the domain IER tables that this report consolidates.</p><p>The deliverable is a single self-contained, air-gapped HTML application: every entity (Use Case, IER, Capability Element, vendor, echelon, reference) is editable through schema-driven CRUD, every figure on the dashboard is computed live, and the entire configuration round-trips as one JSON / JSON-LD file.</p>"},{"id":"RPT-3","order":30,"section":"Framework","title":"3 · Use-Case Framework","body":"<p>The Use-Case Framework names every Use Case <b>UC-X-nnn</b> (X = domain letter) and constrains it with eleven Technical Constraints <b>TC01–TC11</b>, each mapped to the Use-Case field that carries it. The table below is the authoritative mapping; it is itself editable.</p>"},{"id":"RPT-SLOT","order":35,"section":"Framework","title":"3.1 · Use-Case slot symmetry (UC-X-NN)","body":"<p>The three domains share a common <b>12-slot capability template</b>, organised over three echelon tiers (Component/HQ · Tactical · Platform/unit), so that <b>UC-X-NN denotes the same capability in every domain</b> (e.g. UC-L-005, UC-M-005 and UC-A-005 are all the air- and missile-defence Use Case). Each domain instantiates the slot with its own systems and doctrine, and a thirteenth transversal slot carries the C2D2E (DDIL + AI) Use Case. This symmetry makes the report balanced and lets a reader compare the same capability across Land, Maritime and Air at a glance. The slot map below is the authoritative pattern.</p>"},{"id":"RPT-4","order":40,"section":"Executive Summary","title":"4 · Executive Summary of Use Cases","body":"<p>The figures below are computed live from the editable dataset: Use-Case counts by domain, classification mix, LPI/LPD risk distribution and governance review status. The cross-domain table lists every Use Case with its normalised Technical-Constraint facets and can be filtered and exported to Word or JSON.</p>"},{"id":"RPT-5","order":60,"section":"Annexes","title":"6 · Annexes and Reference Tables","body":"<p>The annexes hold the supporting material: the Standards and References register (STANAG / AAP / AJP / ATDLP / PFL), the NAF v4 / ADatP-47 overrides retained as a reference table, the per-domain vendor and NAF-architecture mapping, Capability Elements, echelons, scenarios, Tactical Data Links, the Acronyms and Abbreviations annex, and the global GRC catalogs (classifications, precedence, track identity, climatic categories, mission types and FMN objectives).</p>"},{"id":"RPT-BLUF","order":38,"section":"Executive Summary","title":"Bottom Line Up Front (BLUF)","body":"<p><b>Bottom line.</b> This report consolidates NATO tactical CIS Information-Exchange Use Cases for the <b>Maritime</b>, <b>Land</b> and <b>Air</b> domains (65 Use Cases) on a single AJP-6 IER framework, with resilience for Denied/Degraded/Intermittent/Limited environments and AI-enabled communications (C2D2E) carried transversally, and aligned to the NATO C3 Taxonomy Baseline 7.</p><p><b>Key risks.</b> (1) PFL and C3 (CI-…) service identifiers have been validated against the NISP Baseline 16 Catalogue (5 SEP 2024) and confirmed real; the CapElem R.x.NNN identifiers are not NISP B16 identifiers and remain illustrative; (2) C2D2E (DDIL + AI) requirements anticipate FMN Spiral 6 and need endorsement; (3) most Use Cases remain in DRAFT review status; (4) Annex-C serial coverage is partial in the available source.</p><p><b>Decision asks for ACO / ACT.</b> Endorse the tri-domain scope and the Use-Case Framework (TC01–TC11); task subject-matter-expert review of the DRAFT Use Cases; direct validation of CapElem / PFL identifiers against the gated NISP / MC catalogue.</p>"},{"id":"RPT-METH","order":25,"section":"Methodology","title":"Methodology, Assumptions and Limitations","body":"<p><b>Methodology.</b> Use Cases were extracted from the source Military-Committee directive reports (MC 0195/13, MC 0640, MC 0655 / 0695), normalised to the canonical UC-X-nnn framework and the eleven Technical Constraints (TC01–TC11), and consolidated into one schema-driven dataset with full traceability to the AJP-6 six-dimension IER.</p><p><b>Assumptions.</b> Federated Mission Networking (FMN) Spiral 5/6 context applies; the C3 Taxonomy Baseline 7 (AC/322-WP(2025)0097-REV2-AS1) is authoritative for service classification; Brigade-and-below / tactical echelons are in scope, with upstream echelons shown only as reach-back.</p><p><b>Validation.</b> PFL and C3 service (CI-…) identifiers were <b>validated against the NISP Baseline 16 Catalogue (5 SEP 2024, 352 pp)</b>: PFL-00403, the CI-1062 Land profile inventory and every CI-… code used are confirmed present (see the Findings register, REC-001). <b>Limitations.</b> The CapElem R.x.NNN identifiers and KPIs are <b>illustrative</b> — NISP B16 carries no CapElem construct (it is a C3 Taxonomy artefact), so they are marked illustrative on every record (FIND-003); Annex-C serial coverage is partial (the available Draft MC 0640 copy terminates mid-table); the dataset awaits subject-matter-expert review and formal approval.</p>"}],"c3Taxonomy":[{"code":"BP-1000","name":"C3 Business Process","parent":"","artefacts":408,"branches":["Govern (BP-1486)","Generate (BP-1481)","Operate (BP-1779)","Enable (BP-1327)"],"note":""},{"code":"BR-1000","name":"C3 Business Roles","parent":"","artefacts":297,"branches":["Functional Military Roles (BR-1057)","Coordinating Military Roles (BR-1154)","Structural Military Roles","Civilian Roles","Organizational Roles"],"note":"To include the FMN Spiral 6 Specification."},{"code":"C3-CAP","name":"C3 Capabilities","parent":"","artefacts":33,"branches":["Consultation capabilities","Command and Control capabilities","Communication and Information System capabilities","Information Management capabilities","Battlespace Management capabilities"],"note":"Inspired by the capability hierarchy framework in the NATO Defence Planning Process (NDPP)."},{"code":"C3-COI","name":"C3 Community of Interest Services","parent":"","artefacts":130,"branches":["COI-Specific Services","COI-Enabling Services"],"note":""},{"code":"C3-CORE","name":"C3 Core Services","parent":"","artefacts":150,"branches":["Business Support Services","Platform Services","Infrastructure Services"],"note":""},{"code":"C3-COMMS","name":"C3 Communications Services","parent":"","artefacts":91,"branches":["Communication Access Services","Transport Services","Transmission Services"],"note":""},{"code":"C3-INFO","name":"C3 Information Products","parent":"","artefacts":205,"branches":["Governance Information Products","Domain-Specific Information Products","Operation Enabling Information Products","Operation Support Information Products","Situational Awareness Information Products","Management Information Products"],"note":"Including FMN Spiral 6 Specification inputs."},{"code":"C3-APPS","name":"C3 User Applications","parent":"","artefacts":375,"branches":["CIS Applications","Joint Applications","Air Applications","Land Applications","Maritime Applications","Space Applications","Cyberspace Applications","Special Operations Applications","JISR Applications","Logistics Applications","Medical Application ["SitaWare Headquarters / Frontline C2 over the tactical IP network","ESSOR HDR UHF/L-band wideband backbone","NBWF VHF Low 30-88 MHz combat net","APP-11(E) MTF over MIP / JDSSDM (STANAG 4677)"],"attackSurface":"Message metadata exposes ORBAT and tempo. Mitigation: confidentiality labels, IPsec and EMCON-disciplined transmission. Under active C2D2E electromagnetic warfare the adversary saturates the spectrum: GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time), AI-managed frequency hopping and dynamic spectrum access, disruption-tolerant networking and strict EMCON.","c2d2e":"","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083"],"coi":["CI-1062"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-L-002","serial":"L-2","band":"Brigade","title":"Recognized Ground Picture compilation and dissemination","sub":"The Brigade compiles and disseminates the Recognized Ground Picture (friendly, enemy and neutral land tracks) to subordinate and flanking units.","cls":"NS","prec":"Immediate","env":"UNK","lpi":3,"avail":"High (24/7)","timeWindow":"Continuous; near-real-time","zones":"Brigade AOO · Land C2 CoI","ier":{"who":"Bde G2/G3 and Battle Groups and Division reach-back","what":"Land track picture (RGP) via NFFI / MIP / JC3IEDM with STANAG 4162 identity","when":"Continuous near-real-time","protection":"NATO Secret · labels","volume":"Medium-high · tracks and overlays"},"equipment":["SitaWare common operational picture","NFFI / FFT feeds over NBWF and ESSOR","MIP 3.1 / JDSSDM data exchange (STANAG 4677)","STANAG 4162 identity resolution"],"attackSurface":"The aggregated picture is a high-value target. Mitigation: CDS at reach-back, labels and replication discipline.","c2d2e":"","gov":{"ow re ISR dissemination","Collection request / CCIR management"],"attackSurface":"UAS datalinks are jamming and intercept targets. Mitigation: LPI links, frequency hopping and link encryption.","c2d2e":"","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083"],"coi":["CI-1062"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-L-012","serial":"L-12","band":"Company","title":"Cross-domain integration with Joint, Air and Maritime","sub":"Integration of the land force with Joint, Air and Maritime partners (CAS requests, coastal observation to maritime, federated mission-partner exchange).","cls":"MS","prec":"Immediate","env":"UNK","lpi":4,"avail":"High (24/7)","timeWindow":"Event-driven","zones":"Joint AOO · multinational CoI","ier":{"who":"Bde / BG liaison and Air (JTAC/ASOC) and Maritime and mission partners","what":"CAS requests, cross-domain tracks and federated exchange via CDS","when":"Event-driven","protection":"Mission Secret · CDS · STANAG 4774","volume":"Medium · mixed"},"equipment":["Digitally-aided Close Air Support (JTAC and aircraft)","Cross-domain track exchange via CDS (Advenica / Fox-IT)","Coastal observation push to a maritime mission partner","FMN federated mission-partner gateway"],"attackSurface":"Cross-domain gateways are prime cyber targets. Mitigation: CDS, zero-trust and labelled releasability.","c2d2e":"","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1051"],"coi":["CI-1062"],"tc05":"FMN Mission-Network partners (NNN / IO) · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]},{"id":"UC-L-013","serial":"L-13","band":"Brigade","title":"C2D2E (DDIL + AI) — AI-managed adaptive frequency hopping and dynamic spectrum access · land tactical (Brigade and below)","sub":"A Brigade-and-below land force operating under jamming, direction-finding and a contested electromagnetic spectrum sustains the COP and fires C2 by using AI to drive adaptive / cognitive Fast Frequency Hopping (FFH) and Dynamic Spectrum Access (DSA) across dismounted, vehicular and command-post bearers. This is the comprehensive C2D2E (DDIL + AI) Use Case for the land domain and folds every C2D2E capability thread. It folds 12 C2D2E capability threads into one Information-Exchange Use Case:\n• Disruption-tolerant COP synchronisation — Disconnected and intermittently-connected nodes keep a usable Common Operational Picture by exchanging signed, content-addressed updates that converge automatically on reconnection — no operator merge.\n• Autonomous PACE-plan bearer failover — When the primary bearer is denied, C2 traffic fails over automatically across the Primary / Alternate / Contingency / Emergency plan, with operators notified of each demotion.\n• Data-centric replication under intermittent links — Mission data is replicated by content and subscription rather than by connection, so a consumer receives the latest signed object as soon as any path becomes available.\n• Mission command by intent under denial — An isolated subordinate continues to act within the commander's cached intent and CCIR while reach-back is denied; decisions reconcile automatically when connectivity returns.\n• AI spectrum sensing and dynamic spectrum access — An on-platform model senses the local spectrum and re-homes the link to a clear channel within policy when congestion or interference appears (cognitive radio).\n• AI adaptive routing and QoS under congestion — An AI routing agent observes the DTN overlay and continuously re-shapes routing and QoS so mission-essential IERs keep flowing while bulk traffic is shed or deferred.\n• AI link-quality prediction and proactive bearer/waveform selection — A predictive model forecasts imminent link degradation from telemetry and pre-emptively switches bearer or waveform before the link fails, minimising disruption.\n• AI bandwidth/codec adaptation and semantic compression — AI adapts codec, bandwidth and content fidelity to the available link — using semantic compression so mission-essential meaning survives even when throughput collapses.\n• Electromagnetic-environment knowledge generation (EMS picture) — Distributed RF sensing is fused by AI into an electromagnetic-environment picture — emitters geolocated, classified and identified — and cued to EW and C2 consumers.\n• Cognitive EW — AI jamming detection and EPM response — AI classifies an interference event as hostile jamming and drives an electronic-protection response (frequency hopping, nulling, re-home), assessing effectiveness and reporting per AJP-3.6.\n• AI-managed emission control (EMCON) and LPI/LPD posture — AI advises and (within policy) manages emission control and the LPI/LPD posture as the threat picture and mission phase change, minimising the force's electromagnetic signature.\n• AI anomaly and intrusion detection on tactical networks (zero-trust) — AI flags anomalous behaviour on a mission-network element under a zero-trust model, contains the suspect entity, and reports the incident per AJP-3.20 with mission-impact assessment.","cls":"NS","prec":"Immediate","env":"HO","lpi":5,"avail":"High","timeWindow":"Continuous; phase- and threat-driven","zones":"Contested electromagnetic spectrum · all domains","equipment":["NBWF VHF Low 30–88 MHz · frequency hopping (STANAG 5630 / 5634)","SATURN Ed.4 (PRF-151) UHF 225–400 MHz · Fast Frequency Hopping (FFH)","HAVE QUICK II UHF 225–400 MHz · frequency hopping","ESSOR HDR UHF / L-band 225 MHz – 2.5 GHz · adaptive wideband waveform with hopping","AI-driven cognitive Dynamic Spectrum Access (DSA) and proactive hop-set / waveform selection (TC09 LPI/LPD)"],"attackSurface":"Eventual consistency can be poisoned by forged deltas. Mitigation: object signing, causal ordering, label-bound provenance, and rejection of unsigned or out-of-policy updates. An adversary can try to force repeated costly failovers (flapping). Mitigation: hysteresis, authenticated health signals, and rate-limited demotion/promotion. Interest/subscription flooding and cache poisoning. Mitigation: signed interests, quota enforcement, and signature verification before caching. Stale or forged intent could mis-direct an isolated unit. Mitigation: signed, time-bounded intent packages, explicit delegation limits, and reconciliation review on reconnection. Adversaries can spoof occupancy to herd the radio onto monitored channels. Mitigation: signed policy bounds, anomaly checks on sensing input, and human-on-the-loop for out-of-policy moves. A learning router can be gamed by crafted load. Mitigation: bounded policy envelope, explainability logs, and fallback to deterministic priority routing. Telemetry poisoning could trigger needless or harmful switches. Mitigation: authenticated telemetry, conservative switch thresholds, and audit of every pre-emptive action. Over-aggressive compression can drop safety-critical detail. Mitigation: enforced fidelity floors per product class and human-defined essential-elements that are never dropped. Decoy emitters and spoofed signatures can mislead the EMS picture. Mitigation: multi-sensor corroboration, confidence scoring, and identity treated as Unknown until corroborated. Mis-classifying friendly/neutral emissions as hostile risks fratricide in the spectrum. Mitigation: corroborated classification, human-on-the-loop for active EA, and conservative EPM-only defaults. An adversary may try to provoke emissions to fingerprint the force. Mitigation: conservative EMCON defaults, human authority for posture relaxation, and decoy/randomised emission management. The detector and its model are themselves targets (evasion, poisoning). Mitigation: model hardening, out-of-band telemetry, segmentation to contain lateral movement, and human triage of high-impact actions. Under active C2D2E electromagnetic warfare the adversary saturates the spectrum: GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time), AI-managed frequency hopping and dynamic spectrum access, disruption-tolerant networking and strict EMCON.","ier":{"who":"EMCON AI advisor ↔ commander (human-on-the-loop) ↔ emitting systems","what":"Aggregates 12 C2D2E capability threads for operating under DDIL conditions with AI-enabled communications: Disruption-tolerant COP synchronisation; Autonomous PACE-plan bearer failover; Data-centric replication under intermittent links; Mission command by intent under denial; AI spectrum sensing and dynamic spectrum access; AI adaptive routing and QoS under congestion; AI link-quality prediction and proactive bearer/waveform selection; AI bandwidth/codec adaptation and semantic compression; Electromagnetic-environment knowledge generation (EMS picture); Cognitive EW — AI jamming detection and EPM response; AI-managed emission control (EMCON) and LPI/LPD posture; AI anomaly and intrusion detection on tactical networks (zero-trust).","when":"Event-driven on threat/phase change","protection":"NATO Secret · signed EMCON policy · STANAG 4774 labels","volume":"Low · posture directives"},"c2d2e":"C2D2E (DDIL + AI)","gov":{"owner":"","authority":"","reviewStatus":"DRAFT","reviewDate":""},"commsSvc":["CO-1083","CO-1057"],"coi":["CI-1062"],"tc05":"NATO; selected partners via CDS · FMN Spiral 5","climate":["A1","A2","A3","B1","B2","B3","C0","C1","C2","C3","C4"]}],"capElem":[{"id":"R.I.101","cap":"Domain Situational Awareness — Recognized Ground Picture (RGP)","fmn":"FMN Spiral 4 · SPO MSA","kpi":"TPPS · ADC","nisp":"Illustrative ID — mapped to a validated C3 Taxonomy B7 branch (see C3 node); not a NISP B16 identifier","c3node":"C3-INFO"},{"id":"R.I.102","cap":"Targeting / Fires Support","fmn":"FMN Spiral 5","kpi":"DPD · ADC","nisp":"Illustrative ID — mapped to a validated C3 Taxonomy B7 NBWF backbone available · NATO Type A keymat loaded · APP-11(E) MTF over MIP / JDSSDM (STANAG 4677) · alternate PACE path","postconditions":"Formal message delivered and receipted; auditable C2 record retained (REQ L1.1)"},{"ucId":"UC-L-002","goal":"Compile and disseminate the Recognized Ground Picture across the Brigade","trigger":"Continuous; land tracks and ORBAT updating from sensors and units","preconditions":"NFFI / MIP track service up · JC3IEDM ORBAT current · STANAG 4162 identity rules applied · CDS at Division reach-back","postconditions":"Single RGP with consistent identity distributed to subordinate and flanking units (REQ L2.1)"},{"ucId":"UC-L-003","goal":"Maintain continuous Blue Force Tracking and land situational awareness, including multinational FFT","trigger":"Continuous; friendly position trickle from all bearers","preconditions":"NFFI BFT over NBWF active · multinational FFT gateway up · releasability geo-fencing applied","postconditions":"Coherent friendly picture maintained with graceful degradation on backbone loss (REQ L3.1)"},{"ucId":"UC-L-004","goal":"Coordinate combined-arms manoeuvre across the Battle Group","trigger":"Manoeuvre phase or contact requiring control-measure update and tasking","preconditions":"SitaWare Frontline at vehicle / company · NBWF / SATURN combat net · Battlefield Control Measures push (MIP) available","postconditions":"Synchronised manoeuvre executed with shared control measures; tempo maintained under EMCON (REQ L4.1)"},{"ucId":"UC-L-005","goal":"Coordinate Ground-Based Air Defence engagement and share the local air picture","trigger":"Air threat detected; engagement decision required","preconditions":"GBAD fire-control net up · segment-of-RAP / JREAP-C air picture available · engagement authority defined","postconditions":"Threat engaged or handed off; deconfliction maintained with the air component (REQ L5.1)"},{"ucId":"UC-L-006","goal":"Execute Call For Fire and deep-fires coordination from observer to delivery","trigger":"Target detected; fires effect requested","preconditions":"Digitally-aided fires net up · target data validated · cross-national CFF (MIP / NFFI) federated · airspace deconflicted","postconditions":"Fires delivered on time and on target; effect reported; fratricide and collateral risk mitigated (REQ L6.1)"},{"ucId":"UC-L-007","goal":"Task ISTAR and EW assets and fuse their reporting into the intelligence cycle","trigger":"Collection requirement or EW effect requested by the commander","preconditions":"EWCC / CIFC tasking net up · ISTAR sensor feeds to Bde ASAC · STANAG 4774 labels applied","postconditions":"Tasking executed; INTREP and EW effects fed to the RGP and the fires cycle (REQ L7.1)"},{"ucId":"UC-L-008","goal":"Distribute obstacle, route and counter-mobility plans across the formation","trigger":"Engineer plan produced or changed; route status update","preconditions":"SitaWare geospatial layer current · engineer overlays (MIP / NVG) available · need-to-know enforced","postconditions":"Obstacle and route plans synchronised; mobility and counter-mobility coordinated (REQ L8.1)"},{"ucId":"UC-L-009","goal":"Coordinate casualty evacuation and personnel recovery from point of injury to treatment","trigger":"Casualty or isolated-personnel event","preconditions":"9-Liner CASEVAC net up · MEDEVAC / PR assets available · medical CoI releasability set","postconditions":"Casualty evacuated or personnel recovered within the timeline; status tracked (REQ L9.1)"},{"ucId":"UC-L-010","goal":"Report the logistics situation up the chain and coordinate sustainment","trigger":"Reporting cycle or supply shortage event","preconditions":"LOGFAS-equivalent reporting up · convoy tracking resilient to GPS denial · LOGREP over MIP / JDSSDM","postconditions":"Sustainment picture current; demands actioned; convoys coordinated under denial (REQ L10.1)"},{"ucId":"UC-L-011","goal":"Disseminate UAS and sensor full-motion video and reports to the Brigade ISR architecture","trigger":"ISR sortie or collection request active","preconditions":"UAS GCS feed up · full-motion-video downlink (LOS UHF / SHF) available · CCIR / collection plan current","postconditions":"FMV and reports disseminated; collection requirements answered into the RGP (REQ L11.1)"},{"ucId":"UC-L-012","goal":"Integrate the land force with Joint, Air and Maritime partners through a federated mission network","trigger":"Cross-domain effect (CAS, coastal observation, partner exchange) required","preconditions":"CDS (Advenica / Fox-IT) up · FMN gateway federated · STANAG 4774 releasability labels applied","postconditions":"Cross-domain exchange completed across the security boundary with labelled releasability (REQ L12.1)"}],"echelons":[{"lbl":"Company","tier":"L","desc":"1.5 × 1.5 km AOR · NBWF + legacy VHF + XMPP — MC 0640 lowest in scope"},{"lbl":"Battle Group","tier":"M","desc":"4 × 5 km AOR · ESSOR HDR + NBWF, PCR stand-up via SATCOM"},{"lbl":"Brigade","tier":"M","desc":"15 × 25 km AOR · MarLOS STANAG 4691 + SATURN Ed.4 + PCN tunnels — top of MC 0640 focus"},{"lbl":"Division","tier":"H","desc":"30 × 60 km AOR · reach-back target for Bde · MC 0593 territory","upstream":true},{"lbl":"Corps","tier":"H","desc":"Multi-division strategic backbone · MC 0593 territory","upstream":true},{"lbl":"LANDCOM","tier":"H","desc":"Land Component Command — theatre-level C2 hub · MC 0593 territory","upstream":true}],"scenarios":[{"code":"LAND-MN","name":"Land Vigilance — Standing Mission Network","phase":"Standing / multi-JOA","note":"Standing land Mission Network enabling warfighting C2 across SACEUR’s land AOR from peacetime through crisis to conflict; common infrastructure and a single land information domain for the Regional Plans."},{"code":"LAND-S1","name":"Peacetime — deterrence presence and SA","phase":"COPD v3 · Phase 4","note":"Baseline land situational awareness, Blue Force Tracking and deterrence presence (enhanced Forward Presence)."},{"code":"LAND-S2","name":"Crisis Response — Major Joint Operation (NCS LCC)","phase":"COPD v3 · Phase 4-5","note":"Crisis Response Operation, Major Joint Operation; NATO Command Structure Land Component / Corps stood up over subordinate brigades."},{"code":"LAND-S3","name":"Crisis Response — Smaller Joint Operation (brigade task force)","phase":"COPD v3 · Phase 5","note":"Smaller Joint Operation conducted by a brigade task force with battle groups and companies."},{"code":"LAND-S4","name":"Collective Defence — high-intensity land warfighting","phase":"COPD v3 · Phase 6","note":"Article 5 collective defence; high-intensity combined-arms manoeuvre against a peer adversary."},{"code":"LAND-OFF","name":"Offensive manoeuvre / combined-arms operations","phase":"Manoeuvre","note":"Brigade and battle-group offensive manoeuvre with integrated fires, ISTAR and engineer support."},{"code":"LAND-DEF","name":"Defensive and stabilisation operations","phase":"Defence / stability","note":"Defensive operations, counter-mobility and stabilisation tasks with multinational and civil coordination."},{"code":"LAND-AINT","name":"Air-Land integration (CAS and airspace coordination)","phase":"Air-Land integration","note":"Close Air Support request and control (JTAC) and airspace coordination measures with the air component."},{"code":"C2D2E-EW","name":"Contested EMS — active C2D2E / electromagnetic warfare","phase":"Enemy confrontation (hostile environment)","note":"Whenever the environment is hostile with the adversary present, an active C2D2E electromagnetic-warfare scenario applies to the Land domain: the enemy saturates the spectrum so that GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time / eLORAN where available), AI-managed Fast Frequency Hopping and Dynamic Spectrum Access, disruption-tolerant networking and strict EMCON. This scenario underlies every hostile (TC03 = Hostile) Use Case in the domain."}],"tdlLinks":[],"cisServices":[],"narratives":[{"id":"N-L-exec","order":10,"section":"Executive Summary","title":"What this report contains and how to read it","source":"§ 1 · Executive Summary","body":"<p>This Technical Report presents 38 Use Cases for the Land Tactical CIS profile <strong>PFL-00403</strong>, drawn from the Information Exchange Requirement tables of <strong>Annex C to Draft MC 0640</strong>. UC-001..UC-032 cover the steady-state Brigade-and-below catalogue; UC-033..UC-038 are tactical Land IERs anchored in the new doctrine of the <strong>Allied Reaction Force (ARF)</strong> operating under MC 0593 across the three Regional Plans (Norte · Centro · Sur) and through Major Joint Operations Adjacent. Every UC is generated under the <strong>NAF v4 + ADatP-47</strong> methodology, grounded in <strong>AJP-5</strong> (Operational Planning), <strong>AJP-6</strong> (CIS) and <strong>AJP-01</strong> (Allied Joint Doctrine), and overlaid with the <strong>FMN Spiral 6</strong> technical realities (Data-Centric Security · Attribute-Based Encryption · STANAG&nbsp;4606&nbsp;Ed.&nbsp;4 protected tactical communications · accredited unmanned sensor federations).</p>\n    <p>Every UC card carries two parts: a <em>NAF v4 · ADatP-47 Specification Header</em> (formal IER ID, primary actor, goal, trigger, pre/postconditions, NAF view, FMN service, releasability, doctrinal basis) and a <em>14-row Operational Body</em> (the six IER dimensions plus equipment, time window, environment, zones, availability, classification, risk meter, and attack surface). The \"Copy\" button on each card emits a Word-ready HTML table — paste directly into a Word document.</p>\n    <div>\n      <div><h3>Scope</h3><p>Brigade · Battle Group · Company. MC 0640 covers LANDCOM downward; this report focuses on Bde-and-below. Upper echelons (Division, Corps, LANDCOM) appear only as upstream reach-back context.</p></div>\n      <div><h3>Method</h3><p>NAF v4 NOV/NSOV views + ADatP-47 SysML-style UC packages. AJP-5 supplies commander's intent; AJP-6 mandates the service-oriented stance. STEADFAST COBALT supplies the technical constraints.</p></div>\n      <div><h3>Realisation</h3><p>FMN Spiral 5 / NISP Baseline 16 services on a typical NATO stack: <strong>Systematic SitaWare</strong> on <strong>Klas Voyager</strong>, routed by <strong>Cisco ESR6300</strong>, into <strong>Thales Synaps</strong> / <strong>L3Harris AN/PRC-163</strong> SDRs, with <strong>Advenica / Fox-IT</strong> CDS at every NNI.</p></div>\n    </div>"},{"id":"N-L-methodology","order":20,"section":"Methodology","title":"Scientific method applied to deterministic Technical Report generation","source":"§ 2 · Methodology","body":"<p>This Technical Report is generated by applying the <strong>scientific method</strong> deterministically to NATO authoritative sources for the <strong>Land</strong> domain (canonical source: <strong>MC 0640</strong>): the <strong>AJP-6</strong> IER framework, <strong>APP-15</strong> + the Capability Element (CapElem) model, the <strong>NAF v4.1</strong> viewpoints, the <strong>NATO C3 Taxonomy Baseline 7.0</strong>, <strong>AJP-3.2</strong> doctrine, and AAP-06 / AAP-15 terminology. The same inputs always produce the same Use Cases, their CapElem stacks, the §10 CapElem catalogue and the Annexes; every claim is traceable to a reference identifier in §12.</p>\n\n    <h2>2.1 — Scientific-method phases applied to Land CIS Use Case generation</h2>\n    <table>\n      <thead><tr><th>Phase</th><th>Activity in this Technical Report</th><th>Deterministic output</th></tr></thead>\n      <tbody>\n        <tr><td><strong>1. Observation</strong></td><td>Catalogue the Land information exchanges between the entities of this directive (Company · Battle Group · Brigade); record each flow with its IE Product and C3 Taxonomy Baseline 7.0 mapping.</td><td>Land IER inventory across the Company · Battle Group · Brigade tiers.</td></tr>\n        <tr><td><strong>2. Hypothesis</strong></td><td>State the convention: each IER is a <em>Requirement (REQ)</em> fulfilled by a Use Case paired 1:1 with it under FMN Spiral 5, within the MC 0640 scope.</td><td>Mapping rule <code>REQ ↔ UC</code> across the domain tiers (Company · Battle Group · Brigade).</td></tr>\n        <tr><td><strong>3. Experimentation</strong></td><td>Apply the NAF v4.1 + APP-15 framework to each Use Case; populate the formal specification header (primary actor, goal, trigger, pre/postconditions, NAF view, NAF/APP-15 artifact, FMN service, releasability, doctrinal basis).</td><td>Per-UC 16-field spec header, deterministically derived from the entity-pair + tier + AAP-06 terminology.</td></tr>\n        <tr><td><strong>4. Analysis</strong></td><td>Fill the 14-row operational body against the <strong>TC01–TC11</strong> constraints (the six IER dimensions plus frequencies, temporal window, environment/track identity, zones &amp; CoIs, collaboration, availability, classification, risk LPI/LPD, environmental conditions and attack surface) and resolve the Capability Element stack.</td><td>14-row body per UC, with track identity per STANAG 4162 and bearer/standards in the equipment row (vendor identity deferred to Annex A).</td></tr>\n        <tr><td><strong>5. Conclusion</strong></td><td>Resolve each Use Case to its Capability Element stack (<code>A.B.NNN</code>, status R/P/F × C3 category I/A/S/C/N/M) and map the realising components in Annex A.</td><td>§10 Capability Element (CapElem) catalogue + §9 Use Case cards + Annex A architecture mapping.</td></tr>\n        <tr><td><strong>6. Reproducibility</strong></td><td>Every transform between input and output is explicit and deterministic; a qualified reader applying the same NATO sources reproduces the same Technical Report.</td><td>Audit-replayable Technical Report — a single self-contained <code>.html</code> file with no runtime network.</td></tr>\n      </tbody>\n    </table>\n\n    <h2>2.2 — Deterministic input / output contract</h2>\n    <div>\n      <div><h3>Canonical inputs</h3>\n        <ul>\n          <li><strong>MC 0640</strong> — Land tactical directive (PFL-00403 / FMN Spiral 5)</li>\n          <li><strong>AJP-6</strong> IER framework + <strong>APP-15</strong> IER management (REQ → CapElem)</li>\n          <li><strong>NAF v4.1</strong> NOV + NSOV viewpoints</li>\n          <li><strong>NATO C3 Taxonomy Baseline 7.0</strong> (L1 / L2 service classification)</li>\n          <li><strong>FMN Spiral 5</strong> / NISP Baseline 16 (Spiral 6 = anticipatory)</li>\n          <li>AJP-3.2 doctrine · AAP-06 / AAP-15 terminology · STANAG 4162 identity</li>\n        </ul></div>\n      <div><h3>Deterministic outputs</h3>\n        <ul>\n          <li>§9 Use Case cards — NAF v4.1 / APP-15 header + 14-row TC01–TC11 body</li>\n          <li>§10 Capability Element (CapElem) catalogue</li>\n          <li>§8.3 Figures of Merit &amp; KPIs · §8.4 Technical Constraints</li>\n          <li>Annex A architecture mapping · Annex B formal definitions</li>\n          <li>A self-contained, audit-replayable single-page Technical Report</li>\n        </ul></div>\n    </div>"},{"id":"N-L-conclusions","order":30,"section":"Findings and Conclusions","title":"What this Technical Report demonstrates, and what remains open","source":"§ 11 · Conclusions &amp; Findings","body":"<p>This Technical Report has applied the NAF v4 + ADatP-47 framework deterministically to the Information Exchange Requirement tables of <strong>Draft MC 0640 Annex C</strong>, producing 32 representative Use Cases across the three echelons in scope (Company · Battle Group · Brigade). Each UC carries the full formal specification header (16 fields per §8.1) and the 14-row operational body (§8.2), and is realisable on the typical NATO ground stack documented in Annex A and Annex C.</p>\n\n    <h2>11.1 — Coverage assessment</h2>\n    <div>\n      <div><h3>Echelon coverage</h3><p>All three MC 0640 tactical bands at 38 UCs total: <strong>Company</strong> (11 UCs — voice + chat + BFT + fires + CASEVAC + recce + ARF-context coastal CT), <strong>Battle Group</strong> (11 UCs — CP stand-up + BFT + formal messaging + VTC + multinational coordination + cross-national CFF + RSOMI under GPS denial), <strong>Brigade</strong> (16 UCs — fires + intel + airspace + EW + sustainment + UAS ISR + coastal observation push to ARF Maritime MNE + GBAD RAP segment + Bde-to-Bde Strategic Swing hand-off). UC-033..UC-038 are tactical Land IERs anchored in ARF / Regional Plan / MJO-Adjacent scenarios (ARCTIC SENTINEL · BALTIC SHIELD · MEDITERRANEAN GUARDIAN · BLACK SEA HORIZON · CYBER REACH-BACK · STRATEGIC SWING) with the FMN Spiral 6 overlay (DCS · ABE · STANAG 4606 Ed.&nbsp;4).</p></div>\n      <div><h3>Service coverage</h3><p>The FMN Spiral 5 / PFL-00403 service catalog is exercised across <em>Voice (Secure)</em>, <em>Tactical Messaging (XMPP)</em>, <em>Military Messaging (APP-11 MTF)</em>, <em>Situational Awareness (NFFI / BFT)</em>, <em>Targeting (AEP-76 / JDSSDM Overlay+Contact)</em>, <em>Environmental (METEOC / JDSSDM GenInfo)</em>, <em>VTC + Office Collab</em>, <em>Logistics</em>, <em>EW Services</em>, <em>Information Management / Document Collab</em>, <em>Core Networking (PCN)</em>, and <em>Airspace Management</em>.</p></div>\n      <div><h3>Threat coverage</h3><p>Risk meter spans 1/5 (garrison RF) to 5/5 (LPI+LPD mission-critical under EW). The four STEADFAST COBALT constraint blocks (PCN · echelon-tiered bandwidth · STANAG 4774 NNI labels · NFV/DCIS) are mapped onto every UC's row 7 (Equipment) and row 14 (Attack Surface).</p></div>\n    </div>\n\n    <h2>11.2 — Key findings</h2>\n    <ul>\n      <li><strong>Bearer tier maps cleanly to echelon.</strong> Company-level UCs land predominantly on NBWF (VHF 30–88 MHz / UHF 225–400 MHz, 25 kHz channels) with MELPe-2400. BG/Bde UCs land on ESSOR HDR (UHF/L-band 225 MHz – 2.5 GHz) with SATCOM uplink for higher reach-back. No UC required a bearer outside the NBWF/ESSOR/SATURN/SATCOM matrix.</li>\n      <li><strong>PCN is the single point of trust at BDE-and-up.</strong> STANAG 4711 IPsec PCN + BGP-4 federation appears as a precondition in 18 of 32 UCs. PCR compromise would cascade through every dependent UC — addressed via TCP-AO authentication and RPKI-style origin validation.</li>\n      <li><strong>STANAG 4774 label enforcement is the federation-critical control.</strong> Cross-domain releasability decisions (NS → NR/NU degradation) recur in 7 UCs spanning intel ingress, multinational BFT, and air-ground coordination. Advenica / Fox-IT CDS appliances are the named realisation in Annex A.</li>\n      <li><strong>NFV stand-up time is the operational tempo gate.</strong> The STEADFAST COBALT &lt;30-minute target appears explicitly in UC-002 (BG CP stand-up, &lt;20 min target) and UC-032 (Coy NFV blade restore, &lt;30 min). The Klas Voyager + Cisco ESR6300 + Systematic SitaWare Edge stack is the de-facto realisation.</li>\n      <li><strong>Vendor consolidation around four blocks.</strong> The 32 NATO nations procure across the four blocks listed in §6 (SDR · NFV · C2 software · CDS). Annex A confirms a typical UC requires at least one vendor from each of Block 1, 2 and 3; Block 4 (CDS) appears only in cross-domain UCs.</li>\n    </ul>\n\n    <h2>11.3 — Open work &amp; future iterations</h2>\n    <ul>\n      <li><strong>Validation status:</strong> all UCs are currently <code>DRAFT v0.1</code>. Ratification by LANDCOM CCIS Branch and the FMN community of interest is required before any UC moves to <code>APPROVED</code>.</li>\n      <li><strong>Annex C coverage:</strong> the 32 UCs sample the inventory of <strong>1,339 persisted Annex C Serials</strong> (extraction exhausts the source PDF; Air Support / Medical / Non-NATO sections are absent from this copy of Draft MC 0640). The UC&nbsp;↔&nbsp;Serial mapping is persisted as <code>serials/uc_serial_map.json</code>: 24 of the 32 UCs anchor to a canonical Annex C row, 4 are unmapped (Medical / restore / UAS-as-source / BG-VTC gaps), 7 anchor labels were corrected against the canonical JSON, and the §10 Serial sample was regenerated row-by-row from the JSON. A full reverse index (every Annex C Serial → UC) is the next iteration.</li>\n      <li><strong>PFL-00403 enrichment:</strong> every one of the 1,339 Serials now carries an <code>enrich:{…}</code> field — typical bearer, frequency band, STANAG anchors, LPI/LPD base, default availability, and attack-surface theme — derived from a 4&nbsp;tier × 12&nbsp;category matrix in <code>serials/enrichment_dictionary.json</code> and persisted as <code>serials/annexC_enriched.json</code>. Coverage is 100% (every entity in the extraction and every IE Product is mapped). STANAG anchors are derived from STEADFAST&nbsp;COBALT + the canonical UCs and still need cross-validation against the formal NISP Baseline 16 PFL-00403 entry.</li>\n      <li><strong>NISP B16 alignment audit (2026-05-22):</strong> verified against the canonical Service Area CI-1062 inventory. <strong>PFL-00403</strong> (the deliverable's anchor) is confirmed as <em>Land Tactical C2 IE Profile (FMN Spiral 5)</em>, mandating AEP-76 Edition A Version 3 (2023) Volumes I–V under STANAG 4677 Ed.1, with the JDSSDM 1.2 message set on the JDSS Gateway in exclusive mode (BR BACK010). <strong>PFL-00446</strong> \"IP Access to Tactical Radio (FMN Spiral 5)\" is confirmed as the canonical edge-IP profile cited in Coy-band UCs (mandates AEP-76 Volume V). A separate finding: many UC equipment lines reference <em>\"MIP4\"</em> generically — strictly, PFL-00403 uses MIP 3.1 XML extended with JDSSDM 1.2 (not MIP4). MIP4 = PFL-00402 is a peer profile in the same Spiral 5; PFL-00405 mediates between them. Future iteration: tighten Coy / BG card text to read \"AEP-76 / JDSSDM (STANAG 4677)\" where the canonical anchor is JDSS rather than MIP4.</li>\n      <li><strong>UAS data-link characterisation (UC-028):</strong> the platform-specific L/C-band data link is intentionally generic. Per-platform refinement (e.g. specific NATO RPAS Initial Capability waveforms) belongs to a follow-on iteration.</li>\n      <li><strong>Bilateral / national-specific bearers</strong> (e.g. national C2 stacks of Nations C/D in UC-016) are abstracted in this report. A nation-specific edition can substitute Systematic SitaWare with national C2 stacks while keeping the FMN-side profile identical.</li>\n    </ul>\n\n    <h2>11.4 — Audit history</h2>\n    <p>Chronological trail of substantive changes applied since the initial draft. Each row represents a closed audit / iteration cycle.</p>\n    <table>\n      <thead><tr><th>Date</th><th>Iteration</th><th>Outcome</th></tr></thead>\n      <tbody>\n        <tr><td>2026-05-20</td><td>Initial draft (v0.1)</td><td>32 UCs (Coy 10 / BG 9 / Bde 13) generated under NAF v4 + ADatP-47. Annex C extraction underway.</td></tr>\n        <tr><td>2026-05-21</td><td>Annex C extraction complete</td><td>1,339 Serials persisted (S-001..S-1339) covering Tables C-1..C-7 (partial C-7); PDF source exhausted. UC↔Serial Phase 1 mapping (24/32 anchored, 7 anchor labels corrected). SERIAL_SAMPLE regenerated against canonical JSON. PFL-00403 enrichment dictionary applied to all 1,339 rows.</td></tr>\n        <tr><td>2026-05-22 (am)</td><td>HTML interactive · §10 enrichment surfacing</td><td>§10 Serial rows clickable to expand bearer/freq/STANAGs/LPI/attack-theme detail. §4 framework expanded with MC 0593 capstone + MC 0640/0195/0655 tactical siblings + Space/Cyber transversal.</td></tr>\n        <tr><td>2026-05-22 (am)</td><td>UC-033..UC-038 ARF scenarios</td><td>Six tactical Land IERs (Coy/BG/Bde) anchored in ARCTIC SENTINEL · BALTIC SHIELD · MEDITERRANEAN GUARDIAN · BLACK SEA HORIZON · CYBER REACH-BACK · STRATEGIC SWING. Modal CRUD + JSON schema v0.2 extended with Strategic doctrinal fields + IER matrix array editor.</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>NISP B16 alignment audit</td><td>Verified against canonical CI-1062 Land Domain Services inventory (7 PFLs) + related profiles (PFL-00312 / PFL-00446 / PFL-00406 / PFL-00408). MIP4 → JDSSDM/AEP-76 cleanup applied (45 patterns HTML, 10 dictionary; 21 MIP4 mentions preserved intentionally as acronym / explicit PFL-00402 distinction). STANAG 5525 → STANAG 4677 across enrichment. §4 panel with AEP-76 Volume map + JDSS message taxonomy + FMN Spiral 6 disclaimer. §12 References A–R augmented with D / D.1 / D.2 / D.3 (STANAG 4677 · STANAG 4619 · APP-6(D)).</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Vendor URL audit</td><td>VENDOR_URLS map rebuilt against live vendor sites: 6 broken deep links rolled back to verified homepages; Systematic SitaWare migrated to <code>/int/industries/defence/products/sitaware-suite/{component}/</code>; Curtiss-Wright PacStar rebased to <code>defense-solutions.curtisswright.com</code>; Leonardo Guardian Vantage added (uk.leonardo.com — modular passive land EW + SIGINT) and surfaced in UC-023 equipment row. SitaWare Tactical Communication added as a new entry.</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Final re-apply &amp; sanity check</td><td>annexC_enriched.json regenerated against the corrected dictionary (0 STANAG 5525, 0 MIP4, 74 STANAG 4677, 306 JDSSDM/AEP-76). Embedded JSON validated (11 keys, 4 tiers). JS braces balanced (1156/1156). USE_CASES closure verified. 38 UC entries (Coy 11 / BG 11 / Bde 16).</td></tr>\n        <tr><td>2026-05-22 (pm)</td><td>Internal anchors + reference URL audit</td><td>All 28 distinct <code>href=\"#xxx\"</code> anchors in topnav/inline resolve to existing element IDs (37 total intra-document links · 0 broken). External reference URLs: IETF RFC 6120/6121 ✓ 200; coemed.org AJP-6 and AJP-3.2 PDFs ✓ served; nso.nato.int / NISP B16 catalogue confirmed gated to NATO PKI (anonymous → 404 by design). Footer note in §12 updated to explain link behaviour.</td></tr>\n      </tbody>\n    </table>"}]}},"M":{"code":"M","name":"Maritime","mc":"MC 0195/13","reqPrefix":"M","c ted bearer scoring","Content-addressed object store with subscription/interest forwarding","DTN Bundle Protocol v7 (RFC 9171) custody transfer","Attribute-based access control bound to STANAG 4778 metadata","Anticipatory (FMN Spiral 6)","AI routing/QoS agent over the DTN + IP overlay","DSCP / MLPP priority policy with explainable decisions","Graceful degradation: priority IERs preserved, bulk deferred","Cognitive-EW classifier consuming the EMS picture","EPM repertoire: fast frequency hopping (SATURN STANAG 4372 style), spatial nulling, channel re-home","Automated OPTASK-EW-style reporting (AJP-3.6)","Anticipatory (FMN Spiral 6) · human-on-the-loop for offensive effects"],"attackSurface":"An adversary can try to force repeated costly failovers (flapping). Mitigation: hysteresis, authenticated health signals, and rate-limited demotion/promotion. Interest/subscription flooding and cache poisoning. Mitigation: signed interests, quota enforcement, and signature verification before caching. A learning router can be gamed by crafted load. Mitigation: bounded policy envelope, explainability logs, and fallback to deterministic priority routing. Mis-classifying friendly/neutral emissions as hostile risks fratricide in the spectrum. Mitigation: corroborated classification, human-on-the-loop for active EA, and conservative EPM-only defaults. Under active C2D2E electromagnetic warfare the adversary saturates the spectrum: GPS / GNSS reception is completely denied (jamming) and combat-net communications are jammed, with direction-finding threatening every emitter. The force sustains C2 through alternative PNT (inertial / networked time), AI-managed frequency hopping and dynamic spectrum access, disruption-tolerant networking and strict EMCON.","ier":{"who":"C2 node ↔ transport manager ↔ available bearers","what":"Aggregates 4 C2D2E capability threads for operating under DDIL conditions with AI-enabled communications: Autonomous PACE-plan bearer failover; Data-centric replication
